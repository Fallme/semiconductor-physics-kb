// ============ Chapter 6: PN结 ============
{title:"第6章 PN结",sub:"能带、I-V特性、击穿与电容",tag:"考研重点章",kps:[
{n:"PN结的形成与内建电场",s:"★★★★★",exam:1,body:`<p><strong>PN结</strong>：P型和N型半导体接触形成的界面区域。是几乎所有半导体器件的基本结构。</p>
<div class="formula-box">形成过程：<br>① P区空穴向N区扩散，N区电子向P区扩散<br>② 界面附近留下不能移动的电离杂质<br>P侧：N_A⁻（负电荷）<br>N侧：N_D⁺（正电荷）<br>③ 空间电荷产生内建电场 E_D<br>④ 电场阻碍进一步扩散，达到平衡<br><br>内建电势：<br>V_D = (kT/q)·ln(N_A·N_D/ni²)<br><br>空间电荷区宽度：<br>W = √[2ε(V_D-V)(N_A+N_D)/(qN_AN_D)]</div>
<p><strong>关键特征</strong>：</p>
<p>① 空间电荷区（耗尽层）中载流子被扫出，只留下电离杂质</p>
<p>② 耗尽层外的P区和N区是电中性的</p>
<p>③ 能带在空间电荷区连续弯曲，形成势垒</p>
<div class="info">Si的V_D：中等掺杂（10¹⁵~10¹⁶）约0.6-0.7V，高掺杂可达0.8V以上。</div>`},
{n:"PN结能带图",s:"★★★★★",exam:1,body:`<p><strong>零偏压能带图</strong>：</p>
<div class="formula-box">画图步骤：<br>① 分别画P型和N型的能带<br>② 让费米能级E_F对齐（热平衡条件）<br>③ 在空间电荷区，Ec和Ev连续弯曲<br><br>势垒高度：<br>qV_D = E_c(N侧) - E_c(P侧)<br>= E_i(P侧) - E_i(N侧)<br>= E_v(N侧) - E_v(P侧)</div>
<p><strong>正偏（V > 0，P接正）</strong>：</p>
<div class="formula-box">势垒降低 q(V_D - V)<br>耗尽层变窄<br>E_FN - E_FP = qV（准费米能级分裂）<br>多数载流子注入→正向电流大</div>
<p><strong>反偏（V < 0，N接正）</strong>：</p>
<div class="formula-box">势垒升高 q(V_D + |V|)<br>耗尽层变宽<br>少数载流子被抽取→反向电流小</div>
<div class="tip"><strong>考研必考</strong>：能带图的画法是PN结分析的基础。关键是掌握费米能级对齐原则和势垒随偏压的变化。</div>`},
{n:"耗尽层近似与电场分布",s:"★★★★★",exam:1,body:`<p><strong>耗尽层近似</strong>：假设空间电荷区内载流子完全耗尽，只留下固定的电离杂质电荷。</p>
<div class="formula-box">突变结（abrupt junction）：<br>N_D（N侧），N_A（P侧）<br><br>泊松方程（一维）：<br>d²V/dx² = -ρ/ε<br><br>P侧（-x_p < x < 0）：ρ = -qN_A<br>N侧（0 < x < x_n）：ρ = +qN_D<br><br>电场分布：<br>E(x) = -qN_A(x+x_p)/ε （P侧）<br>E(x) = -qN_D(x_n-x)/ε （N侧）<br><br>最大电场（x=0处）：<br>E_max = -qN_A·x_p/ε = -qN_D·x_n/ε</div>
<div class="formula-box">电中性条件：N_A·x_p = N_D·x_n<br><br>耗尽层宽度：<br>x_p = W·N_D/(N_A+N_D)<br>x_n = W·N_A/(N_A+N_D)<br><br>W = √[2ε_s·(V_D-V)(N_A+N_D)/(qN_AN_D)]<br><br>V_D-V > 0（正偏时V>0，W变窄）<br>V_D-V < 0（反偏时V<0，W变宽）</div>
<p><strong>单边突变结</strong>（N_A >> N_D，即p+n结）：</p>
<div class="formula-box">W ≈ √[2ε_s(V_D-V)/(qN_D)]<br>E_max ≈ √[2qN_D(V_D-V)/ε_s]<br>势垒电容：C = ε_s/W = ε_s/√[2ε_s(V_D-V)/(qN_D)]<br>→ C ∝ (V_D-V)^(-1/2)</div>
<div class="warn"><strong>易错</strong>：单边突变结的W和C都只取决于轻掺杂一侧的浓度。高掺杂侧可以忽略。</div>`},
{n:"线性缓变结",s:"★★★★☆",body:`<p><strong>线性缓变结</strong>：杂质浓度在空间电荷区内线性变化的PN结，常见于扩散工艺制备的PN结。</p>
<div class="formula-box">杂质分布：N(x) = a·x（在x=0处为冶金结）<br>a — 杂质梯度（cm⁻⁴）<br><br>泊松方程：<br>d²V/dx² = -qa·x/ε<br><br>电场分布（抛物线）：<br>E(x) = -qa·(W²/4-x²)/(2ε)<br><br>最大电场：<br>E_max = qa·W²/(8ε)（在x=0处）<br><br>耗尽层宽度：<br>W = [12ε(V_D-V)/(qa)]^(1/3)<br><br>C ∝ (V_D-V)^(-1/3)</div>
<p><strong>与突变结的对比</strong>：</p>
<table class="cmp"><tr><th>特征</th><th>突变结</th><th>线性缓变结</th></tr><tr><td>杂质分布</td><td>阶梯形</td><td>线性</td></tr><tr><td>W ∝</td><td>(V)^(1/2)</td><td>(V)^(1/3)</td></tr><tr><td>C ∝</td><td>(V)^(-1/2)</td><td>(V)^(-1/3)</td></tr><tr><td>E_max位置</td><td>界面处最大</td><td>界面处最大</td></tr></table>
<div class="info">实际PN结的杂质分布介于突变结和线性缓变结之间，用缓变因子1/n来描述：C ∝ V^(-1/n)，n在2~3之间。</div>`},
{n:"肖克莱方程（理想I-V特性）",s:"★★★★★",exam:1,body:`<p><strong>肖克莱方程</strong>：描述理想PN结的I-V特性关系。</p>
<div class="formula-box">推导基础：<br>① 耗尽层近似<br>② 少子扩散电流为主<br>③ 边界条件：<br>正偏时 n_p(边界) = n_p0·exp(qV/kT)<br>反偏时 同上（V<0）<br><br>结果：<br>I = I_s·[exp(qV/kT) - 1]<br><br>反向饱和电流：<br>I_s = qA[(D_p·p_n0/L_p) + (D_n·n_p0/L_n)]<br>= qAni²[D_p/(L_p·N_D) + D_n/(L_n·N_A)]</div>
<p><strong>I-V曲线特征</strong>：</p>
<p>① 正偏（V>0）：I ∝ exp(qV/kT)，指数增长</p>
<p>② 反偏（|V| >> kT/q）：I ≈ -I_s，很小的恒定反向电流</p>
<p>③ 正向导通电压：Si约0.6-0.7V，Ge约0.2-0.3V</p>
<div class="warn"><strong>肖克莱方程的限制</strong>：①没有考虑空间电荷区的产生-复合；②没有考虑大注入效应；③没有考虑串联电阻。实际PN结的I-V偏离理想指数关系。</div>`},
{n:"PN结正向电流的物理图像",s:"★★★★★",exam:1,body:`<p><strong>正向注入</strong>：正偏降低势垒，多子从两侧注入空间电荷区，成为对侧的少子。</p>
<div class="formula-box">注入过程：<br>N区电子 → 空间电荷区 → P区（少子注入）<br>P区空穴 → 空间电荷区 → N区（少子注入）<br><br>边界值：<br>Δp(x_n) = p_n0·[exp(qV/kT)-1]<br>Δn(-x_p) = n_p0·[exp(qV/kT)-1]<br><br>注入少子在准中性区扩散并复合<br>扩散长度L决定电流大小</div>
<p><strong>正向电流的组成</strong>：</p>
<p>① <strong>扩散电流</strong>：注入少子的扩散（主要贡献）</p>
<p>② <strong>复合电流</strong>：空间电荷区中载流子的复合</p>
<p>③ 低注入时以复合电流为主（I ∝ exp(qV/2kT)），中等注入以扩散电流为主（I ∝ exp(qV/kT)）</p>
<div class="info">Si PN结在低电流下通常表现为I ∝ exp(qV/nkT)，n称为理想因子，低电流时n≈2（复合电流），大电流时n→1（扩散电流）。</div>`},
{n:"PN结反向电流",s:"★★★★★",exam:1,body:`<p><strong>反向抽取</strong>：反偏增大势垒，空间电荷区中的电场将少子抽取（sweep out），使边界处少子浓度趋近于0。</p>
<div class="formula-box">边界条件（反偏V<0，|V|>>kT/q）：<br>p_n(x_n) ≈ 0（边界处少子浓度为零）<br>n_p(-x_p) ≈ 0<br><br>少子从体内扩散到边界→被电场扫过耗尽层<br>反向电流 = 少子扩散电流 = I_s<br><br>I_s = qAni²[D_p/(L_p·N_D) + D_n/(L_n·N_A)]</div>
<p><strong>I_s的物理意义</strong>：反向电流由少数载流子的热产生决定。在空间电荷区边缘，少子浓度因反偏被压低到近零，体内少子必须不断扩散到边界来补充。</p>
<p><strong>I_s的温度依赖性</strong>：</p>
<div class="formula-box">I_s ∝ ni² ∝ T³·exp(-E_g/kT)<br><br>温度升高→ni²指数增长→I_s急剧增大<br><br>经验规则：温度每升高10°C，I_s约增大一倍</div>
<div class="warn"><strong>考试重点</strong>：I_s ∝ ni² → 随温度急剧变化。Ge器件的I_s远大于Si（ni²更大），这限制了Ge器件的工作温度。</div>`},
{n:"空间电荷区的产生与复合电流",s:"★★★★☆",exam:1,body:`<p><strong>产生电流</strong>（反偏时）：反偏使空间电荷区内ni<<ni²，产生率大于复合率。</p>
<div class="formula-box">产生电流：<br>I_gen = q·A·W·G<br>= q·A·W·ni/(2τ)<br><br>I_gen ∝ W ∝ (V_D+|V|)^(1/2)<br>I_gen ∝ ni（不是ni²！）<br><br>总反向电流：<br>I_R = I_s + I_gen<br>对于Si器件，I_gen >> I_s（室温）</div>
<p><strong>复合电流</strong>（正偏时）：正偏使空间电荷区内np > ni²，复合率大于产生率。</p>
<div class="formula-box">复合电流：<br>I_rec = q·A·W·R<br>≈ q·A·(W/2)·ni·[exp(qV/2kT)-1]/τ<br><br>I_rec ∝ exp(qV/2kT)<br>I_diff ∝ exp(qV/kT)<br><br>低正偏：I_rec主导（n=2）<br>较高正偏：I_diff主导（n=1）</div>
<div class="tip"><strong>考研常考</strong>：为什么实际Si PN结的I-V在低电流区偏离理想的exp(qV/kT)？答：空间电荷区复合电流的贡献，导致I ∝ exp(qV/2kT)。</div>`},
{n:"PN结击穿机制",s:"★★★★★",exam:1,body:`<p><strong>反向击穿</strong>：反偏电压超过某临界值（V_BR）后，反向电流急剧增大。</p>
<p><strong>① 雪崩击穿</strong>：</p>
<div class="formula-box">条件：E_max > E_crit（临界电场）<br>Si的E_crit ≈ 3×10⁵ V/cm<br><br>碰撞电离系数 α ∝ exp(-b/E)<br>雪崩倍增因子：<br>M = 1/[1-(V/V_BR)^n]（n≈3-6）<br><br>V_BR ∝ N_B^(-3/2)（突变结）<br>V_BR ∝ N_B^(-3/4)（线性缓变结）<br>N_B = 轻掺杂侧浓度</div>
<p><strong>② 齐纳击穿</strong>：</p>
<div class="formula-box">条件：N_B > 10¹⁸ cm⁻³<br>势垒极窄（<10nm）<br>价带电子直接隧穿到导带<br>V_BR < 4V（通常）<br>温度系数 < 0（温度升高V_BR减小）</p>
<p><strong>③ 热击穿</strong>：</p>
<div class="formula-box">反向功耗 P = V_R·I_R > 散热能力<br>→ 温度升高 → I_R增大 → P更大 → 热失控</div>
<table class="cmp"><tr><th>特征</th><th>雪崩击穿</th><th>齐纳击穿</th></tr><tr><td>掺杂</td><td>轻掺杂</td><td>重掺杂</td></tr><tr><td>V_BR</td><td>高(>6V)</td><td>低(<4V)</td></tr><tr><td>温度系数</td><td>正</td><td>负</td></tr><tr><td>机制</td><td>碰撞电离</td><td>带间隧穿</td></tr></table>
<div class="tip"><strong>考研必考</strong>：三种击穿机制的对比。重点掌握雪崩击穿的条件（碰撞电离率积分=1）和齐纳击穿的条件（高掺杂+窄势垒）。</div>`},
{n:"PN结电容（势垒电容与扩散电容）",s:"★★★★★",exam:1,body:`<p><strong>势垒电容</strong>（耗尽层电容）：</p>
<div class="formula-box">C_T = ε_s/W = A·ε_s/W<br><br>突变结：C_T = A·ε_s/√[2ε_s(V_D-V)/(q·N_B)]<br>C_T ∝ (V_D-V)^(-1/2)<br><br>线性缓变结：C_T ∝ (V_D-V)^(-1/3)<br><br>1/C² = 2(V_D-V)/(qε_sN_B)（突变结）<br>作1/C²-V图→直线→斜率求N_B，截距求V_D</div>
<p><strong>扩散电容</strong>（正偏时）：</p>
<div class="formula-box">C_D = dQ/dV<br>Q = 少子存储电荷<br><br>C_D = (q²/kT)·(L_p·p_n0/L_p + L_n·n_p0/L_n)·exp(qV/kT)<br>简化：C_D = (τ/2)·I/(kT/q)<br>C_D ∝ I ∝ exp(qV/kT)</div>
<p><strong>两者对比</strong>：</p>
<table class="cmp"><tr><th>特征</th><th>势垒电容C_T</th><th>扩散电容C_D</th></tr><tr><td>主要出现</td><td>反偏</td><td>正偏</td></tr><tr><td>物理本质</td><td>耗尽层电荷变化</td><td>少子存储变化</td></tr><tr><td>偏压依赖</td><td>C_T ∝ V^(-n)</td><td>C_D ∝ exp(qV/kT)</td></tr></table>
<div class="info">C-V法是测量PN结掺杂分布和内建电势的重要实验手段。1/C²-V图的线性度可以判断突变结近似是否成立。</div>`},
{n:"大注入效应",s:"★★★★☆",exam:1,body:`<p><strong>大注入</strong>：注入少子浓度与多子浓度相当（Δn ≈ Δp ≈ n₀），破坏了耗尽层近似。</p>
<div class="formula-box">大注入条件：Δp ≈ n₀（N型一侧）<br><br>大注入时的I-V关系：<br>I ∝ exp(qV/2kT)（不再是exp(qV/kT)）<br><br>原因：注入少子改变多子分布<br>→ 产生"感应电场"<br>→ 加速少子扩散，但也产生漂移分量<br>→ 有效扩散系数增大</div>
<p><strong>大注入的物理图像</strong>：</p>
<p>① 注入的少子（如N区的空穴）在边界附近堆积</p>
<p>② 为保持电中性，多子（电子）也跟着堆积</p>
<p>③ 多子浓度梯度产生"感应电场"</p>
<p>④ 此电场加速少子运动，有效传输机制变为漂移+扩散</p>
<p><strong>电流-电压特性的变化</strong>：</p>
<p>小注入：I ∝ exp(qV/kT)（扩散电流）</p>
<p>大注入：I ∝ exp(qV/2kT)（类似复合电流）</p>
<div class="warn"><strong>易错</strong>：大注入时I ∝ exp(qV/2kT)不是因为复合电流，而是因为感应电场改变了载流子传输方式。</div>`},
{n:"电荷控制模型",s:"★★★☆☆",body:`<p><strong>电荷控制模型</strong>：用存储电荷Q来描述PN结特性，比分布参数模型更简洁。</p>
<div class="formula-box">存储少子电荷：<br>Q = q·A·∫₀^∞ Δp(x)dx = q·A·L_p·Δp(0)<br><br>扩散电流：<br>I = Q/τ（稳态）<br><br>瞬态：<br>dQ/dt = I_inject - Q/τ<br><br>开关时间：<br>t_s = τ·ln[(I_F-I_R)/(I_R)]<br>（存储延迟时间，I_F→I_R反向恢复）</div>
<p><strong>电荷控制方程的应用</strong>：</p>
<p>① <strong>稳态特性</strong>：I = Q/τ → I = I_s·exp(qV/kT)</p>
<p>② <strong>开关特性</strong>：PN结从正偏切换到反偏时，存储电荷需要时间消除，这个时间决定开关速度</p>
<p>③ <strong>二极管反向恢复</strong>：正向导通时存储大量少子，突然加反偏需要先抽出这些少子（存储期），然后耗尽层才开始展宽（过渡期）</p>
<div class="info">快速开关二极管通过引入复合中心（如掺Au）来缩短少子寿命，提高开关速度。但I_s也会增大。</div>`},
{n:"隧道结（Esaki二极管）",s:"★★★☆☆",body:`<p><strong>隧道结</strong>：两边都是重掺杂（N_D, N_A > 10¹⁹ cm⁻³）的PN结，费米能级进入能带内部（简并半导体）。</p>
<div class="formula-box">特征：<br>① 势垒极窄（~10nm），允许带间隧穿<br>② I-V特性出现负微分电阻区<br><br>隧穿电流：<br>I_T ∝ D(E)·T(E)·[f(E)-f(E+qV)]<br>D(E)：态密度<br>T(E)：隧穿概率 ∝ exp(-常数·W·√m*·E_g^(3/2))</div>
<p><strong>I-V特性</strong>：</p>
<p>① <strong>V=0</strong>：费米能级对齐，隧穿电流为零</p>
<p>② <strong>V小正偏</strong>：N区导带电子隧穿到P区价带空态→电流增大</p>
<p>③ <strong>V = V_p（峰值电压）</strong>：隧穿概率最大→峰值电流I_p</p>
<p>④ <strong>V增大超过V_p</strong>：可隧穿的态减少→电流下降→<strong>负微分电阻</strong></p>
<p>⑤ <strong>V继续增大</strong>：热电流主导→电流重新增大</p>
<div class="info">隧道结的负微分电阻用于高频振荡器和高速开关。也是隧穿晶体管（TFET）的基础。</div>`},
{n:"PN结的温度特性",s:"★★★★☆",exam:1,body:`<p><strong>正向电压的温度系数</strong>：</p>
<div class="formula-box">V = (E_g/q) - (kT/q)·ln(I/A·q·常数)<br><br>dV/dT ≈ -2 mV/°C（Si）<br>dV/dT ≈ -2.1 mV/°C（Ge）<br><br>物理原因：T升高→ni增大→I_s增大→同样的I需要更小的V</div>
<p><strong>反向电流的温度特性</strong>：</p>
<div class="formula-box">I_s ∝ ni² ∝ T³·exp(-E_g/kT)<br><br>温度每升高10°C，I_s约增大一倍<br><br>室温附近（Si）：<br>I_s(25°C) ≈ 几nA<br>I_s(125°C) ≈ 几μA</div>
<p><strong>击穿电压的温度特性</strong>：</p>
<p>① 雪崩击穿：V_BR随温度升高而增大（正温度系数）</p>
<p>原因：T升高→声子散射增强→平均自由程减小→需要更强的电场才能触发电离</p>
<p>② 齐纳击穿：V_BR随温度升高而减小（负温度系数）</p>
<p>原因：T升高→禁带宽度减小→隧穿概率增大</p>
<div class="warn"><strong>考试常考</strong>：正向电压的负温度系数（-2mV/°C）是温度传感器（如带隙基准电压源）的基础。</div>`},
{n:"PN结的瞬态特性",s:"★★★☆☆",body:`<p><strong>正向→反向的开关过程</strong>：</p>
<div class="formula-box">阶段1：存储延迟期（0 < t < t_s）<br>正向存储电荷被反向电流抽取<br>I_R 恒定，V仍为正向（约+0.7V）<br>t_s = τ·ln[(I_F+I_R)/I_R]<br><br>阶段2：过渡期（t_s < t < t_f）<br>存储电荷清除完毕，耗尽层开始展宽<br>V从+0.7V下降到-V_R<br>t_f ≈ τ·ln(2ΔV/0.1)（ΔV为电压变化）<br><br>总反向恢复时间：t_rr = t_s + t_f</div>
<p><strong>反向恢复电荷</strong>：</p>
<div class="formula-box">Q_rr = ∫₀^t_rr I_R dt<br>≈ I_R·t_s + 额外电荷<br><br>Q_rr越小，开关速度越快</div>
<p><strong>减少反向恢复时间的方法</strong>：</p>
<p>① 引入复合中心（掺Au）→ 减小τ → 减小t_s</p>
<p>② 肖特基二极管（无少子存储）→ 无反向恢复问题</p>
<p>③ 少子寿命控制（电子辐照、质子辐照）</p>
<div class="info">SiC肖特基二极管因其超快开关特性（几乎无反向恢复）在功率电子中广泛应用。</div>`},
{n:"PN结电荷控制与开关模型",s:"★★★☆☆",body:`<p><strong>开关模型总结</strong>：</p>
<div class="formula-box">正向导通：<br>存储电荷 Q_F = I_F·τ<br>结电压 V_j ≈ 0.7V（Si）<br><br>突然反向：<br>I = -I_R（恒流抽取）<br>V_j ≈ +0.7V（存储延迟期）<br><br>Q归零后：<br>V_j 急剧下降到 -V_R<br>耗尽层展宽<br><br>等效电路模型：<br>C = C_T + C_D（总结电容）<br>R_s = 串联电阻<br>r_d = kT/(qI)（小信号电阻）</div>
<p><strong>小信号等效电路</strong>：在工作点附近的线性化模型</p>
<div class="formula-box">小信号电阻：r_d = dV/dI = kT/(qI) = V_T/I<br>结电阻随偏置电流变化：r_d ∝ 1/I<br>扩散电阻：r_s（串联的体电阻）<br><br>截止频率：<br>f_c = 1/(2π·r_d·C_D) = 1/(2πτ)</div>
<div class="tip"><strong>应用</strong>：PN结的小信号模型是分析晶体管放大器的基础。r_d和C_D决定了频率响应的上限。</div>`},
{n:"PN结的击穿电压计算",s:"★★★★★",exam:1,body:`<p><strong>突变结击穿电压</strong>：</p>
<div class="formula-box">雪崩击穿电压（突变结）：<br>V_BR = ε_s·E_c²/(2q)·(1/N_B)<br>E_c ≈ 10⁶ V/cm（Si）<br><br>近似公式（Si，N_B单位cm⁻³）：<br>V_BR ≈ 60·(E_g/1.12)^(3/2)·(N_B/10¹⁶)^(-3/4) [V]<br><br>例：N_B=10¹⁶ → V_BR ≈ 60V<br>N_B=10¹⁵ → V_BR ≈ 200V<br>N_B=10¹⁸ → V_BR ≈ 1-2V</div>
<p><strong>关键关系</strong>：<br>• V_BR ∝ N_B^(-3/4)（掺杂越高→击穿电压越低）<br>• V_BR ∝ E_g^(3/2)（宽禁带→高击穿电压）<br>• 击穿时最大电场 E_max ≈ E_c（临界击穿场）</p>
<p><strong>击穿时的耗尽层宽度</strong>：</p>
<div class="formula-box">W_BR = 2ε_s·V_BR/(qN_B)<br>= 2ε_s·E_c/(qN_B)（用E_c表示）</div>
<div class="warn"><strong>易错</strong>：齐纳击穿（V_BR < 5V）机制是量子隧穿，与雪崩击穿机制不同。齐纳击穿的温度系数为负（V_BR随T升高而降低），雪崩击穿为正。</div>`},
{n:"PN结的反向恢复过程",s:"★★★★☆",exam:1,body:`<p><strong>反向恢复</strong>：PN结从正向偏置突然切换到反向偏置时，反向电流不会立即消失，而是先有很大的反向尖峰电流，然后逐渐衰减。</p>
<div class="formula-box">反向恢复时间：t_rr = t_a + t_b<br>t_a = 存储电荷被抽取的时间<br>t_b = 耗尽层建立时间<br><br>反向恢复电荷：Q_rr = ∫i_r·dt<br>t_rr ≈ τ·ln(1 + I_F/I_R)（近似）</div>
<p><strong>物理过程</strong>：<br>1. 正偏时：扩散区存储了大量少子（存储电荷Q_s）<br>2. 突然反偏：外电路抽取存储电荷→大的反向电流<br>3. 存储电荷被耗尽→反向电流衰减<br>4. 耗尽层建立→达到稳态反向电流</p>
<p><strong>正向恢复</strong>：反偏→正偏时，由于空间电荷区需要时间建立注入，正向电流有一个小的过冲。</p>
<div class="formula-box">反向恢复的应用：<br>• 快恢复二极管：τ小→t_rr短→适合高频<br>• 肖特基二极管：无少子存储→t_rr≈0→超高频<br>• 开关损耗 ∝ Q_rr × V_R × f_sw</div>
<div class="tip"><strong>记忆</strong>：正偏→存储电荷→反偏→抽取存储电荷→大反向电流尖峰。存储电荷越多/少子寿命越长→反向恢复时间越长。</div>`},
{n:"PN结的温度特性详解",s:"★★★★★",exam:1,body:`<p><strong>温度对PN结I-V特性的影响</strong>：</p>
<div class="formula-box">正向I-V（考虑温度）：<br>I = I_s(T)·[exp(qV/nkT) - 1]<br><br>I_s(T) = A·q·n_i²(T)·[D_n/(L_n·N_A) + D_p/(L_p·N_D)]<br>n_i²(T) ∝ T³·exp(-E_g/kT)<br><br>恒流正向电压温度系数：<br>dV_F/dT ≈ (V_F - E_g/q)/T - 3k/q<br>≈ -1 ~ -2 mV/°C（Si）</div>
<p><strong>反向饱和电流</strong>：</p>
<div class="formula-box">I_s ∝ n_i² ∝ T³·exp(-E_g/kT)<br><br>温度每升高10°C，I_s增大约2倍<br>（经验法则：I_s(T+10) ≈ 2·I_s(T)）</div>
<p><strong>击穿电压的温度依赖性</strong>：</p>
<div class="formula-box">雪崩击穿（V_BR > 5V）：<br>dV_BR/dT > 0（正温度系数）<br>T↑→声子增多→散射增强→需更高电压达到雪崩<br><br>齐纳击穿（V_BR < 5V）：<br>dV_BR/dT < 0（负温度系数）<br>T↑→E_g↓→隧穿更容易→击穿电压降低</div>
<div class="warn"><strong>考研必考</strong>：正向电压随温度升高而降低（约-2mV/°C），可用于温度传感器和温度补偿电路。</div>`},
{n:"PN结的功率损耗与散热",s:"★★★☆☆",body:`<p><strong>PN结功率损耗</strong>：</p>
<div class="formula-box">直流功率损耗：<br>P = V_F × I_F（正偏）<br>P = V_R × I_R ≈ V_R × I_s（反偏，很小）<br><br>开关功率损耗（高频时重要）：<br>P_sw = ½ × V_R × I_F × (t_r + t_f) × f_sw<br>f_sw = 开关频率</div>
<p><strong>散热设计</strong>：</p>
<div class="formula-box">热阻：R_th = ΔT/P [°C/W]<br>结温：T_j = T_amb + P × R_th<br><br>最大功耗限制：<br>P_max = (T_j,max - T_amb)/R_th<br>Si: T_j,max ≈ 150-175°C<br>GaAs: T_j,max ≈ 200°C</div>
<p><strong>热失控</strong>：当温度升高→I_s增大→I增大→温度进一步升高→正反馈→器件烧毁。</p>
<div class="formula-box">热失控条件：<br>dP/dT > 1/R_th（负微分热阻）<br>即：温度升高的速率超过散热速率</div>
<div class="tip"><strong>设计原则</strong>：功率器件必须确保散热路径的热阻足够小（大面积金属接触、散热片、良好热接触）。</div>`},
{n:"PN结的雪崩倍增与碰撞电离",s:"★★★★☆",body:`<p><strong>雪崩倍增</strong>：反偏强电场中，载流子获得足够能量→碰撞电离产生新的电子-空穴对→级联倍增。</p>
<div class="formula-box">碰撞电离率：<br>α_n(E), α_p(E)：电子/空穴的碰撞电离率<br>α ∝ exp(-E_i/E)（简化模型）<br>E_i ~ 几MV/cm<br><br>雪崩倍增因子：<br>M = 1/[1 - (V/V_BR)^n]<br>n ≈ 3-6（取决于材料和掺杂）</div>
<p><strong>雪崩倍增的临界条件</strong>（Miller条件）：</p>
<div class="formula-box">积分条件：<br>∫₀^W α(E)·dx = 1<br>即：一次穿越耗尽层平均产生一次碰撞电离</div>
<p><strong>雪崩击穿的特点</strong>：<br>• 软击穿：电流缓慢增长→逐渐增大<br>• 有噪声：雪崩过程的随机性→散粒噪声<br>• 可用于APD（雪崩光电二极管）的内部增益<br>• 击穿后如不加限流→热击穿→永久损坏</p>
<div class="tip"><strong>对比雪崩vs齐纳</strong>：雪崩=碰撞电离（V_BR>5V,正温度系数,有噪声）；齐纳=量子隧穿（V_BR<5V,负温度系数,无噪声）。5V附近两种机制共存，温度系数≈0。</div>`},
{n:"异质结双极型晶体管(HBT)基础",s:"★★★☆☆",body:`<p><strong>HBT</strong>：利用异质结的能带偏移来提高注入效率的双极型晶体管。</p>
<div class="formula-box">传统BJT的注入效率：<br>γ = 1/[1 + (N_E·D_B·L_E)/(N_B·D_E·L_B)]<br><br>HBT的优势：<br>异质结能带偏移ΔE_v增大了发射结的注入势垒<br>γ_HBT ≈ 1 - (N_B·D_E)/(N_E·D_B)·exp(-ΔE_v/kT)<br>ΔE_v >> kT → γ_HBT → 1</div>
<p><strong>材料体系</strong>：</p>
<div class="formula-box">AlGaAs/GaAs HBT：<br>ΔE_g ≈ 0.3eV（Al₀.₃Ga₀.₇As/GaAs）<br>β > 100（即使N_E < N_B）<br><br>InGaAs/InP HBT：<br>f_T > 500 GHz<br>用于太赫兹电子学</div>
<p><strong>HBT vs BJT</strong>：<br>• HBT可以N_E < N_B（基区高掺杂→低基区电阻→高频）<br>• BJT要求N_E >> N_B（牺牲高频性能）<br>• HBT的β几乎不受温度影响（ΔE_v稳定）</p>
<div class="tip"><strong>核心优势</strong>：异质结能带偏移→打破传统BJT中"发射区掺杂必须远高于基区"的限制→可同时实现高β和高频。</div>`}
],

// ============ Chapter 7: 金属和半导体的接触 ============
{title:"第7章 金属和半导体的接触",sub:"肖特基势垒与欧姆接触",tag:"器件基础",kps:[
{n:"功函数与亲和能",s:"★★★★★",exam:1,body:`<p><strong>功函数</strong>：将电子从费米能级移到真空能级所需的最小能量。</p>
<div class="formula-box">功函数 W = E₀ - E_F<br>E₀：真空能级<br>E_F：费米能级<br><br>电子亲和能 χ（半导体）：<br>χ = E₀ - E_c<br>（从导带底到真空能级）<br><br>Si: χ ≈ 4.05 eV, W_Si ≈ 4.6 eV<br>GaAs: χ ≈ 4.07 eV, W_GaAs ≈ 4.7 eV<br><br>金属功函数（典型值）：<br>Al: 4.28 eV, Au: 5.1 eV, Pt: 5.65 eV<br>Mo: 4.6 eV, Ti: 4.33 eV</div>
<p><strong>N型半导体</strong>：W_S = χ + (E_c - E_F) = χ + E_n</p>
<p><strong>P型半导体</strong>：W_S = χ + E_g - E_p，其中E_p = E_F - E_v</p>
<div class="warn"><strong>注意</strong>：功函数不是固定值！金属功函数受表面状态影响；半导体功函数随掺杂浓度变化（费米能级位置改变）。</div>`},
{n:"肖特基势垒（金属-N型半导体）",s:"★★★★★",exam:1,body:`<p><strong>肖特基势垒</strong>：金属与N型半导体接触时，在半导体表面形成的势垒。</p>
<div class="formula-box">情况1：W_m > W_s（如Au-Si）<br>电子从半导体流向金属→半导体表面带正电<br>→ 能带向上弯曲 → 形成势垒<br><br>势垒高度：<br>Φ_Bn = W_m - χ（理想情况）<br>Φ_Bn = W_m - W_s + E_n（实际）<br><br>情况2：W_m < W_s（如Al-Si）<br>电子从金属流向半导体→能带向下弯曲<br>→ 形成反阻挡层（积累型）</div>
<p><strong>能带图分析</strong>：</p>
<div class="formula-box">接触前：W_m > W_s<br>对齐费米能级：电子从半导体流向金属<br><br>接触后：<br>金属侧：E_c升高Φ_Bn（势垒阻止电子从金属到半导体）<br>半导体侧：E_c降低（有利于电子发射）<br><br>金属→半导体势垒 = Φ_Bn<br>半导体→金属势垒 = Φ_Bn（相同！）<br><br>耗尽层宽度：<br>W = √[2ε_s(V_bi - V)/(qN_D)]<br>V_bi = Φ_Bn - (E_c-E_F) = Φ_Bn - E_n</div>
<div class="tip"><strong>核心区别</strong>：肖特基势垒的正向电流由多子（电子）的热发射决定，不涉及少子注入。这与PN结完全不同！</div>`},
{n:"肖特基二极管的I-V特性",s:"★★★★★",exam:1,body:`<p><strong>热电子发射理论</strong>：金属-半导体接触的电流由载流子越过势垒的热发射决定。</p>
<div class="formula-box">Richardson-Dushman方程：<br>J = A*T²·exp(-Φ_Bn/kT)·[exp(qV/kT)-1]<br><br>理查逊常数：<br>A* = 4πqmk²/h³ ≈ 120 A/(cm²·K²)<br>（Si的有效理查逊常数 ≈ 252 A/(cm²·K²)）<br><br>理想因子：<br>I = I_s·[exp(qV/nkT)-1]<br>I_s = A*·T²·exp(-Φ_Bn/kT)<br>理想肖特基：n ≈ 1.0-1.1</div>
<p><strong>I-V特性的实际偏离</strong>：</p>
<p>① n > 1：界面态和镜像力降低效应导致n=1.02~1.10</p>
<p>② 串联电阻效应：大电流时I ∝ exp(qV/nkT)偏离指数关系</p>
<p>③ 反向泄漏：实际反向电流大于理论值（隧穿、边缘效应）</p>
<div class="info">肖特基二极管的势垒高度约为0.5-0.8eV（Si），正向导通电压约0.3-0.5V，低于PN结。</div>`},
{n:"镜像力降低效应",s:"★★★★☆",exam:1,body:`<p><strong>镜像力</strong>：金属-半导体界面处，电子在金属中感应出的镜像电荷对电子产生吸引力，降低了势垒高度。</p>
<div class="formula-box">镜像势能：<br>V_image(x) = -q²/(16πε_s·x)<br><br>势垒降低量：<br>ΔΦ = √[qE_max/(4πε_s)]<br>E_max = √[2qN_D(V_bi-V)/ε_s]<br><br>典型值：<br>ΔΦ ≈ 0.05-0.1 V<br><br>有效势垒高度：<br>Φ_Beff = Φ_Bn - ΔΦ<br>反向偏压增大→E_max增大→ΔΦ增大→Φ_Beff减小<br>→ 反向电流增大</div>
<p><strong>物理意义</strong>：镜像力使最高势垒位置向金属-半导体界面移动。在强电场下，势垒的最高点不是在界面，而是在半导体内部约几nm处。</p>
<div class="warn"><strong>影响</strong>：镜像力降低效应是实际肖特基二极管反向泄漏电流较大的主要原因之一。</div>`},
{n:"界面态的影响",s:"★★★★☆",exam:1,body:`<p><strong>界面态</strong>：金属-半导体界面处存在的局域电子态，来源于悬挂键、缺陷、杂质等。</p>
<div class="formula-box">界面态密度：D_it（cm⁻²·eV⁻¹）<br><br>费米能级钉扎效应：<br>当D_it很大时，势垒高度与金属功函数无关：<br>Φ_Bn ≈ 常数 ≈ 2/3·E_g（Si）<br><br>Bardeen极限（高界面态密度）：<br>Φ_Bn = E_g/χ_p - δ（与W_m无关）<br><br>实验观察：<br>Si: Φ_Bn ≈ 0.5-0.8 eV（几乎与W_m无关）<br>GaAs: Φ_Bn ≈ 0.8 eV（强钉扎）</div>
<p><strong>费米能级钉扎</strong>：当界面态密度很高（D_it > 10¹³ cm⁻²·eV⁻¹）时，费米能级被界面态"钉住"在某个位置，改变金属功函数对势垒高度几乎没有影响。</p>
<p><strong>解释</strong>：界面态作为电荷库，吸收了由金属功函数差引起的多余电荷，维持费米能级位置不变。</p>
<div class="info">GaAs的表面态密度很高（~10¹³ cm⁻²·eV⁻¹），费米能级被钉扎在禁带中央附近，这使得制造好的肖特基接触和欧姆接触都很困难。</div>`},
{n:"肖特基二极管与PN结二极管对比",s:"★★★★★",exam:1,body:`<table class="cmp"><tr><th>特征</th><th>肖特基二极管</th><th>PN结二极管</th></tr><tr><td>载流子</td><td>多子热发射</td><td>少子扩散</td></tr><tr><td>少子存储</td><td>无</td><td>有</td></tr><tr><td>开关速度</td><td>极快（~ns）</td><td>慢（~μs）</td></tr><tr><td>正向压降</td><td>低（0.3-0.5V）</td><td>较高（0.6-0.7V）</td></tr><tr><td>反向恢复</td><td>无</td><td>有（存储延迟）</td></tr><tr><td>反向漏电</td><td>较大</td><td>较小</td></tr><tr><td>温度稳定性</td><td>较差</td><td>较好</td></tr></table>
<div class="tip"><strong>考研重点对比</strong>：肖特基二极管是多子器件，无少子存储→快速开关；PN结是少子器件→有扩散电容和反向恢复。</div>`},
{n:"欧姆接触",s:"★★★★★",exam:1,body:`<p><strong>欧姆接触</strong>：金属与半导体接触形成的非整流接触，接触电阻极小，电流可双向通过。</p>
<div class="formula-box">实现条件：<br>① N型：W_m < W_s（形成积累层）<br>② P型：W_m > W_s（形成积累层）<br><br>实际制备方法：<br>① 高掺杂隧道接触（最常用）<br>N_D > 10¹⁹ cm⁻³ → 势垒极窄 → 隧穿<br><br>② 选择合适金属<br>N型GaAs：AuGeNi合金<br>P型Si：Al<br>N型Si：TiSi₂, NiSi</div>
<p><strong>接触电阻</strong>：</p>
<div class="formula-box">比接触电阻 ρ_c（Ω·cm²）：<br><br>热发射：ρ_c ∝ exp(Φ_B/kT)<br><br>隧穿（高掺杂）：<br>ρ_c ∝ exp(Φ_B/(E₀))<br>E₀ = (ℏ/2)·√(qN_D/(m*ε_s))<br><br>ρ_c 随 N_D 增大指数下降</div>
<div class="info">现代CMOS工艺中，硅化物（TiSi₂、CoSi₂、NiSi）与重掺杂Si形成良好的欧姆接触，ρ_c < 10⁻⁷ Ω·cm²。</div>`},
{n:"肖特基势垒的电流输运机制",s:"★★★☆☆",body:`<p><strong>四种电流输运机制</strong>：</p>
<p>① <strong>热电子发射（TE）</strong>：载流子越过势垒顶部。适用于势垒区宽度 >> 平均自由程的情况。</p>
<div class="formula-box">J_TE = A*T²·exp(-Φ_B/kT)·[exp(qV/kT)-1]</div>
<p>② <strong>热场发射（TFE）</strong>：在势垒顶部附近通过量子隧穿。适用于中等掺杂。</p>
<p>③ <strong>场发射（FE）</strong>：载流子在费米能级附近直接隧穿势垒。适用于重掺杂。</p>
<div class="formula-box">场发射重要条件：<br>E₀ >> kT（量子隧穿能量宽度 >> 热能）<br>N_D > 10¹⁷ cm⁻³（势垒足够薄）</div>
<p>④ <strong>扩散-热发射</strong>：热发射进入势垒区，然后扩散到金属。适用于长势垒区。</p>
<div class="info">Si中，N_D < 10¹⁷ 以TE为主；10¹⁷~10¹⁸ 以TFE为主；> 10¹⁸ 以FE为主。高掺杂FE机制导致接触电阻降低，是欧姆接触的物理基础。</div>`},
{n:"肖特基势垒的温度依赖性",s:"★★★★☆",body:`<p><strong>温度对肖特基二极管的影响</strong>：</p>
<div class="formula-box">反向饱和电流：<br>I_s = A*·T²·exp(-Φ_Bn/kT)<br><br>ln(I_s/T²) = ln(A*) - Φ_Bn/kT<br><br>Richardson图：ln(I_s/T²) vs 1/T<br>斜率 = -Φ_Bn/k → 求势垒高度<br>截距 = ln(A*) → 求理查逊常数<br><br>实际：<br>Φ_Bn也有温度依赖性：<br>dΦ_Bn/dT ≈ -0.5 ~ -1.0 meV/K<br>（因E_F和E_c的温度漂移不同）</div>
<p><strong>正向I-V的温度依赖性</strong>：</p>
<div class="formula-box">V_F = (Φ_Bn/kT)·ln(I_F/(A*T²))（近似）<br><br>dV_F/dT ≈ -2 mV/K（与PN结类似）<br><br>实际比PN结更敏感：<br>因Φ_Bn本身也随温度变化</div>
<p><strong>温度对肖特基接触性能的影响</strong>：</p>
<p>① 高温→I_s增大→反向泄漏增加→整流特性变差</p>
<p>② 高温→镜像力效应增强→有效势垒降低→I_s进一步增大</p>
<p>③ 肖特基二极管的高温工作能力不如PN结</p>
<div class="info">实验中通过变温I-V测量（Richardson图）可以精确提取势垒高度Φ_Bn和理查逊常数A*，是表征肖特基接触的标准方法。</div>`},
{n:"势垒高度的调控方法",s:"★★★☆☆",body:`<p><strong>调控肖特基势垒高度的途径</strong>：</p>
<p>① <strong>选择金属</strong>（基本方法，但受费米能级钉扎限制）：</p>
<div class="formula-box">理想：Φ_Bn = W_m - χ<br>Si中：W_m增大1eV，Φ_Bn仅增大~0.1-0.3eV<br>→ 钉扎效应使调控范围有限</div>
<p>② <strong>界面插入层</strong>：</p>
<div class="formula-box">a) 薄氧化层插入（MIS结构）：<br>金属/SiO₂/Si → 等效降低势垒<br><br>b) 界面金属化合物层：<br>Ti/Si → TiSi₂ → 可调节势垒<br><br>c) 本征极性层：<br>金属/绝缘层/半导体 → 偶极调控</div>
<p>③ <strong>表面处理</strong>：</p>
<div class="formula-box">硫钝化（S处理）：消除GaAs表面钉扎<br>→ Φ_Bn可从0.7eV调控到1.0eV<br><br>氢钝化：减少Si表面悬挂键<br>→ 改善接触均匀性</div>
<p>④ <strong>合金化退火</strong>：界面反应改变金属成分→改变有效功函数</p>
<div class="info">在GaAs器件中，常使用AuGeNi合金化形成欧姆接触（N型），AuZn合金化形成欧姆接触（P型）。这些工艺通过界面反应来优化接触性能。</div>`},
{n:"肖特基势垒二极管的频率响应",s:"★★★☆☆",body:`<p><strong>高频特性</strong>：肖特基二极管因无少子存储，频率特性远优于PN结。</p>
<div class="formula-box">截止频率：<br>f_c = 1/(2π·R_s·C_j)<br><br>R_s = 串联电阻（体电阻+接触电阻）<br>C_j = 结电容 = ε_s·A/W<br><br>典型值：<br>Si SBD: f_c ~ 40-100 GHz<br>GaAs SBD: f_c ~ 200-500 GHz<br>零偏压SBD: f_c ~ 1000 GHz（太赫兹）</div>
<p><strong>零偏压检波器</strong>：</p>
<div class="formula-box">零偏压（V=0）时，势垒的存在使I-V曲线非线性：<br>I(V) ≈ I_s·(qV/kT)（小信号近似）<br><br>检波灵敏度：<br>γ = (1/4)·(q/kT) ≈ 10 V⁻¹（室温）<br><br>噪声等效功率（NEP）：<br>NEP ∝ 1/(γ·√(4kTR_s))</div>
<p><strong>应用</strong>：毫米波/太赫兹混频器、检波器、采样保持电路。GaAs和Schottky SBD是太赫兹技术的关键器件。</p>
<div class="info">点接触二极管（如猫须二极管）是最早的肖特基结构，至今仍在太赫兹检测中有应用。</div>`},
{n:"欧姆接触的制备工艺",s:"★★★★☆",exam:1,body:`<p><strong>Si的欧姆接触工艺</strong>：</p>
<div class="formula-box">① 金属硅化物（Silicide）工艺：<br>Ti + Si → TiSi₂（自对准硅化物，salicide）<br>Ni + Si → NiSi（先进节点）<br>Co + Si → CoSi₂<br><br>工艺流程：金属溅射→高温退火（400-800°C）→去除未反应金属<br><br>② 重掺杂+金属：<br>离子注入B或P→退火激活→沉积金属<br>→ 隧穿形成低接触电阻<br><br>ρ_c 可达 < 10⁻⁷ Ω·cm²</div>
<p><strong>III-V族的欧姆接触</strong>：</p>
<div class="formula-box">GaAs N型：AuGeNi合金<br>Ge在GaAs中是浅施主（高掺杂）<br>800°C合金化后形成低势垒接触<br><br>GaAs P型：AuZn或AuBe<br>Zn在GaAs中是浅受主<br><br>GaN N型：Ti/Al/Ni/Au<br>Ti与GaN反应形成TiN→低势垒<br><br>GaN P型：Ni/Au或NiO/Au<br>功函数匹配</div>
<div class="warn"><strong>工艺关键</strong>：欧姆接触的质量直接影响器件的串联电阻。在功率器件中，接触电阻过大→局部发热→烧毁。因此ρ_c < 10⁻⁶ Ω·cm²是基本要求。</div>`},
{n:"金属-半导体接触的电场分布",s:"★★★☆☆",body:`<p><strong>肖特基势垒区的电场</strong>：</p>
<div class="formula-box">耗尽层近似下的电场：<br>E(x) = qN_D(W-x)/ε_s<br><br>W = √[2ε_s(V_bi-V)/(qN_D)]<br><br>最大电场（x=0，界面处）：<br>E_max = √[2qN_D(V_bi-V)/ε_s]<br><br>势垒区中的电位分布：<br>V(x) = E_max·W·(1-x/W)²/2<br><br>耗尽层宽度随偏压变化：<br>正偏→W减小→势垒降低<br>反偏→W增大→势垒升高</div>
<p><strong>与PN结的对比</strong>：</p>
<table class="cmp"><tr><th>特征</th><th>肖特基势垒</th><th>PN结</th></tr><tr><td>电场分布</td><td>线性（单侧掺杂）</td><td>三角形/抛物线</td></tr><tr><td>势垒高度</td><td>Φ_Bn（与V无关）</td><td>V_D-V（随偏压变化）</td></tr><tr><td>电流机制</td><td>多子发射</td><td>少子注入</td></tr><tr><td>势垒调控</td><td>基本不可调</td><td>可调（外加偏压）</td></tr></table>
<div class="info">肖特基势垒高度Φ_Bn不随偏压改变（仅耗尽层宽度变化），这是它与PN结的本质区别之一。</div>`},
{n:"MIS肖特基二极管与热发射修正",s:"★★★☆☆",body:`<p><strong>MIS肖特基二极管</strong>：在金属和半导体之间插入一层薄氧化层（1-3nm），形成Metal-Insulator-Semiconductor结构。</p>
<div class="formula-box">特性变化：<br>① 电流需要隧穿氧化层→I_s减小<br>② 理想因子n增大：I ∝ exp(qV/nkT)，n>1<br>③ 氧化层起到"势垒工程"作用<br><br>等效势垒高度：<br>Φ_eff = Φ_Bn + Δφ_ox<br>Δφ_ox = 氧化层上的电压降</div>
<p><strong>热发射理论的修正</strong>：</p>
<div class="formula-box">实际I-V偏离理想热发射的原因：<br>① 镜像力降低效应（降低Φ_Bn）<br>② 隧穿电流（尤其高掺杂时）<br>③ 界面态辅助复合电流<br>④ 氧化层的不均匀性<br>⑤ 边缘电场集中<br><br>实际公式：<br>I = I_s·[exp(qV/nkT) - 1]<br>n = 1.02~1.10（Si）<br>在高正偏时n趋向1</div>
<div class="info">对于精确的器件建模（如SPICE模型），需要考虑温度依赖性、镜像力降低、串联电阻等因素。</div>`}
],

// ============ Chapter 8: 半导体表面与MIS结构 ============
{title:"第8章 半导体表面与MIS结构",sub:"MIS电容、MOSFET、表面态",tag:"考研重点章",kps:[
{n:"表面态的物理起源",s:"★★★★☆",exam:1,body:`<p><strong>表面态</strong>：半导体表面上因晶格周期性中断而产生的电子态。</p>
<div class="formula-box">表面态的来源：<br>① 悬挂键（dangling bonds）<br>表面原子的未饱和共价键<br>Si(111)面：~10¹⁵ cm⁻²·eV⁻¹<br><br>② 表面缺陷<br>空位、位错、吸附原子<br><br>③ 界面电荷<br>Si/SiO₂界面：N_it ~ 10¹⁰-10¹² cm⁻²·eV⁻¹<br><br>快态（fast states）：与半导体交换载流子快<br>慢态（slow states）：时间常数长，位于氧化层中</div>
<p><strong>表面态的分类</strong>：</p>
<p>① <strong>本征表面态</strong>：理想清洁表面的悬挂键态</p>
<p>② <strong>外征表面态</strong>：氧化物/界面缺陷引起的态</p>
<p><strong>费米能级钉扎</strong>：高密度表面态会将费米能级钉扎在禁带中央附近（类似界面态对肖特基势垒的影响）。对于Si/SiO₂系统，高质量热氧化可以将表面态密度降到10¹⁰ cm⁻²·eV⁻¹以下。</p>
<div class="info">半导体表面物理和MOS器件的发展关键在于降低表面态密度。热氧化SiO₂是最重要的突破。</div>`},
{n:"MIS结构的能带图",s:"★★★★★",exam:1,body:`<p><strong>MIS（Metal-Insulator-Semiconductor）结构</strong>：金属-绝缘层-半导体的三明治结构，是MOS器件的基础。</p>
<div class="formula-box">功函数差：<br>Φ_ms = Φ_m - Φ_s<br><br>Φ_m：金属功函数<br>Φ_s：半导体功函数（与掺杂有关）<br><br>平带条件：V_FB = Φ_ms（忽略界面电荷时）<br>实际：V_FB = Φ_ms - Q_ox/C_ox<br>Q_ox：氧化层固定电荷</div>
<p><strong>P型半导体MIS能带图</strong>（以Si为例）：</p>
<p><strong>V < 0（负偏压）</strong>→ 积累：</p>
<div class="formula-box">金属侧负电压吸引空穴到表面<br>表面能带向上弯曲<br>表面空穴浓度增大（积累）<br>E_F接近E_v</div>
<p><strong>V = V_FB（平带电压）</strong>→ 平带：</p>
<div class="formula-box">能带平直，无弯曲<br>表面载流子浓度等于体内</div>
<p><strong>V > 0（小正偏压）</strong>→ 耗尽：</p>
<div class="formula-box">正偏压排斥空穴，留下电离受主<br>表面形成耗尽层<br>能带向下弯曲</div>
<p><strong>V >> 0（大正偏压）</strong>→ 反型：</p>
<div class="formula-box">能带弯曲超过2φ_F<br>表面电子浓度 > 空穴浓度<br>形成n型反型层<br>（P型半导体表面变为n型）</div>
<div class="tip"><strong>考研必考</strong>：四种状态（积累、平带、耗尽、反型）的能带图是MIS分析的核心。</div>`},
{n:"强反型条件",s:"★★★★★",exam:1,body:`<p><strong>强反型</strong>：半导体表面的少子浓度等于多子浓度（体内），即表面导电类型反转。</p>
<div class="formula-box">表面势（能带弯曲量）：<br>φ_s = 2φ_F 时达到强反型<br><br>φ_F = (kT/q)·ln(N_A/ni)（P型）<br>φ_F = (kT/q)·ln(N_D/ni)（N型）<br><br>阈值电压（P型半导体）：<br>V_T = V_FB + 2φ_F + Q_dep/C_ox<br><br>V_FB = Φ_ms - Q_ox/C_ox<br>Q_dep = √[4qε_sN_Aφ_F]（耗尽层电荷）<br>C_ox = ε_ox/tox<br><br>V_T = Φ_ms - Q_ox/C_ox + 2φ_F + √[4qε_sN_Aφ_F]/C_ox</div>
<p><strong>各参数对V_T的影响</strong>：</p>
<p>① <strong>N_A增大</strong>→ φ_F增大，Q_dep增大 → V_T增大</p>
<p>② <strong>tox增大</strong>→ C_ox减小 → V_T增大</p>
<p>③ <strong>Q_ox增大</strong>（正电荷）→ V_T减小</p>
<p>④ <strong>Φ_ms</strong>取决于金属和衬底掺杂</p>
<div class="warn"><strong>考试重点</strong>：V_T公式的推导过程。关键步骤：①画能带图确定φ_s = 2φ_F ②计算耗尽层电荷Q_dep ③利用高斯定理列V_ox ④累加各项。</div>`},
{n:"积累层、耗尽层、反型层",s:"★★★★★",exam:1,body:`<p><strong>三种表面积累状态详解</strong>（以P型Si为例）：</p>
<p><strong>积累层</strong>（V < V_FB）：</p>
<div class="formula-box">表面多子（空穴）积累<br>表面电阻率低于体内<br>表面态密度高<br>半导体表面呈p⁺特征<br>耗尽层宽度 = 0</div>
<p><strong>耗尽层</strong>（V_FB < V < V_T）：</p>
<div class="formula-box">多子被排斥，留下固定电荷<br>耗尽层宽度：W = √[2ε_sφ_s/(qN_A)]<br>耗尽层电荷：Q_dep = qN_A·W<br>半导体表面电阻率高<br>耗尽层宽度受偏压调控</div>
<p><strong>反型层</strong>（V > V_T）：</p>
<div class="formula-box">少子（电子）在表面形成n型薄层<br>反型层厚度：~几nm~几十nm<br>反型层电荷：Q_inv = C_ox·(V_G - V_T)<br><br>弱反型：φ_F < φ_s < 2φ_F<br>强反型：φ_s = 2φ_F<br>深耗尽：φ_s >> 2φ_F（非平衡态）</div>
<div class="warn"><strong>易混淆</strong>：深耗尽和强反型的区别。强反型是平衡态（少子产生率=复合率），需要足够的少子积累时间。深耗尽是瞬态（少子来不及产生），耗尽层可以比平衡时更宽。</div>`},
{n:"MIS结构的C-V特性",s:"★★★★★",exam:1,body:`<p><strong>C-V特性</strong>：MIS结构的电容随偏压变化的曲线，是表征MOS器件最重要的实验方法。</p>
<div class="formula-box">总电容（串联模型）：<br>1/C = 1/C_ox + 1/C_s<br>C_ox = ε_ox/tox（氧化层电容）<br>C_s = 半导体表面空间电荷层电容<br><br>C/C_ox = 1/(1 + C_ox/C_s)</div>
<p><strong>低频C-V曲线</strong>：</p>
<p>① <strong>积累区</strong>（V << 0）：C_s → ∞，C ≈ C_ox</p>
<p>② <strong>耗尽区</strong>：C_s = ε_s/W，随V增大W增大，C下降</p>
<p>③ <strong>反型区</strong>（V >> V_T）：少子能跟上信号，C_s → ∞，C → C_ox</p>
<p><strong>高频C-V曲线</strong>：</p>
<p>① 积累区和耗尽区与低频相同</p>
<p>② 反型区：少子跟不上高频信号，C_s由最大耗尽层W_max决定</p>
<div class="formula-box">W_max = √[4ε_sφ_F/(qN_A)]<br>C_min = C_ox·C_s(min)/(C_ox+C_s(min))<br>C_s(min) = ε_s/W_max<br><br>C_min/C_ox = 1/(1 + ε_ox·W_max/(ε_s·tox))</div>
<div class="tip"><strong>考研必考</strong>：高频和低频C-V曲线在反型区的区别。高频下少子跟不上，C降低到C_min并保持不变。</div>`},
{n:"C-V曲线的详细分析",s:"★★★★☆",exam:1,body:`<p><strong>C-V曲线的偏移与畸变</strong>：</p>
<p><strong>① 固定氧化层电荷Q_f</strong>：</p>
<div class="formula-box">Q_f > 0（常见于Si/SiO₂）<br>→ C-V曲线向左偏移<br>偏移量 = Q_f/C_ox<br>→ P型Si的V_T减小</div>
<p><strong>② 界面态N_it</strong>：</p>
<div class="formula-box">界面态可以随偏压充放电<br>→ C-V曲线斜率改变（弥散）<br>→ 高频和低频曲线的间距反映N_it<br><br>N_it = (1/q)·∫(C_LF/C_ox - C_HF/C_ox)·C_ox·dφ_s<br><br>N_it的分布可以从高频C-V的微分得到</div>
<p><strong>③ 可动离子电荷Q_m</strong>（如Na⁺）：</p>
<div class="formula-box">温度偏压应力（BTS）实验：<br>加高温+偏压→可动离子迁移→C-V偏移<br>通过偏移量计算可动离子面密度</div>
<p><strong>④ 深耗尽C-V</strong>：</p>
<div class="formula-box">快速扫描→少子来不及产生<br>→ 耗尽层超过W_max<br>→ C继续降低到C_min以下<br>→ 停止后慢慢恢复到平衡C-V</div>
<div class="info">高频C-V法可测量：氧化层厚度tox、掺杂浓度N_A、平带电压V_FB、氧化层电荷密度Q_ox/ε_ox、界面态密度N_it。</div>`},
{n:"MOSFET基本结构与工作原理",s:"★★★★★",exam:1,body:`<p><strong>MOSFET（Metal-Oxide-Semiconductor FET）</strong>：利用MIS结构的反型层作为导电沟道的场效应晶体管。</p>
<div class="formula-box">N沟道MOSFET：<br>P型Si衬底 + N⁺源/漏极 + SiO₂ + 金属栅<br><br>工作原理：<br>V_GS > V_T → P型表面反型为n型<br>→ 形成n型导电沟道（连接源和漏）<br>V_DS > 0 → 电子从源到漏 → 漏极电流I_D<br><br>截止条件：V_GS < V_T → 无沟道 → I_D ≈ 0</div>
<p><strong>I-V特性</strong>（长沟道模型）：</p>
<div class="formula-box">线性区（V_DS < V_GS - V_T）：<br>I_D = (W/L)·μ_n·C_ox·[(V_GS-V_T)V_DS - V_DS²/2]<br><br>饱和区（V_DS > V_GS - V_T）：<br>I_D(sat) = (W/2L)·μ_n·C_ox·(V_GS-V_T)²<br><br>饱和条件：沟道在漏端夹断<br>有效沟道长度 L_eff = L - ΔL</div>
<div class="tip"><strong>考研必考</strong>：MOSFET的I-V公式推导。核心步骤：①反型层电荷密度 Q_inv(x) = C_ox(V_GS-V_T-V(x)) ②漂移电流 J = μ_n·Q_inv·dV/dx ③积分得到I_D。</div>`},
{n:"阈值电压的调控",s:"★★★★☆",exam:1,body:`<p><strong>阈值电压调控方法</strong>：</p>
<div class="formula-box">V_T = V_FB + 2φ_F + √[4qε_sN_Aφ_F]/C_ox<br><br>① 衬底掺杂浓度N_A：<br>增大N_A → φ_F增大 → V_T增大<br>P阱注入调控NMOS的V_T<br><br>② 栅氧化层厚度tox：<br>增大tox → C_ox减小 → V_T增大<br><br>③ 栅极材料（功函数Φ_m）：<br>多晶Si：n⁺ poly(Φ_m≈4.1eV), p⁺ poly(Φ_m≈5.2eV)<br>金属栅：TiN(4.6eV), TaN(4.4eV)<br><br>④ 离子注入调阈值（最常用）：<br>在沟道区注入少量P（NMOS）或B（PMOS）<br>→ 改变表面掺杂浓度 → 调控V_T</div>
<p><strong>增强型与耗尽型</strong>：</p>
<p>① <strong>增强型</strong>（normally-off）：V_T > 0（NMOS），V_GS = 0时无沟道</p>
<p>② <strong>耗尽型</strong>（normally-on）：V_T < 0（NMOS），V_GS = 0时已有沟道</p>
<div class="info">现代CMOS工艺使用离子注入精确控制V_T，使NMOS的V_T ≈ 0.3-0.4V，PMOS的V_T ≈ -0.3~-0.4V。</div>`},
{n:"亚阈值特性与亚阈值摆幅",s:"★★★★☆",exam:1,body:`<p><strong>亚阈值区</strong>（V_GS < V_T）：弱反型区，MOSFET并未完全关断，仍有微小的漏电流。</p>
<div class="formula-box">亚阈值电流：<br>I_sub ∝ exp[q(V_GS-V_T)/(nkT)]<br><br>n = 1 + C_dep/C_ox ≈ 1.2-1.5<br>C_dep = ε_s/W_dep<br><br>亚阈值摆幅（SS）：<br>SS = (dV_GS/d(log₁₀I_D)) = n·(kT/q)·ln(10)<br><br>室温下理论极限：<br>SS_min = n·60 mV/dec ≈ 60-90 mV/dec<br>（理想n=1时为60mV/dec）</div>
<p><strong>SS的意义</strong>：SS描述关断时电流下降的速度。SS越小，器件开关特性越好。</p>
<p><strong>影响SS的因素</strong>：</p>
<p>① <strong>tox增大</strong>→ C_ox减小 → n增大 → SS增大（变差）</p>
<p>② <strong>界面态</strong>→ 等效增大n → SS增大</p>
<p>③ <strong>DIBL效应</strong>→ V_BR引起额外亚阈值泄漏</p>
<div class="warn"><strong>重要限制</strong>：SS的Boltzmann极限（60mV/dec）是传统MOSFET的固有限制。隧穿FET（TFET）可以突破此限制。</div>`},
{n:"短沟道效应",s:"★★★★☆",exam:1,body:`<p><strong>短沟道效应</strong>：MOSFET沟道长度缩短到亚微米以下时出现的各种非理想效应。</p>
<p><strong>① 阈值电压的沟道长度依赖性</strong>：</p>
<div class="formula-box">L减小 → 源漏耗尽层扩展到沟道下方<br>→ 有效耗尽层电荷减少<br>→ V_T降低（V_T roll-off）<br><br>ΔV_T ∝ exp(-L/(2l_t))<br>l_t = √(ε_s·tox·x_dep/ε_ox)（特征长度）</div>
<p><strong>② DIBL（Drain-Induced Barrier Lowering）</strong>：</p>
<div class="formula-box">V_DS增大 → 漏端电场影响源端势垒<br>→ V_T降低<br>DIBL = ΔV_T/ΔV_DS（mV/V）<br>理想：DIBL = 0<br>实际：DIBL ≈ 50-200 mV/V（短沟道）</div>
<p><strong>③ 穿通（Punch-through）</strong>：源漏耗尽层相连→电流无法关断。</p>
<p><strong>④ 速度饱和</strong>：短沟道中电场极强，载流子速度饱和，I_D ∝ (V_GS-V_T)（不再是平方关系）。</p>
<p><strong>⑤ 热载流子效应</strong>：高能载流子注入栅氧化层→可靠性问题。</p>
<div class="info">应对短沟道效应的技术：高κ栅介质（减小EOT）、FinFET三维结构、应变硅（提高迁移率）、超薄体SOI等。</div>`},
{n:"MOSFET的频率特性",s:"★★★☆☆",body:`<p><strong>截止频率f_T</strong>：电流增益等于1的频率，标志器件可以工作的最高频率。</p>
<div class="formula-box">f_T = g_m/(2πC_gs)<br><br>g_m = dI_D/dV_GS = μ_nC_ox(W/L)(V_GS-V_T)<br>C_gs ≈ (2/3)·W·L·C_ox（饱和区）<br><br>简化：<br>f_T ≈ μ_n(V_GS-V_T)/(2πL²)<br>∝ 1/L²（沟道越短越快）</div>
<p><strong>提高频率的方法</strong>：</p>
<p>① 缩短沟道长度L（最主要）</p>
<p>② 提高迁移率μ（应变Si、III-V沟道）</p>
<p>③ 减小栅氧化层厚度tox（增大C_ox，提高g_m）</p>
<p>④ 优化器件结构（减少寄生电容和电阻）</p>
<div class="info">现代FinFET的f_T可达300-500GHz，满足5G毫米波和太赫兹应用需求。</div>`},
{n:"界面态密度的测量",s:"★★★★☆",body:`<p><strong>高频-低频C-V法</strong>：</p>
<div class="formula-box">N_it(φ_s) = C_ox/q · [C_LF/C_ox)^(-1) - (C_HF/C_ox)^(-1)] · (dC_HF/dφ_s)^(-1)<br><br>简化：N_it ≈ (C_LF - C_HF)/(q·A)<br>A为栅面积</div>
<p><strong>电导法</strong>：</p>
<div class="formula-box">界面态在禁带中形成连续能级<br>与导带/价带交换载流子<br>→ 等效为并联电导G_p<br><br>G_p/ω = qD_it/2 · ln[1+(ωτ)²]/(ωτ)²<br>τ = τ₀·exp(qφ_s/kT)<br><br>测量G_p-ω关系 → 拟合得到D_it和τ</div>
<p><strong>其他方法</strong>：</p>
<p>① <strong>电荷泵法</strong>：测量MOSFET的基极（衬底）电流，直接给出N_it</p>
<p>② <strong>深能级瞬态谱（DLTS）</strong>：测量界面态的能级分布</p>
<p>③ <strong>准静态C-V法</strong>：低频（准静态）扫描，与高频对比</p>
<div class="info">电导法被认为是最准确的界面态测量方法。Si/SiO₂的典型N_it值：热氧化后 ~10¹⁰ cm⁻²·eV⁻¹，辐照后可达10¹² cm⁻²·eV⁻¹。</div>`},
{n:"多晶硅栅与金属栅技术",s:"★★★☆☆",body:`<p><strong>栅极材料的演变</strong>：</p>
<div class="formula-box">早期：Al栅（1960s-70s）<br>Φ_m = 4.28eV → 只能做N沟道增强型<br>工艺简单，但不能做互补MOS<br><br>多晶硅栅（1980s-2000s）：<br>n⁺ poly-Si: Φ_m ≈ 4.1eV（与Si导带对齐）<br>p⁺ poly-Si: Φ_m ≈ 5.2eV（与Si价带对齐）<br>可同时实现NMOS和PMOS → CMOS<br><br>金属栅（2007-now）：<br>TiN: Φ_m ≈ 4.6eV（可调）<br>TaN: Φ_m ≈ 4.4eV<br>功函数随厚度/工艺可调</div>
<p><strong>栅极材料选择的影响</strong>：</p>
<div class="formula-box">NMOS V_T取决于Φ_m：<br>Φ_m ↓ → V_T ↓（容易形成反型）<br><br>PMOS V_T取决于Φ_m：<br>Φ_m ↑ → |V_T| ↓（容易形成反型）<br><br>理想情况：<br>NMOS: Φ_m = E_c（~4.1eV）→ V_T最低<br>PMOS: Φ_m = E_v（~5.2eV）→ |V_T|最低<br><br>多晶硅栅的优点：<br>① 自对准工艺（源漏离子注入穿过多晶硅栅）<br>② 功函数可通过掺杂调节</div>
<div class="info">先进节点（<28nm）使用金属栅+HKMG（高κ介质+金属栅），取代多晶硅栅，以减少多晶硅耗尽效应和栅极漏电。</div>`},
{n:"界面固定电荷与可动离子",s:"★★★★☆",body:`<p><strong>Si/SiO₂界面电荷类型</strong>：</p>
<div class="formula-box">① 固定氧化层电荷（Q_f）：<br>位于SiO₂中距界面~2nm处<br>面密度：10¹⁰~10¹² cm⁻²<br>不随偏压改变（"固定"）<br>与氧化工艺有关<br><br>② 可动离子电荷（Q_m）：<br>主要是Na⁺、K⁺等碱金属离子<br>在SiO₂中可移动（温度+偏压驱动）<br>导致阈值电压漂移<br>需要严格控制（<10¹⁰ cm⁻²）<br><br>③ 界面态电荷（Q_it）：<br>在Si/SiO₂界面的悬挂键<br>可与半导体交换载流子<br>可正可负，依赖于费米能级位置</div>
<p><strong>电荷对C-V曲线的影响</strong>：</p>
<div class="formula-box">固定电荷Q_f → C-V曲线平移<br>ΔV = -Q_f/C_ox<br>Q_f > 0 → 曲线左移（NMOS V_T减小）<br><br>可动离子 → 高温偏压应力后曲线偏移<br>BTS实验：80-120°C + 负偏压 → Na⁺移动到界面<br>→ C-V曲线明显偏移</div>
<div class="warn"><strong>工艺关键</strong>：Na⁺是MOS工艺中最危险的污染源。一个指纹就可引入~10¹² Na⁺/cm²。因此CMOS工艺需要超净环境和清洁的氧化层生长工艺。</div>`},
{n:"多晶硅耗尽效应",s:"★★★☆☆",body:`<p><strong>多晶硅耗尽</strong>：在反型条件下，多晶硅栅的表面附近出现耗尽层，等效增加氧化层厚度，降低栅电容。</p>
<div class="formula-box">等效氧化层厚度：<br>EOT = t_ox + ε_ox/ε_si · x_dep<br><br>x_dep = 多晶硅耗尽层宽度<br><br>影响：<br>C_eff = C_ox·C_poly/(C_ox+C_poly) < C_ox<br><br>栅压越大→耗尽越深→EOT越大→跨导降低<br><br>典型EOT损失：0.3-0.5nm（对于2nm氧化层）</div>
<p><strong>解决方案</strong>：</p>
<p>① 金属栅极：无耗尽效应（金属不耗尽）→ 这是采用HKMG的重要原因之一</p>
<p>② 重掺杂多晶硅（>10²⁰ cm⁻³）：减小耗尽层宽度</p>
<p>③ 厚栅介质：相对影响变小</p>
<div class="info">多晶硅耗尽效应是推动金属栅技术发展的关键因素之一。在28nm及以下节点，HKMG已成为标准工艺。</div>`},
{n:"MOSFET的沟道长度调制效应",s:"★★★☆☆",body:`<p><strong>沟道长度调制（CLM）</strong>：在饱和区，V_DS增大使漏端耗尽层向源端扩展，有效沟道长度缩短。</p>
<div class="formula-box">有效沟道长度：<br>L_eff = L - ΔL<br><br>ΔL = 漏端夹断点到冶金结的距离<br><br>饱和电流修正：<br>I_D = (W/2L_eff)·μ_nC_ox(V_GS-V_T)²·(1+λV_DS)<br><br>λ = 沟道长度调制参数<br>λ = ΔL/(L·V_DS) ∝ 1/L<br><br>输出电阻：<br>r_o = 1/(λI_D)</div>
<p><strong>影响</strong>：</p>
<p>① 饱和区I_D不再恒定，随V_DS增大略有增加</p>
<p>② 输出电阻r_o有限→电压增益有限</p>
<p>③ L越短→CLM越严重→r_o越低</p>
<div class="formula-box">小信号电压增益：<br>A_v = g_m·r_o = (2I_D/(V_GS-V_T))·(1/(λI_D))<br>= 2/(λ(V_GS-V_T))<br>与L成正比（L越长增益越高）</div>
<div class="info">在模拟电路中，长沟道器件（L较大）用于获得高增益；在数字电路中，短沟道器件用于高速和高密度。</div>`},
{n:"NBTI与可靠性",s:"★★★★☆",body:`<p><strong>NBTI（Negative Bias Temperature Instability）</strong>：PMOS器件在负栅压+高温条件下的阈值电压漂移现象。是先进CMOS器件最主要的可靠性问题之一。</p>
<div class="formula-box">NBTI机理（反应-扩散模型）：<br>① 负偏压使Si-H键断裂→界面态产生<br>② H扩散到SiO₂中（或H₂）<br>③ 界面态作为正电荷→|V_T|增大<br><br>ΔV_T = A·V_G^α·t^n<br>n ≈ 0.16（时间指数）<br>α ≈ 1（电压指数）<br><br>恢复效应：<br>去除偏压后ΔV_T部分恢复<br>（H从SiO₂扩散回界面→Si-H键重新形成）</div>
<p><strong>NBTI的影响</strong>：</p>
<p>① PMOS |V_T|增大→电路速度下降</p>
<p>② 电路设计需要留有性能余量（guardband）</p>
<p>③ 先进节点NBTI更严重（薄氧化层、高电场）</p>
<p><strong>缓解措施</strong>：</p>
<p>① 优化氧化工艺（减少弱Si-H键）</p>
<p>② 使用SiON或High-κ介质</p>
<p>③ 适当的器件设计余量</p>
<div class="info">NBTI是SRAM和逻辑电路在长期使用中性能退化的主要原因。理解NBTI机理对于器件可靠性评估至关重要。</div>`},
{n:"MOSFET的沟道掺杂分布优化",s:"★★★☆☆",body:`<p><strong>沟道掺杂工程</strong>：通过优化沟道区域的掺杂分布来改善器件性能。</p>
<div class="formula-box">① 逆掺杂（Retrograde Doping）：<br>表面掺杂低，体内掺杂高<br><br>优点：<br>- 表面低掺杂→高迁移率<br>- 体内高掺杂→抑制穿通<br><br>工艺：低能量离子注入 + 高温驱入<br><br>② HALO注入（Pocket Implant）：<br>在源漏两端局部高掺杂<br><br>优点：<br>- 抑制短沟道效应（V_T roll-off）<br>- 减小DIBL<br><br>工艺：倾斜离子注入（tilt implant）<br><br>③ 超浅结（Ultra-Shallow Junction）：<br>结深 < 10nm<br>使用低能量(0.5-5keV)B⁺注入 + 快速退火</div>
<p><strong>掺杂优化的权衡</strong>：</p>
<table class="cmp"><tr><th>掺杂类型</th><th>优点</th><th>缺点</th></tr><tr><td>均匀掺杂</td><td>工艺简单</td><td>V_T和短沟道效应难以同时优化</td></tr><tr><td>逆掺杂</td><td>高迁移率+抑制穿通</td><td>工艺复杂</td></tr><tr><td>HALO</td><td>抑制SCE效果好</td><td>增加电容、增加工艺步骤</td></tr></table>
<div class="info">现代先进节点（<14nm）中，FinFET的3D结构本身提供了良好的栅控能力，但仍需要精心的掺杂工程来优化V_T和抑制SCE。</div>`}
],

// ============ Chapter 9: 异质结、光学性质与特殊效应 ============
{title:"第9章 异质结、光学性质与特殊效应",sub:"异质结、光吸收、激光器、霍尔效应等",tag:"综合应用",kps:[
{n:"异质结的能带偏移",s:"★★★★★",exam:1,body:`<p><strong>异质结</strong>：两种不同禁带宽度的半导体形成的结。</p>
<div class="formula-box">能带偏移量：<br>ΔE_c = χ₁ - χ₂（亲和能差）<br>ΔE_g = Eg₂ - Eg₁<br>ΔE_c + ΔE_v = ΔE_g<br><br>类型I（跨立型，straddling）：<br>窄带隙被完全包围：ΔE_c > 0, ΔE_v > 0<br>如：GaAs/AlGaAs量子阱<br><br>类型II（错开型，staggered）：<br>ΔE_c和ΔE_v同号但不完全包围<br>如：InGaAs/GaAsSb<br><br>类型III（断裂型，broken）：<br>能带不重叠<br>如：InAs/GaSb</div>
<p><strong>Anderson模型</strong>：假设真空能级连续，用亲和能差确定ΔE_c。</p>
<div class="formula-box">同型异质结（如n-N）：<br>两边都是N型，费米能级对齐<br>形成"尖峰"型势垒<br><br>反型异质结（如n-P）：<br>N型窄带隙 + P型宽带隙<br>形成类似PN结的势垒<br>注入效率高（载流子限制）</div>
<div class="warn"><strong>Anderson模型的局限</strong>：实际异质结的ΔE_c不一定等于χ₁-χ₂。界面偶极、化学键合等因素会影响偏移量。实验数据通常更可靠。</div>`},
{n:"同型异质结与反型异质结",s:"★★★★☆",body:`<p><strong>反型异质结</strong>（如n-AlGaAs/p-GaAs）：</p>
<div class="formula-box">类似PN结，但有能带不连续性<br>ΔE_c和ΔE_v在界面形成"台阶"<br><br>注入效率：<br>γ = J_n/(J_n+J_p)<br>由于ΔE_c > ΔE_v（通常），<br>电子注入势垒 < 空穴注入势垒<br>→ 电子注入效率远高于空穴<br>→ γ → 1（高注入效率）</div>
<p><strong>同型异质结</strong>（如n-AlGaAs/n-GaAs）：</p>
<div class="formula-box">两边同型，费米能级对齐后：<br>导带有ΔE_c的"尖峰"<br>在宽带隙侧形成三角形势阱<br>→ 量子阱中的2DEG<br><br>调制掺杂：<br>宽带隙层重掺杂（如AlGaAs:Si）<br>窄带隙层不掺杂（如GaAs）<br>电子转移到GaAs侧→2DEG<br>远离施主→无电离杂质散射<br>→ 极高迁移率</div>
<div class="info">调制掺杂是HEMT（高电子迁移率晶体管）的基础。GaAs基HEMT的室温迁移率可达8000-10000 cm²/Vs。</div>`},
{n:"二维电子气(2DEG)",s:"★★★★☆",exam:1,body:`<p><strong>2DEG</strong>：在异质结界面的三角势阱中，电子在垂直于界面方向被量子化，只能在平面内自由运动。</p>
<div class="formula-box">三角势阱近似：<br>V(z) = qF·z (z > 0)<br>V(z) = ∞ (z < 0)<br><br>能级（Airy函数）：<br>E_n = (ℏ²/2m*)^(1/3)·(3πqF/2)^(2/3)·(n-1/4)^(2/3)<br>n = 1,2,3...<br><br>基态能量：E₁ ≈ (qFℏ)^(2/3)/(2m*)^(1/3)·常数</div>
<p><strong>2DEG的态密度</strong>：</p>
<div class="formula-box">三维态密度：g(E) ∝ E^(1/2)<br>二维态密度：g₂D = m*/(πℏ²)（阶梯函数）<br>一维态密度：g₁D ∝ E^(-1/2)<br>零维态密度：δ函数（量子点）</div>
<p><strong>2DEG的输运特性</strong>：</p>
<p>① 迁移率极高（调制掺杂后无杂质散射）</p>
<p>② 量子霍尔效应（整数量子霍尔效应在2DEG中发现）</p>
<p>③ 磁阻振荡（Shubnikov-de Haas效应）</p>
<div class="info">量子霍尔效应中，霍尔电导率量子化为σ_xy = n·e²/h，精确到10⁻⁹。被用作电阻标准。</div>`},
{n:"半导体的光吸收",s:"★★★★★",exam:1,body:`<p><strong>本征吸收</strong>：光子能量hν ≥ E_g时，价带电子被激发到导带，产生电子-空穴对。</p>
<div class="formula-box">吸收系数：<br>α(ν) ∝ (hν-E_g)^r<br><br>r = 1/2：直接带隙（允许直接跃迁）<br>r = 3/2：间接带隙（禁戒直接跃迁）<br>r = 2：间接带隙（允许间接跃迁，需声子参与）<br>r = 3：间接带隙（禁戒间接跃迁）<br><br>GaAs（直接）：r = 1/2，α ~ 10⁴ cm⁻¹<br>Si（间接）：r = 2，α ~ 10²-10³ cm⁻¹</div>
<p><strong>吸收边</strong>：光吸收开始的波长（能量等于E_g时）。</p>
<div class="formula-box">λ_c = hc/E_g = 1.24/E_g(μm·eV)<br><br>Si: E_g=1.12eV → λ_c≈1.1μm<br>GaAs: E_g=1.43eV → λ_c≈0.87μm<br>Ge: E_g=0.66eV → λ_c≈1.88μm</div>
<p><strong>其他吸收机制</strong>：</p>
<p>① <strong>激子吸收</strong>：hν略小于E_g，形成束缚的电子-空穴对</p>
<p>② <strong>自由载流子吸收</strong>：hν < E_g，导带（价带）中的自由载流子吸收光子跃迁到更高能态。α ∝ λ²</p>
<p>③ <strong>晶格吸收</strong>：光子被声子吸收，产生晶格振动的激发</p>
<p>④ <strong>杂质吸收</strong>：杂质态的电子/空穴吸收光子</p>
<div class="tip"><strong>考研高频</strong>：直接和间接带隙的吸收系数差异（数量级！）直接决定了器件应用方向。</div>`},
{n:"直接与间接跃迁选择定则",s:"★★★★☆",exam:1,body:`<p><strong>直接跃迁</strong>：导带底和价带顶在k空间同一位置（如GaAs在Γ点）。</p>
<div class="formula-box">选择定则：<br>Δk = 0（光子动量极小可忽略）<br>hν = E_g（能量守恒）<br><br>跃迁概率高 → α大 → 10⁴~10⁵ cm⁻¹<br><br>适合光电器件：<br>LED、激光器、光电探测器</div>
<p><strong>间接跃迁</strong>：导带底和价带顶在k空间不同位置（Si、Ge）。</p>
<div class="formula-box">需要声子参与（满足动量守恒）：<br>Δk = k_声子<br>hν = E_g ± E_phonon<br><br>三粒子过程 → 概率低 → α小<br>α ~ 10²~10³ cm⁻¹<br><br>不如直接跃迁高效<br>LED和激光器性能差</div>
<table class="cmp"><tr><th>材料</th><th>带隙类型</th><th>α(cm⁻¹)</th><th>LED/激光</th></tr><tr><td>GaAs</td><td>直接</td><td>~10⁴</td><td>✓ 高效</td></tr><tr><td>Si</td><td>间接</td><td>~10³</td><td>✗ 效率低</td></tr><tr><td>Ge</td><td>间接</td><td>~10³</td><td>✗ 效率低</td></tr><tr><td>GaN</td><td>直接</td><td>~10⁵</td><td>✓ 蓝光LED</td></tr></table>
<div class="info">Si是间接带隙，难以高效发光，这是硅光子学面临的主要挑战。但硅基光探测器（利用1.1μm以下的吸收）在光纤通信中有应用。</div>`},
{n:"半导体激光器原理",s:"★★★★★",exam:1,body:`<p><strong>受激辐射</strong>：一个光子诱导处于高能级的电子跃迁到低能级，释放一个与入射光子完全相同的光子（同频率、同方向、同相位）。</p>
<div class="formula-box">受激辐射率 ∝ B₂₁·ρ(ν)·f₂(E₂)[1-f₁(E₁)]<br><br>粒子数反转条件：<br>N₂ > N₁（高能级粒子数大于低能级）<br><br>在半导体中：<br>需要E_Fn - E_Fp > hν（Bernard-Duraffourg条件）<br>即准费米能级的分裂大于光子能量</div>
<p><strong>半导体激光器结构</strong>：</p>
<div class="formula-box">① 双异质结（DH）结构：<br>n-AlGaAs / p-GaAs（有源层）/ p-AlGaAs<br><br>载流子限制：ΔE_c和ΔE_v将载流子限制在有源层<br>光限制：折射率差 n_GaAs(3.6) > n_AlGaAs(3.4)<br>→ 形成光波导<br><br>② 谐振腔：<br>两个解理面（天然镜面，反射率≈32%）<br>增益 > 损耗时产生激光<br><br>阈值条件：<br>g_th = α_i + (1/2L)·ln(1/R₁R₂)</div>
<p><strong>阈值电流密度</strong>：J_th ≈ 100-500 A/cm²（室温连续工作）</p>
<div class="info">量子阱激光器的有源层厚度仅~10nm，利用量子限制效应进一步降低阈值电流。DFB激光器使用光栅实现单纵模工作，是光纤通信的首选光源。</div>`},
{n:"LED效率",s:"★★★★☆",exam:1,body:`<p><strong>内量子效率</strong>：</p>
<div class="formula-box">η_int = 辐射复合速率/(总复合速率)<br>= R_rad/(R_rad + R_non-rad)<br>= 1/(1 + τ_rad/τ_nr)<br><br>直接带隙：τ_rad ~ 1ns, τ_nr >> τ_rad → η_int ≈ 90%+<br>间接带隙：τ_rad ~ 1μs, τ_nr ~ 100ns → η_int < 10%</div>
<p><strong>外量子效率</strong>：</p>
<div class="formula-box">η_ext = η_int · η_extract<br><br>η_extract = 光取出效率<br>由全内反射限制：<br>临界角 θ_c = arcsin(n_air/n_semiconductor)<br>GaAs(n=3.6): θ_c ≈ 16°<br>只有 ~2% 的光能直接射出<br><br>提高取出效率：<br>① 粗糙表面散射<br>② 透镜结构<br>③ 光子晶体<br>④ 薄膜倒装结构</div>
<div class="warn"><strong>考试常问</strong>：LED效率的两个关键因素——内量子效率（材料和结构）和光取出效率（几何和光学设计）。</div>`},
{n:"发光材料与波长",s:"★★★☆☆",body:`<p><strong>LED/Laser材料选择</strong>：</p>
<div class="formula-box">发光波长：λ = hc/E_g = 1.24/E_g(μm)<br><br>GaAs (1.43eV): λ ≈ 870nm（近红外）<br>GaP (2.26eV): λ ≈ 550nm（绿色，间接带隙）<br>GaN (3.4eV): λ ≈ 365nm（紫外）<br>InGaN: 通过In含量调节E_g（蓝/绿光）<br>AlGaAs: 可调E_g（红光/近红外）</div>
<p><strong>三元/四元合金</strong>：</p>
<div class="formula-box">E_g(x) = (1-x)·E_g(A) + x·E_g(B) - b·x·(1-x)<br>b为弯曲系数<br><br>In_xGa_{1-x}N：<br>x=0: E_g=3.4eV（GaN，紫外）<br>x=0.3: E_g≈2.7eV（蓝光）<br>x=0.5: E_g≈2.0eV（绿光）</div>
<p><strong>晶格匹配</strong>：外延生长要求衬底和外延层的晶格常数匹配（失配 < 0.1%），否则产生大量失配位错。常用衬底：GaAs、InP、蓝宝石、SiC。</p>
<div class="info">2014年诺贝尔物理学奖授予蓝光LED的发明（赤崎勇、天野浩、中村修二），使白光LED照明成为现实。</div>`},
{n:"光电探测器结构与原理",s:"★★★★☆",exam:1,body:`<p><strong>PIN光电二极管</strong>：</p>
<div class="formula-box">结构：P⁺-I-N⁺<br>I层（本征层）为光吸收区<br>耗尽层宽→高量子效率<br>光生电子-空穴对被电场分离→光电流<br><br>响应度：<br>R = η·q/(hν) = η·λ(μm)/1.24<br>η = 量子效率<br><br>GaAs PIN @ 850nm:<br>η ≈ 80%, R ≈ 0.55 A/W</div>
<p><strong>雪崩光电二极管（APD）</strong>：</p>
<div class="formula-box">在高反偏下工作<br>光生载流子触发电离→雪崩倍增<br><br>增益 M = 1/(1-(V/V_BR)^n)<br>带宽受倍增过程的时间抖动限制<br>响应度 R_APD = M·R_PIN</div>
<p><strong>PIN vs APD</strong>：</p>
<table class="cmp"><tr><th>特征</th><th>PIN</th><th>APD</th></tr><tr><td>增益</td><td>1</td><td>10-100</td></tr><tr><td>噪声</td><td>低</td><td>较高（倍增噪声）</td></tr><tr><td>偏压</td><td>低（<20V）</td><td>高（>50V）</td></tr><tr><td>速度</td><td>快</td><td>稍慢</td></tr><tr><td>应用</td><td>短距通信</td><td>长距通信</td></tr></table>
<div class="info">Ge APD用于1.3-1.55μm光纤通信。InGaAs/InP PIN和APD是光纤通信的主流光探测器。</div>`},
{n:"太阳能电池基础",s:"★★★★★",exam:1,body:`<p><strong>光伏效应</strong>：PN结在光照下产生电动势和电流。</p>
<div class="formula-box">光照时：<br>光生电子-空穴对被内建电场分离<br>→ 光生电流 I_L（方向与I_s相反）<br><br>I = I_L - I_s·[exp(qV/kT)-1]<br><br>开路电压：<br>V_oc = (kT/q)·ln(I_L/I_s + 1)<br><br>短路电流：<br>I_sc ≈ I_L（≈ 光生载流子总数）<br><br>填充因子：<br>FF = P_max/(I_sc·V_oc) = (I_mp·V_mp)/(I_sc·V_oc)</div>
<p><strong>效率</strong>：</p>
<div class="formula-box">η = P_max/P_in = (I_sc·V_oc·FF)/P_in<br><br>单结太阳能电池理论极限：<br>Shockley-Queisser极限：<br>对于 E_g ≈ 1.34eV：η_max ≈ 33.7%<br><br>实际效率（2025年）：<br>Si单晶：~26.8%<br>GaAs：~29.1%<br>钙钛矿/Si叠层：~33.9%</div>
<p><strong>影响效率的因素</strong>：</p>
<p>① <strong>E_g太小</strong>：热化损失（光子能量-E_g以热的形式损失）</p>
<p>② <strong>E_g太大</strong>：透射损失（hν < E_g的光子不被吸收）</p>
<p>③ <strong>串联电阻</strong>：接触电阻、体电阻→FF降低</p>
<p>④ <strong>复合损失</strong>：表面复合、体复合→I_L减小</p>
<div class="tip"><strong>考研高频</strong>：S-Q极限的物理解释。最优E_g≈1.3-1.5eV是热化损失和透射损失的折中。</div>`},
{n:"光纤通信半导体材料",s:"★★★☆☆",body:`<p><strong>光纤通信波段</strong>：三个低损耗窗口。</p>
<div class="formula-box">① 850nm（第一窗口）<br>多模光纤，损耗~2dB/km<br>光源：GaAlAs/GaAs激光器<br>探测器：Si PIN/APD<br><br>② 1310nm（第二窗口）<br>单模光纤，零色散<br>光源：InGaAsP/InP激光器<br>探测器：Ge或InGaAs PIN<br><br>③ 1550nm（第三窗口）<br>单模光纤，最低损耗0.2dB/km<br>光源：InGaAsP DFB激光器<br>探测器：InGaAs PIN/APD<br>EDFA光放大器</div>
<p><strong>材料选择原则</strong>：</p>
<p>① 光源：E_g对应发光波长略小于工作波长</p>
<p>② 探测器：E_g对应的吸收边应略大于工作波长</p>
<p>③ 晶格匹配：InP衬底与InGaAsP（1.3-1.6μm）匹配</p>
<div class="info">1550nm波段是长距离光纤通信的核心波段，InGaAsP/InP材料体系几乎垄断了这一领域。</div>`},
{n:"热电效应（塞贝克效应）",s:"★★★★☆",exam:1,body:`<p><strong>塞贝克效应</strong>：两种不同导体/半导体构成的回路中，两个接头的温差产生电动势。</p>
<div class="formula-box">塞贝克系数（热电势）：<br>S = dV/dT（V/K）<br><br>N型半导体：S < 0<br>P型半导体：S > 0<br><br>回路电动势：<br>ε = ∫(S_A - S_B)dT ≈ (S_A-S_B)·ΔT</div>
<p><strong>微观机制</strong>：</p>
<p>① 载流子从热端扩散到冷端（温差驱动）</p>
<p>② N型：电子扩散到冷端→冷端带负电→S < 0</p>
<p>③ P型：空穴扩散到冷端→冷端带正电→S > 0</p>
<div class="formula-box">N型半导体塞贝克系数：<br>S = -(k/q)·[(E_c-E_F)/kT + A]<br>A ≈ 2-4（取决于散射机制）<br><br>高温（本征激发）：<br>S = -(k/q)·[(E_g/2kT) + (3/4)·ln(m_p*/m_n*)]</div>
<p><strong>塞贝克效应的应用</strong>：</p>
<p>① <strong>热电偶</strong>：温度测量</p>
<p>② <strong>热电发电</strong>：废热回收</p>
<p>③ <strong>热电制冷</strong>（帕尔帖效应的逆应用）</p>
<div class="tip"><strong>考研简答题</strong>：解释塞贝克效应的物理机制，以及为什么半导体的热电势远大于金属（S半导体~mV/K，S金属~μV/K）。</div>`},
{n:"热电优值与热电材料",s:"★★★☆☆",body:`<p><strong>热电优值</strong>：</p>
<div class="formula-box">ZT = S²σT/κ<br><br>S：塞贝克系数<br>σ：电导率<br>κ：热导率 = κ_e（电子）+ κ_L（晶格）<br>T：绝对温度<br><br>ZT > 1：较好的热电材料<br>ZT > 3：实用化的门槛</div>
<p><strong>S²σ称为功率因子</strong>，需要同时优化S和σ。但σ增大会使S减小（相互制约）。</p>
<p><strong>降低热导率的策略</strong>：</p>
<p>① <strong>声子晶体</strong>：纳米结构散射声子</p>
<p>② <strong>超晶格</strong>：界面反射声子</p>
<p>③ <strong>笼状化合物</strong>：如CoSb₃中的"rattler"原子</p>
<p><strong>高性能热电材料</strong>：</p>
<table class="cmp"><tr><th>材料</th><th>ZT</th><th>温度范围</th></tr><tr><td>Bi₂Te₃</td><td>~1</td><td>室温附近</td></tr><tr><td>PbTe</td><td>~2</td><td>500-900K</td></tr><tr><td>SiGe</td><td>~1</td><td>900-1300K</td></tr><tr><td>SnSe</td><td>~2.6</td><td>~900K</td></tr></table>
<div class="info">热电材料的"电子晶体-声子玻璃"理想：像晶体一样导电（高σ），像玻璃一样隔热（低κ_L）。</div>`},
{n:"压阻效应",s:"★★★☆☆",body:`<p><strong>压阻效应</strong>：应力改变半导体的能带结构，从而改变电阻率。</p>
<div class="formula-box">压阻系数定义：<br>Δρ/ρ₀ = π_l·σ_l + π_t·σ_t<br><br>π_l：纵向压阻系数<br>π_t：横向压阻系数<br>σ_l：纵向应力<br>σ_t：横向应力<br><br>Si的压阻系数（室温）：<br>p型Si[111]：π_l ≈ 93×10⁻¹¹ Pa⁻¹<br>n型Si[100]：π_l ≈ -102×10⁻¹¹ Pa⁻¹</div>
<p><strong>物理机制</strong>：</p>
<p>① 应力改变导带/价带结构（能谷分裂）</p>
<p>② 载流子在不同能谷间重新分布</p>
<p>③ 不同能谷的有效质量不同→电阻率改变</p>
<p><strong>应用</strong>：压阻传感器（压力传感器、加速度计、应变片）</p>
<div class="info">Si的压阻系数比金属大50-100倍，这是MEMS压力传感器灵敏度高的物理基础。</div>`},
{n:"非晶态半导体",s:"★★★★☆",body:`<p><strong>非晶态半导体</strong>：原子排列没有长程有序（无周期性），但短程有序（配位数与晶体相同）。</p>
<div class="formula-box">能态模型：<br>① 扩展态（extended states）：类似于晶体的能带<br>② 局域态（localized states）：在带尾和禁带中<br><br>迁移率边（mobility edge）：<br>E_c和E_v定义了扩展态和局域态的边界<br>μ = 0（局域态）, μ > 0（扩展态）<br><br>导电机制：<br>费米能级附近的局域态：跳跃导电（hopping）<br>扩展态：类似晶体的漂移导电</div>
<p><strong>非晶硅（a-Si:H）</strong>：</p>
<div class="formula-box">掺氢可以饱和悬挂键<br>悬挂键密度：~10¹⁶ cm⁻³ → ~10¹⁵ cm⁻³<br>E_g ≈ 1.7 eV（比晶体Si大）<br>μ_n ≈ 1 cm²/Vs（比晶体Si低2-3个数量级）<br><br>Staebler-Wronski效应：<br>长期光照→悬挂键增多→效率下降<br>太阳电池初始效率~12%→稳定后~9%</div>
<div class="info">非晶硅太阳电池虽然效率较低，但可在玻璃、柔性基底上大面积沉积，成本低，适合建筑一体化光伏。</div>`},
{n:"超晶格与量子限制效应",s:"★★★★☆",body:`<p><strong>超晶格</strong>：两种不同半导体材料交替生长形成的周期性多层结构，周期（a+b）通常为几nm~几十nm。</p>
<div class="formula-box">超晶格周期 d = d_A + d_B<br>当d >> 原子间距时：<br>形成"微带"（miniband）<br>微隙（minigap）分隔微带<br><br>微带宽度和位置由：<br>① 势阱宽度d_A<br>② 势垒宽度d_B<br>③ ΔE_c（能带偏移量）<br>共同决定</div>
<p><strong>量子限制效应</strong>：</p>
<div class="formula-box">量子阱（1D限制）：<br>E_n = n²π²ℏ²/(2m*·L²) + ℏ²k_xy²/(2m*)<br>态密度：阶梯函数 g₂D ∝ ΣΘ(E-E_n)<br><br>量子线（2D限制）：<br>E_{n,m} = (n²+m²)π²ℏ²/(2m*L²)<br>态密度：g₁D ∝ E^(-1/2)<br><br>量子点（3D限制）：<br>E_{n,m,l} 离散能级<br>态密度：δ函数</div>
<p><strong>应用</strong>：</p>
<p>① <strong>量子阱激光器</strong>：阈值电流密度极低</p>
<p>② <strong>量子级联激光器</strong>：中远红外光源</p>
<p>③ <strong>量子点LED</strong>：色纯度高，显示应用</p>
<p>④ <strong>共振隧穿二极管</strong>：利用微带的负微分电阻</p>
<div class="info">量子点的尺寸效应使其发光波长可调。CdSe量子点：2nm→蓝光，6nm→红光。这是QLED显示的物理基础。</div>`},
{n:"压电效应与铁电半导体",s:"★★☆☆☆",body:`<p><strong>压电效应</strong>：在没有中心对称的晶体中，机械应力产生电极化（正压电效应），或电场产生形变（逆压电效应）。</p>
<div class="formula-box">压电方程：<br>D = ε·S + d·T（正压电）<br>S = s·T + d·E（逆压电）<br><br>有压电性的半导体：<br>GaN（纤锌矿结构，无中心对称）<br>ZnO, CdS, CdTe, AlN<br><br>Si和GaAs（闪锌矿）也有压电效应但较弱</div>
<p><strong>GaN中的压电效应</strong>：</p>
<p>AlGaN/GaN异质结中，AlGaN层的自发极化和压电极化产生很强的界面电荷→高密度2DEG（~10¹³ cm⁻²），无需掺杂。这是GaN HEMT的基础。</p>
<div class="info">GaN HEMT的2DEG密度远高于GaAs HEMT，适合高功率微波应用。</div>`},
{n:"Anderson模型的能带偏移计算",s:"★★★★★",exam:1,body:`<p><strong>Anderson规则</strong>（电子亲和能规则）：异质结的导带偏移ΔE_c等于两种半导体电子亲和能之差。</p>
<div class="formula-box">ΔE_c = χ₁ - χ₂（材料1导带更高时取正）<br>ΔE_v = ΔE_g - ΔE_c<br>ΔE_g = E_g₂ - E_g₁<br><br>例：Al₀.₃Ga₀.₇As/GaAs<br>χ(GaAs) = 4.07 eV<br>χ(Al₀.₃Ga₀.₇As) ≈ 3.74 eV<br>ΔE_c = 0.33 eV<br>ΔE_g = 1.80 - 1.42 = 0.38 eV<br>ΔE_v = 0.38 - 0.33 = 0.05 eV</div>
<p><strong>能带偏移比</strong>：ΔE_c/ΔE_g和ΔE_v/ΔE_g是设计异质结器件的关键参数。</p>
<div class="formula-box">Al_xGa_{1-x}As/GaAs系统：<br>ΔE_c ≈ 0.6·ΔE_g（导带承担60%偏移）<br>ΔE_v ≈ 0.4·ΔE_g<br><br>In_xGa_{1-x}As/GaAs系统：<br>ΔE_c ≈ 0.65·ΔE_g</div>
<div class="warn"><strong>易错</strong>：Anderson规则假设界面无偶极层和界面态。实际上，界面态会部分钉扎费米能级，使实际ΔE_c偏离Anderson预测。更精确的方法需要第一性原理计算。</div>`},
{n:"异质结的I-V特性",s:"★★★★☆",body:`<p><strong>理想异质结I-V</strong>：类似PN结肖克莱方程，但势垒高度由能带偏移决定。</p>
<div class="formula-box">反型异质结（如p-AlGaAs/n-GaAs）：<br>I = I_s[exp(qV/nkT) - 1]<br><br>n（理想因子）：<br>理想值n=1（扩散电流主导）<br>实际n=1.5-2（复合电流、界面态影响）<br><br>同型异质结（如n-AlGaAs/n-GaAs）：<br>热发射电流为主<br>I ∝ T²·exp(-qφ_B/kT)·[exp(qV/kT)-1]</div>
<p><strong>异质结的特殊性</strong>：<br>• 能带不连续→注入比由ΔE_c和ΔE_v决定<br>• 界面态→增加复合电流→增大理想因子<br>• 窄隙侧载流子浓度高→低串联电阻</p>
<div class="tip"><strong>设计原则</strong>：异质结激光器利用ΔE_v（对空穴的势垒）将注入的少子限制在窄隙有源区内→提高辐射复合效率。</div>`},
{n:"HEMT结构与工作原理",s:"★★★★★",exam:1,body:`<p><strong>HEMT</strong>（High Electron Mobility Transistor）：利用调制掺杂产生的2DEG作为导电沟道的场效应晶体管。</p>
<div class="formula-box">基本结构（n-AlGaAs/i-GaAs）：<br>• 宽隙侧（AlGaAs）重掺杂→提供电子<br>• 电子越过异质结界面→落入GaAs侧三角势阱<br>• 2DEG远离电离杂质→无杂质散射→极高迁移率<br><br>2DEG浓度：n_s ~ 10¹² cm⁻²<br>低温迁移率：μ > 10⁶ cm²/(V·s)（GaAs中）</div>
<p><strong>工作机制</strong>：<br>• 栅压V_G < V_T：2DEG被耗尽→器件关断<br>• V_G > V_T：2DEG形成→漏源间导通<br>• 栅压调制2DEG浓度→调制电流</p>
<div class="formula-box">HEMT跨导：<br>g_m = q·n_s·v_sat·W/L<br><br>截止频率：<br>f_T ≈ v_sat/(2πL_g)<br>L_g = 栅长</div>
<p><strong>增强型vs耗尽型</strong>：<br>• D-mode HEMT：V_T < 0（常开，需负栅压关断）<br>• E-mode HEMT：V_T > 0（常关）</p>
<div class="tip"><strong>应用</strong>：GaAs HEMT→毫米波低噪声放大器；GaN HEMT→高功率RF；InP HEMT→太赫兹电子学。</div>`},
{n:"量子阱中的子能级",s:"★★★★★",exam:1,body:`<p><strong>量子阱</strong>：两种宽带隙材料夹一层窄带隙材料（厚度d ~ 5-50nm），形成一维受限的势阱。</p>
<div class="formula-box">无限深阱近似：<br>E_n = n²π²ℏ²/(2m*d²)<br>n = 1, 2, 3...<br><br>有限深阱（实际）：<br>能级数有限<br>阱越浅/越宽→能级越多<br>E₁ < E₂ < ... < ΔE_c（阱深）</div>
<p><strong>量子阱态密度</strong>：每个子能带的态密度为台阶函数（2D态密度）。</p>
<div class="formula-box">2D态密度（每子能带）：<br>g₂D = m*/(πℏ²) = 常数（与能量无关）<br><br>总的态密度：台阶状上升<br>g(E) = Σ_n m*/(πℏ²)·H(E - E_n)<br>H(x) = Heaviside阶跃函数</div>
<p><strong>量子阱激光器的优势</strong>：<br>• 2D态密度→阈值电流低<br>• 子能级间距可调→波长可调<br>• 量子限制增强增益<br>• 温度稳定性好</p>
<div class="warn"><strong>易错</strong>：量子阱的子能级间隔随阱宽d²反比→阱越窄间隔越大。典型GaAs/AlGaAs量子阱（d=10nm）：E₁-E₂ ≈ 100meV。</div>`},
{n:"调制掺杂与异质结载流子输运",s:"★★★★☆",body:`<p><strong>调制掺杂</strong>：只在宽带隙侧掺杂，窄带隙侧保持本征。载流子（电子）通过扩散越过异质结界面，被三角势阱俘获形成2DEG。</p>
<div class="formula-box">调制掺杂的优势：<br>• 2DEG远离电离杂质→杂质散射极弱<br>• 低温迁移率可达10⁶ cm²/(V·s)<br>• 室温迁移率也显著高于同浓度体材料<br><br>2DEG面浓度：<br>n_s ≈ (ε/d)·(V_bi - V_g - ΔE_c/q)<br>d = 掺杂层厚度</div>
<p><strong>DX中心的影响</strong>：在AlGaAs中（x > 0.22），施主形成DX中心→低温下电子被DX中心俘获→2DEG浓度下降→" persistent photoconductivity"效应。</p>
<div class="info">解决方案：使用Al_xGa_{1-x}As（x < 0.22）或InGaAs沟道避开DX中心问题。</div>`},
{n:"应变层超晶格与晶格失配",s:"★★★☆☆",body:`<p><strong>晶格失配</strong>：两种材料晶格常数不同（Δa/a）。</p>
<div class="formula-box">晶格失配度：<br>f = (a_sub - a_layer)/a_sub<br><br>临界厚度（Matthews-Blakeslee）：<br>h_c ≈ (b/2πf)·[(1-ν/4)/(1+ν)]·ln(h_c/b)<br>b = Burgers矢量<br>ν = 泊松比<br><br>例：In_{0.2}Ga_{0.8}As/GaAs<br>f ≈ 1.4%<br>h_c ≈ 10 nm</div>
<p><strong>应变效应</strong>：<br>• 薄膜应变→能带劈裂（轻/重空穴分离）<br>• 应变减小有效质量→提高迁移率<br>• 应变改变带隙→可调光学性质</p>
<div class="formula-box">应变引起的带隙变化：<br>ΔE_g ≈ a_tr·(ε_xx+ε_yy+ε_zz) + b_s·(ε_zz - ε_xx)<br>a_tr = 流变变形势<br>b_s = 单轴变形势<br>ε = 应变张量</div>
<div class="tip"><strong>应用</strong>：应变Si（Si_xGe_{1-x}沟道）→提高空穴迁移率→CMOS性能增强。这是先进CMOS节点的标准技术。</div>`},
{n:"吸收系数与光子能量的定量关系",s:"★★★★★",exam:1,body:`<p><strong>直接带隙半导体</strong>的吸收系数：</p>
<div class="formula-box">α(hν) = A·(hν - E_g)^(1/2)（hν > E_g）<br>A ≈ 10⁴~10⁵ cm⁻¹<br><br>GaAs(直接)：α ~ 10⁴ cm⁻¹（hν ≈ E_g）<br>典型吸收深度 ~ 1/α ≈ 1 μm</div>
<p><strong>间接带隙半导体</strong>的吸收系数：</p>
<div class="formula-box">α(hν) = B·(hν - E_g ± E_ph)²（hν > E_g）<br>E_ph = 声子能量<br>+E_ph: 发射声子（更可能）<br>-E_ph: 吸收声子（需热激发）<br>B ~ 10²~10³ cm⁻¹<br><br>Si(间接)：α ~ 10² cm⁻¹（hν ≈ E_g）<br>吸收深度 ~ 10-100 μm</div>
<p><strong>定量对比</strong>：</p>
<table class="cmp"><tr><th>材料</th><th>类型</th><th>α @ 带边</th><th>吸收深度</th></tr><tr><td>GaAs</td><td>直接</td><td>~10⁴ cm⁻¹</td><td>~1μm</td></tr><tr><td>Si</td><td>间接</td><td>~10² cm⁻¹</td><td>~100μm</td></tr><tr><td>Ge</td><td>间接</td><td>~10³ cm⁻¹</td><td>~10μm</td></tr></table>
<div class="warn"><strong>易错</strong>：Si在300nm以下波长（UV）时吸收系数可达10⁶ cm⁻³——间接带隙只在带边附近吸收弱，短波长时直接跃迁也参与。</div>`},
{n:"激子吸收与激子效应",s:"★★★★☆",body:`<p><strong>激子</strong>（Exciton）：光激发产生的电子-空穴对通过库仑引力束缚在一起，形成的类氢束缚态。</p>
<div class="formula-box">激子结合能：<br>E_ex = m_r·q⁴/(2ε²ℏ²n²) = Ry*/n²<br>m_r = m_e·m_h/(m_e+m_h)（约化质量）<br><br>Si: E_ex ≈ 15 meV（大半径，类Mott激子）<br>GaAs: E_ex ≈ 4 meV<br>Cu₂O: E_ex ≈ 150 meV（大，可观察Rydberg系列）</div>
<p><strong>激子吸收光谱</strong>：在带边以下出现一系列尖锐的吸收峰（对应n=1,2,3...束缚态），峰间距收敛于E_g。</p>
<p><strong>自由激子vs束缚激子</strong>：<br>• 自由激子：可在晶体中自由运动<br>• 束缚激子：被杂质或缺陷束缚→能量更低</p>
<p><strong>激子的物理意义</strong>：<br>• 低温下主导带边光学性质<br>• 量子阱中激子结合能增大（受限增强库仑作用）<br>• 是量子点发光的物理基础</p>
<div class="tip"><strong>考研常考</strong>：激子吸收峰位于E_g以下E_ex处。计算激子结合能需要m_r和ε_r。低温才能观察到激子峰（kT需< E_ex）。</div>`},
{n:"光致发光与阴极荧光",s:"★★★★☆",body:`<p><strong>光致发光（PL）</strong>：激光/单色光激发半导体→产生非平衡载流子→复合→发射光。</p>
<div class="formula-box">PL光谱分析：<br>峰位置→带隙/缺陷能级信息<br>峰宽度→温度/掺杂/合金均匀性<br>峰强度→辐射复合效率<br>峰位移→组分/应变变化<br><br>PL谱的常见峰：<br>• FE：自由激子<br>• BE：束缚激子<br>• D-A：施主-受主对<br>• Defect：缺陷相关</div>
<p><strong>阴极荧光（CL）</strong>：用聚焦电子束（SEM）激发→空间分辨率极高的发光成像。</p>
<div class="formula-box">CL分辨率：~10-100 nm（远优于PL的~μm级）<br>可用于：缺陷成像、量子点分布、位错网络</div>
<p><strong>PL测量的应用</strong>：<br>• 组分测定：峰位→带隙→In/Ga/Al组分<br>• 质量控制：FWHM越窄质量越好<br>• 量子阱子能级：多峰对应多个子能带跃迁<br>• 缺陷分析：缺陷峰位置→缺陷类型</p>`},
{n:"半导体激光器的增益与阈值条件",s:"★★★★★",exam:1,body:`<p><strong>光增益</strong>：受激辐射产生的光子数大于吸收消耗的光子数→光放大。</p>
<div class="formula-box">增益系数：<br>g(hν) = (πq²)/(n_r·c·ε₀m₀²ω)·|M|²·ρ_r(hν)·(f_c - f_v)<br><br>关键条件（粒子数反转）：<br>f_c(E₂) > f_v(E₁)<br>即：导带态的占据概率 > 价带态<br><br>阈值条件：<br>α_m + α_i = Γ·g_th<br>α_m = 镜面损耗 = (1/L)·ln(1/R)<br>α_i = 内部损耗<br>Γ = 光场限制因子</div>
<p><strong>阈值电流密度</strong>：</p>
<div class="formula-box">J_th = J₀ + (α_m + α_i)/(Γ·a)<br>a = 微分增益系数<br><br>GaAs DH激光器：J_th ~ 1-3 kA/cm²<br>GaAs QW激光器：J_th ~ 100-500 A/cm²<br>GaN激光器：J_th ~ 1-5 kA/cm²</div>
<p><strong>提高增益的方法</strong>：<br>• 量子阱→态密度集中→增益增强<br>• 应变量子阱→m*_h减小→反转更容易<br>• 多量子阱→增大Γ<br>• 量子点→零维态密度→阈值极低</p>
<div class="warn"><strong>易错</strong>：粒子数反转≠n_e > n_h。正确条件是：导带态占据概率f_c > 价带态占据概率f_v。对于重掺杂简并半导体，即使n_e < n_h也能实现反转。</div>`},
{n:"LED效率的详细分析",s:"★★★★★",exam:1,body:`<p><strong>LED效率的三个层次</strong>：</p>
<div class="formula-box">内量子效率（IQE）：<br>η_i = R_rad/(R_rad + R_nr)<br>R_rad = 辐射复合率<br>R_nr = 非辐射复合率<br><br>提取效率（EE）：<br>η_ext = 光子逃逸概率<br>~ 1/(4n²)（全内反射限制）<br>n_r(Si)=3.5 → η_ext ~ 2%（未处理）<br><br>外量子效率（EQE）：<br>η_ext = η_i × η_extract × η_injection</div>
<p><strong>影响IQE的因素</strong>：</p>
<div class="formula-box">直接带隙（GaAs, GaN）：<br>η_i ~ 50-90%（高质量）<br><br>间接带隙（Si, Ge, GaP）：<br>η_i ~ 0.01-1%<br>（声子参与→辐射复合概率极低）<br><br>SRH复合：η_i随注入增大先升后降<br>俄歇复合：大注入时η_i急剧下降</div>
<p><strong>提高提取效率的方法</strong>：<br>• 表面粗化（破坏全内反射）<br>• 倒装芯片结构<br>• 光子晶体<br>• 透明衬底（去除吸收衬底）<br>• Bragg反射镜</p>
<div class="tip"><strong>数据</strong>：GaN基白光LED的EQE已达~80%，其中IQE ~ 90%，提取效率 ~ 90%。</div>`},
{n:"半导体中的载流子弛豫过程",s:"★★★★☆",body:`<p><strong>弛豫过程</strong>：载流子被激发到高能态后，通过各种散射过程回到平衡态的过程。</p>
<p><strong>时间尺度层级</strong>：</p>
<div class="formula-box">1. 载流子-载流子散射（热化）<br>τ_e-e ~ 10-100 fs → 费米-狄拉克分布<br><br>2. 载流子-声子散射（冷却到晶格温度）<br>τ_e-ph ~ 0.1-10 ps → 与晶格热平衡<br><br>3. 辐射/非辐射复合<br>τ_rad ~ ns（直接带隙）<br>τ_nr ~ μs（间接带隙）<br><br>4. 扩散/漂移<br>τ_diff ~ L²/D ~ ns-μs</div>
<p><strong>超快光谱技术</strong>：泵浦-探测实验可以直接测量这些弛豫过程。</p>
<div class="formula-box">泵浦脉冲→激发载流子<br>探测脉冲→监测吸收/反射变化<br>时间分辨率：<br>• 飞秒激光 → τ_e-e, τ_e-ph<br>• 皮秒激光 → τ_rad<br>• 超快PL → 辐射复合动力学</div>
<div class="tip"><strong>物理图像</strong>：载流子先"热化"（内部平衡→费米分布）→"冷却"（能量传递给声子→晶格温度）→"复合"（回到价带→消失）。三个过程时间尺度相差几个数量级。</div>`},
{n:"霍尔效应的详细计算与应用",s:"★★★★★",exam:1,body:`<p><strong>霍尔效应完整推导</strong>：</p>
<div class="formula-box">设N型半导体，电场E_x，磁场B_z<br><br>平衡条件（洛伦兹力=电场力）：<br>qE_y = qv_dB_z<br>E_y = v_d·B_z = (μE_x)·B_z<br><br>霍尔系数：R_H = E_y/(J_x·B_z)<br>= 1/(qn)（N型）<br>= -1/(qp)（P型）<br><br>霍尔角：tan(θ_H) = μ·B_z<br><br>霍尔迁移率：μ_H = |R_H|·σ = |R_H|/ρ</div>
<p><strong>例题</strong>：Si样品，N_D=10¹⁶cm⁻³，μ_n=1400cm²/(V·s)，B=1kG=0.1T</p>
<div class="formula-box">R_H = 1/(qn) = 1/(1.6×10⁻¹⁹×10¹⁶)<br>= 625 cm³/C<br><br>ρ = 1/(qnμ) = 1/(1.6×10⁻¹⁹×10¹⁶×1400)<br>= 0.446 Ω·cm<br><br>μ_H = |R_H|/ρ = 625/0.446 = 1400 cm²/(V·s)<br>（=漂移迁移率，因为只有单载流子）<br><br>θ_H = arctan(μB) = arctan(1400×0.1×10⁻⁴)<br>= arctan(0.014) ≈ 0.8°</div>
<div class="warn"><strong>易错</strong>：霍尔系数的符号决定导电类型（R_H>0→P型，R_H<0→N型）。霍尔迁移率与漂移迁移率不总相等（多载流子时有霍尔因子r_H）。</div>`},
{n:"霍尔系数的温度依赖性",s:"★★★★★",exam:1,body:`<p><strong>N型半导体R_H(T)的三段变化</strong>：</p>
<div class="formula-box">低温（冻结区）：<br>R_H = -r_H/(q·n)<br>n ↑ → |R_H| ↓<br><br>饱和区：<br>n ≈ N_D → R_H ≈ -r_H/(qN_D) = 常数<br><br>本征区：<br>n ≈ p ≈ n_i → R_H趋于0<br>且在本征区R_H符号反转（N型→R_H变正）</div>
<p><strong>ln|R_H| vs 1/T图</strong>：<br>• 冻结区：斜率与ΔE_d相关<br>• 饱和区：水平线（|R_H| = 1/(qN_D)）<br>• 本征区：快速下降→过零→反号</p>
<p><strong>霍尔因子r_H</strong>：</p>
<div class="formula-box">r_H = <τ²>/<τ>²<br><br>声学波散射：r_H = 3π/8 ≈ 1.18<br>电离杂质散射：r_H = 315π/512 ≈ 1.93<br>混合散射：1.18 < r_H < 1.93<br><br>通常取 r_H ≈ 1（简化计算）</div>
<div class="tip"><strong>考研重点</strong>：变温Hall实验是确定杂质浓度N_D、电离能ΔE_d和迁移率的最重要实验方法。需要会分析ln|R_H| vs 1/T图。</div>`},
{n:"量子霍尔效应",s:"★★★☆☆",body:`<p><strong>整数量子霍尔效应（IQHE）</strong>：1980年von Klitzing发现，强磁场+低温下，二维电子气的霍尔电阻量子化。</p>
<div class="formula-box">霍尔电阻量子化：<br>R_H = h/(νe²) = R_K/ν<br>ν = 1, 2, 3...（填充因子）<br>R_K = h/e² = 25812.807 Ω（冯·克利青常数）<br><br>朗道能级：<br>E_n = (n+1/2)ℏω_c<br>ω_c = eB/m*<br>朗道能级简并度：D = eB/h [cm⁻²]</div>
<p><strong>物理图像</strong>：<br>• 磁场→连续能带→离散朗道能级<br>• 费米能级落在朗道能级之间→纵向电阻为零<br>• 霍尔电阻精确量子化→与材料无关</p>
<p><strong>分数量子霍尔效应（FQHE）</strong>：</p>
<div class="formula-box">ν = 1/3, 2/5, 3/7...（分数填充因子）<br>R_H = h/(νe²) = ν⁻¹·(h/e²)<br><br>物理起源：电子-电子库仑相互作用<br>→ Laughlin波函数<br>→ 分数电荷准粒子（e/3, e/5）</div>
<div class="tip"><strong>意义</strong>：IQHE被用于电阻基准（R_K的精确值定义了电阻单位）。FQHE的发现揭示了凝聚态物理中全新的量子序（拓扑序）。</div>`},
{n:"非晶态半导体的能态模型",s:"★★★★☆",body:`<p><strong>CFO模型</strong>（Cohen-Fritzsche-Ovshinsky）：描述非晶态半导体的能态分布。</p>
<div class="formula-box">能态分布：<br>• 带边不再是锐利的，而是向禁带中延伸出带尾态<br>• 禁带中央有高密度的缺陷态（悬挂键等）<br>• 移动性边（mobility edge）E_c和E_v分隔扩展态和局域态<br><br>E > E_c：扩展态（可导电）<br>E_v < E < E_c：带尾局域态（跳跃导电）<br>禁带中央：缺陷态</div>
<p><strong>非晶Si的关键参数</strong>：</p>
<div class="formula-box">光学带隙 ~ 1.7-1.8 eV（大于晶态1.12eV）<br>带尾宽度 ~ 0.1-0.2 eV<br>缺陷态密度 ~ 10¹⁶-10¹⁸ cm⁻³eV⁻¹<br>迁移率（扩展态）~ 1-10 cm²/(V·s)<br>迁移率（跳跃态）~ 10⁻³ cm²/(V·s)</div>
<p><strong>非晶Si的导电机制</strong>：<br>• 高温：扩展态导电 → μ·n(E_c)<br>• 中温：带尾跳跃导电<br>• 低温：变程跳跃导电（VRH）→ σ ∝ exp(-(T₀/T)^(1/4))</p>
<div class="warn"><strong>易错</strong>：非晶Si的迁移率远低于晶态Si（10²倍以上），因为缺乏长程有序→布洛赫定理不适用→能带概念需修正为"扩展态/局域态"。</div>`},
{n:"Staebler-Wronski效应",s:"★★★☆☆",body:`<p><strong>S-W效应</strong>：非晶硅（a-Si:H）在长时间光照下光电导率和暗电导率持续降低的现象。</p>
<div class="formula-box">光照引起的缺陷产生：<br>ΔN_d ∝ G·t^(1/3)（t为光照时间）<br>光稳态：缺陷产生速率 = 暗退火速率<br><br>光强越大→缺陷密度越高→光电导降低越严重<br><br>退火恢复：T > 150°C加热可恢复</div>
<p><strong>物理机制</strong>（目前仍有争议）：<br>① 链断裂模型：光生载流子复合释放能量→打断Si-Si弱键→产生悬挂键缺陷<br>② 氢迁移模型：光激发使H从结合位脱出→H迁移→留下悬挂键</p>
<p><strong>对器件的影响</strong>：<br>• a-Si:H太阳能电池效率随使用时间降低<br>• 初始效率~10%→稳态效率~7%（S-W效应）<br>• 限制了a-Si:H光伏的长期稳定性</p>
<div class="tip"><strong>对策</strong>：使用μc-Si（微晶Si）或多结结构减少光照强度→减缓S-W效应。</div>`},
{n:"超晶格的微带与微隙",s:"★★★★☆",body:`<p><strong>超晶格能带结构</strong>：周期性多层结构产生新的周期势→形成微带（miniband）和微隙（minigap）。</p>
<div class="formula-box">微带宽度：<br>ΔE ∝ exp(-κd)<br>d = 势垒宽度<br>κ = 势垒中的衰减常数<br><br>微带中心间距：<br>δE = π²ℏ²/(2m*(a+b)²)<br>a+b = 超晶格周期</div>
<p><strong>超晶格的态密度</strong>：在每两个微带之间存在微隙（mini-gap），态密度在微带内为台阶函数。</p>
<p><strong>超晶格的输运特性</strong>：</p>
<div class="formula-box">Bloch振荡：<br>频率：f_B = qEB/(2πℏ) = eE(a+b)/(h)<br>E = 外加电场<br><br>负微分电导：<br>当E增大→布洛赫振荡周期缩短<br>电子来不及完成一个振荡周期就被散射<br>→有效漂移速度反而减小</div>
<div class="tip"><strong>应用</strong>：量子级联激光器（QCL）利用超晶格的子能级间跃迁实现中红外/太赫兹激光发射，是重要的红外光源。</div>`},
{n:"量子限制效应的定量分析",s:"★★★★★",body:`<p><strong>量子限制</strong>：当半导体的尺寸减小到与德布罗意波长或激子玻尔半径可比时，电子态发生量子化。</p>
<div class="formula-box">德布罗意波长：<br>λ_dB = h/p = h/√(2m*kT) ≈ 4.3nm (Si, 300K)<br>λ_dB(77K) ≈ 8.6nm<br><br>激子玻尔半径：<br>a_B = ε_r·a_0·m_0/m_r<br>Si: ~4nm<br>GaAs: ~13nm<br>CdSe: ~5.6nm</div>
<p><strong>量子限制条件</strong>：<br>• 量子阱：d < λ_dB → 2D量子化<br>• 量子线：d < λ_dB → 1D量子化<br>• 量子点：d < λ_dB → 0D量子化（完全量子化）</p>
<p><strong>量子点的能级</strong>（无限深球势阱）：</p>
<div class="formula-box">E_{n,l} = ℏ²χ²_{n,l}/(2m*R²)<br>χ_{n,l} = 第n个球贝塞尔函数的第l个零点<br><br>最低几个能级：<br>χ_{1,0} = π → E₁₀ = π²ℏ²/(2m*R²)<br>χ_{1,1} = 4.49 → E₁₁ = 4.49²ℏ²/(2m*R²)</div>
<div class="tip"><strong>应用</strong>：量子点的带隙随尺寸增大而减小→通过控制尺寸可调谐发光波长。这是量子点LED和量子点显示器的基础。</div>`},
{n:"宽禁带半导体：GaN与SiC",s:"★★★★★",exam:1,body:`<p><strong>宽禁带半导体</strong>（WBG）：E_g > 2eV，具有高击穿场、高热导率、耐高温等优异特性。</p>
<div class="formula-box">关键参数对比：<br><table class="cmp"><tr><th>参数</th><th>Si</th><th>GaAs</th><th>4H-SiC</th><th>GaN</th></tr><tr><td>E_g(eV)</td><td>1.12</td><td>1.42</td><td>3.26</td><td>3.4</td></tr><tr><td>E_c(MV/cm)</td><td>0.3</td><td>0.4</td><td>2.0</td><td>3.3</td></tr><tr><td>μ_e(cm²/Vs)</td><td>1400</td><td>8500</td><td>900</td><td>1000</td></tr><tr><td>κ(W/mK)</td><td>150</td><td>46</td><td>490</td><td>130</td></tr></table></div>
<p><strong>GaN基器件</strong>：<br>• 蓝光/白光LED（InGaN/GaN多量子阱有源层）<br>• 高功率微波（AlGaN/GaN HEMT）<br>• 高压开关（垂直GaN器件）</p>
<p><strong>SiC基器件</strong>：<br>• 高压整流器/IGBT替代<br>• 电动汽车功率模块<br>• 高温电子学（工作温度>300°C）</p>
<div class="formula-box">功率器件品质因数（Baliga FOM）：<br>FOM ∝ ε·μ·E_c³<br>GaN/Si ≈ 800<br>SiC/Si ≈ 130<br>→ GaN在功率电子中优势更大</div>
<div class="tip"><strong>记忆</strong>：宽禁带→高击穿→高压；高热导→高功率；直接带隙(GaN)→发光。GaN和SiC互补：GaN更适合高频+功率，SiC更适合高压+高温。</div>`},
{n:"自旋电子学基础",s:"★★★☆☆",body:`<p><strong>自旋电子学</strong>（Spintronics）：利用电子的自旋自由度（而非仅电荷）来处理信息。</p>
<div class="formula-box">自旋相关的物理量：<br>• 自旋极化率 P = (n↑ - n↓)/(n↑ + n↓)<br>• 半金属铁磁体（CrO₂, Fe₃O₄）：P = 100%<br>• 铁金属（Fe, Co, Ni）：P = 30-50%</div>
<p><strong>核心效应</strong>：<br>① <strong>巨磁阻（GMR）</strong>：铁磁/非磁/铁磁多层结构中，磁化方向平行vs反平行时电阻显著不同。</p>
<div class="formula-box">GMR比值：<br>GMR = (R_anti - R_par)/R_par × 100%<br>可达 50-200%（室温）<br><br>应用：硬盘读取头、磁随机存储器（MRAM）</div>
<p>② <strong>自旋注入</strong>：将自旋极化电流从铁磁体注入半导体。</p>
<div class="formula-box">自旋注入效率：<br>η = P·(r_F/r_S - 1)/(r_F/r_S + 1)<br>r_F, r_S = 铁磁体/半导体电阻<br><br>电导率失配问题：r_F << r_S → η ≈ 0<br>解决方案：使用隧道势垒或半金属铁磁体</div>
<p>③ <strong>自旋霍尔效应</strong>：在有纵向电流的导体中，自旋-轨道耦合使自旋向上和向下电子偏转到样品两侧→产生自旋积累。</p>
<div class="tip"><strong>应用前景</strong>：自旋晶体管、自旋LED、拓扑绝缘体→未来低功耗信息处理。</div>`},
{n:"半导体中的载流子倍增效应",s:"★★★☆☆",body:`<p><strong>碰撞电离</strong>：高能载流子（能量>1.5E_g）与价带电子碰撞→产生新的电子-空穴对→载流子倍增。</p>
<div class="formula-box">碰撞电离阈值能量：<br>E_th ≥ E_g（理论最小值）<br>实际：E_th ≈ 1.5-2E_g（动量守恒要求）<br><br>Si: E_th ≈ 3.6 eV<br>GaAs: E_th ≈ 2.2 eV</div>
<p><strong>多激子产生（MEG）</strong>：在量子点中，一个高能光子可以产生多个激子（载流子倍增增强效应）。</p>
<div class="formula-box">MEG阈值：hν ≥ 2-3 E_g<br>量子点中MEG效率远高于体材料<br>（库仑相互作用增强+能级离散化）</div>
<p><strong>应用</strong>：<br>• APD（雪崩光电二极管）：利用碰撞电离实现内部增益<br>• 太阳能电池：利用MEG提高高能光子的利用效率<br>• HEMT击穿：碰撞电离是击穿的主要机制之一</p>
<div class="tip"><strong>与热载流子的关系</strong>：热载流子效应（热电子温度>晶格温度）是碰撞电离的前提条件。电场加热→载流子获得高能量→碰撞电离→倍增。</div>`}
],
