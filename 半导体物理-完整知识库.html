<script>
// ========== 章节数据 ==========
var chapters=[
// ===== 第1章 半导体中的电子状态 =====
{title:"第1章 半导体中的电子状态",subtitle:"晶体结构·能带理论·有效质量 — 全书理论基石",
 tags:[{t:"权重95%",c:"tag-weight"},{t:"★★★★★",c:"tag-stars"},{t:"核心基础",c:"tag-core"}],
 kps:[
{n:"晶体结构基础",s:"★★★★★",exam:1,body:`<p><strong>金刚石结构</strong>：Si和Ge采用金刚石结构，由两套面心立方（FCC）晶格沿体对角线偏移(1/4,1/4,1/4)a套构而成。配位数为4，每个原子与4个最近邻形成共价键，键角109°28'。</p>
<div class="formula-box">晶格常数：a(Si)=5.43Å, a(Ge)=5.66Å<br>最近邻距离：d=a√3/4<br>原子体密度：n=8/a³（金刚石结构每晶胞8个原子）</div>
<p><strong>闪锌矿结构</strong>：GaAs等III-V族化合物采用闪锌矿结构，与金刚石结构类似但由两种不同原子组成（Ga和As各占一套FCC子晶格）。III-V族的共价键含有部分离子键成分，电负性差越大离子性越强。</p>
<table class="cmp"><tr><th>特征</th><th>金刚石(Si/Ge)</th><th>闪锌矿(GaAs)</th><th>纤锌矿(GaN)</th></tr><tr><td>晶格类型</td><td>FCC套构</td><td>FCC套构</td><td>HCP套构</td></tr><tr><td>配位数</td><td>4</td><td>4</td><td>4</td></tr><tr><td>键型</td><td>纯共价键</td><td>共价+部分离子</td><td>共价+部分离子</td></tr><tr><td>对称性</td><td>Oh(立方)</td><td>Td(立方)</td><td>C6v(六方)</td></tr><tr><td>典型材料</td><td>Si,Ge,C</td><td>GaAs,InP,GaP</td><td>GaN,AlN,ZnO</td></tr></table>
<div class="tip"><strong>记忆口诀</strong>：金刚石=4配位+纯共价，闪锌矿=4配位+混合键，纤锌矿=六方版闪锌矿。</div>
<div class="warn"><strong>易错</strong>：金刚石结构的晶胞包含8个原子（不是4个），因为两套FCC各4个。闪锌矿结构没有对称中心（反演对称性缺失），这导致Ga面和As面性质不同（极性）。</div>`},
{n:"密勒指数与晶面晶向",s:"★★★★☆",body:`<p><strong>晶向指数[hkl]</strong>：取晶向上任意两点坐标差，约化为最小整数比。如体对角线方向为[111]，面对角线为[110]。等价晶向用尖括号表示：&lt;111&gt;包含8个方向。</p>
<p><strong>晶面指数(hkl)</strong>：取晶面在三个轴上截距的倒数，约化为最小整数。如(100)面截距为(∞,∞,a)，(111)面截距为(a,a,a)。等价晶面用圆括号族表示：{111}。</p>
<div class="formula-box">面间距公式（立方晶系）：<br>d(hkl) = a / √(h²+k²+l²)<br><br>例：Si(111)面间距 = 5.43/√3 = 3.14Å<br>Si(100)面间距 = 5.43/1 = 5.43Å</div>
<p><strong>重要晶面特征</strong>：Si的{111}面是密排面（面间距最大、面原子密度最高），化学腐蚀速率最慢，解理面。{100}面是MOS器件的首选晶面（界面态密度最低）。{110}面在MEMS中用于各向异性腐蚀。</p>
<div class="tip"><strong>考研重点</strong>：Si(100)面原子密度 &lt; Si(110)面 &lt; Si(111)面。MOS器件选(100)面是因为Si-SiO₂界面态密度最低（~10¹⁰cm⁻²eV⁻¹），而非因为原子密度。</div>`},
{n:"倒格子与布里渊区",s:"★★★★★",exam:1,body:`<p><strong>倒格子定义</strong>：正格子基矢a₁,a₂,a₃定义倒格子基矢：<br>b₁=2π(a₂×a₃)/Ω, b₂=2π(a₃×a₁)/Ω, b₃=2π(a₁×a₂)/Ω<br>其中Ω=a₁·(a₂×a₃)为正格子原胞体积。</p>
<div class="formula-box">FCC的倒格子是BCC（反之亦然）<br>FCC倒格子基矢长度：|b|=4π/a<br><br>第一布里渊区 = 倒格子空间中的Wigner-Seitz原胞</div>
<p><strong>FCC晶格的第一布里渊区</strong>：截角八面体，高对称点：</p>
<table class="cmp"><tr><th>符号</th><th>含义</th><th>坐标</th></tr><tr><td>Γ</td><td>布里渊区中心</td><td>(0,0,0)</td></tr><tr><td>X</td><td>正方形面心</td><td>(2π/a)(1,0,0)</td></tr><tr><td>L</td><td>六边形面心</td><td>(π/a)(1,1,1)</td></tr><tr><td>K</td><td>棱的中点</td><td>(3π/2a)(1,1,0)</td></tr></table>
<p><strong>简约布里渊区</strong>：将所有k空间的E(k)通过倒格矢G约化到第一布里渊区内。由于E(k)=E(k+G)，只需研究第一布里渊区内的色散关系即可获得全部信息。</p>
<div class="warn"><strong>易错</strong>：布里渊区的形状取决于晶体的布拉维格子类型（不是基矢类型）。FCC晶体的第一布里渊区是截角八面体，不是正方体。Si和GaAs同为FCC结构，布里渊区形状相同。</div>`},
{n:"布洛赫定理",s:"★★★★★",exam:1,body:`<p><strong>布洛赫定理</strong>：在周期性势场V(r)=V(r+R)中，电子波函数具有如下形式：</p>
<div class="formula-box">ψ_k(r) = u_k(r) · e^(ik·r)<br>其中 u_k(r) = u_k(r+R) 具有晶格周期性<br><br>物理意义：晶体中的电子波函数 = 平面波 × 周期函数</div>
<p><strong>证明思路</strong>：平移算符T̂_R与哈密顿量Ĥ对易（因为势能具有周期性），因此它们有共同本征函数。T̂_R的本征值为e^(ik·R)（由群论可得），代入即得布洛赫形式。</p>
<p><strong>重要推论</strong>：</p>
<p>① k是晶体动量（准动量），不是真实动量。真实动量算符p̂作用于布洛赫态后不再是本征态。</p>
<p>② k的取值由边界条件决定。Born-von Karman周期性边界条件：k=(n₁b₁+n₂b₂+n₃b₃)/N，N为原胞数。</p>
<p>③ 能量E(k)是k的周期函数，周期为倒格矢G。因此只需研究第一布里渊区内的E(k)关系。</p>
<div class="tip"><strong>考研高频</strong>：布洛赫定理的物理意义和证明思路是高频简答题。记住三个关键词：周期势场→平移算符→共同本征态→布洛赫形式。</div>
<div class="warn"><strong>易错</strong>：布洛赫定理并不给出能量本征值的具体形式，只约束波函数的形式。E(k)的具体关系还需要结合具体的势场模型（近自由电子或紧束缚）来求解。</div>`},
{n:"近自由电子模型与能带形成",s:"★★★★★",exam:1,body:`<p><strong>近自由电子模型</strong>：假设周期势场的起伏很小，电子近似为自由电子，势能作为微扰处理。</p>
<div class="formula-box">零级能量：E⁰(k) = ℏ²k²/2m₀（自由电子抛物线）<br><br>在布里渊区边界k=nπ/a处，简并微扰论给出：<br>E± = E⁰ ± |V_n|<br><br>能隙宽度：E_g = 2|V_n|<br>其中V_n为势能的第n个傅里叶分量</div>
<p><strong>能带形成的物理图像</strong>：当k接近布里渊区边界nπ/a时，前进波和反射波（布拉格反射）发生强烈干涉，形成驻波。两种驻波（电子云集中在原子间/原子核处）能量不同，产生能隙。</p>
<p><strong>能隙出现在k=nπ/a处</strong>（即布里渊区边界），且能隙宽度由相应傅里叶分量|V_n|决定。势场越强，能隙越宽。</p>
<div class="info"><strong>考研重点</strong>：近自由电子模型的三个关键结论——①能隙出现在BZ边界；②能隙宽度=2|V_n|；③BZ内部E(k)近似抛物线。这三个结论几乎每年都有相关考题。</div>`},
{n:"紧束缚模型",s:"★★★★☆",body:`<p><strong>紧束缚模型</strong>：从孤立原子的波函数出发，将晶体中相邻原子的波函数重叠视为微扰。</p>
<div class="formula-box">E(k) = ε₀ - α - 2γ·Σcos(k·δ_i)<br><br>ε₀：原子能级能量<br>α：重叠积分（负值，使能带下移）<br>γ：最近邻重叠积分（决定带宽）<br>δ_i：最近邻格矢</div>
<p><strong>与近自由电子模型的对比</strong>：近自由电子模型从自由电子出发（弱周期势），紧束缚模型从孤立原子出发（强原子势、弱重叠）。二者从不同极限出发，在中间区域给出定性一致的能带图像。</p>
<p><strong>带宽W与重叠积分的关系</strong>：对于简单立方，W=12|γ|。γ越大（原子间距越小），带越宽。当原子间距→∞时，γ→0，能带退化为孤立原子能级。</p>
<div class="tip"><strong>物理图像</strong>：N个原子靠近形成晶体时，简并的原子能级展宽为包含N个能级的能带。能带内相邻能级间距极小（~10⁻²²eV），可视为准连续。能带最多容纳2N个电子（自旋简并）。</div>`},
{n:"Kronig-Penney模型",s:"★★★★★",exam:1,body:`<p><strong>一维K-P模型</strong>：将晶体势场简化为周期性方势阱（周期a），求解薛定谔方程得到色散关系：</p>
<div class="formula-box">cos(ka) = cos(αa) + P/(αa)·sin(αa)<br><br>α = √(2mE)/ℏ，P = mV₀b a/ℏ²<br>V₀：势阱深度，b：势阱宽度</div>
<p><strong>关键特征</strong>：</p>
<p>① 右端取值限制在[-1,+1]之间，超出此范围的E值无解——形成禁带。</p>
<p>② P越大（势场越强），能隙越宽。P→∞时退化为紧束缚极限。</p>
<p>③ P→0时退化为自由电子（无能隙）。</p>
<p>④ 在能带内部，群速度v_g=dE/dk≠0；在能带边界v_g=0（驻波）。</p>
<div class="formula-box">有效质量在能带底部（k≈0）：<br>m* = ℏ²/(d²E/dk²) > 0（电子型）<br><br>有效质量在能带顶部（k=±π/a）：<br>m* < 0（空穴型）</div>
<div class="warn"><strong>易错</strong>：K-P模型虽然是一维的，但它的结论（能隙出现在BZ边界、有效质量可正可负、带宽与势场强度的关系）对三维晶体同样定性成立。考试常要求画出cos(ka)与ka的关系图。</div>`},
{n:"能带论基础总结",s:"★★★★★",body:`<p><strong>能带论的三个层次</strong>：</p>
<p>① <strong>自由电子模型</strong>：完全忽略势场，E=ℏ²k²/2m₀，无能隙。仅适用于自由电子气。</p>
<p>② <strong>近自由电子模型</strong>：弱周期势微扰，在BZ边界打开能隙。适用于金属中的s、p电子。</p>
<p>③ <strong>紧束缚模型</strong>：强原子势+弱重叠，从原子能级演化出能带。适用于内层电子和宽禁带半导体。</p>
<div class="formula-box">能带的基本特征：<br>• 能带数目：无穷多（每个原子能级→一个能带）<br>• 每个能带包含N个能态（N=原胞数）<br>• 每个能带最多容纳2N个电子（自旋）<br>• 能带间可能存在禁带（能隙）<br>• 低能带全满，高能带全空——绝缘体/半导体</div>
<p><strong>导体/半导体/绝缘体的能带论解释</strong>：</p>
<p>• <strong>导体</strong>：最高占据带（导带）部分填充，存在空态供电子加速。</p>
<p>• <strong>半导体</strong>：最高满带（价带）与最低空带（导带）之间有小能隙（~1eV），热激发可使少量电子跃迁到导带。</p>
<p>• <strong>绝缘体</strong>：能隙很大（>4eV），热激发不足以产生显著的载流子。</p>
<div class="tip"><strong>考研核心</strong>：能带论解释固体导电性是简答题高频考点。关键是理解"满带不导电、部分填充带导电"的物理原因。</div>`},
{n:"Si、Ge、GaAs能带结构详解",s:"★★★★★",exam:1,body:`<p><strong>Si的能带结构</strong>：间接带隙半导体。导带极小值（能谷）位于&lt;100&gt;方向靠近X点处（约0.85×2π/a），共有6个等价能谷。</p>
<div class="formula-box">Si基本参数：<br>禁带宽度 Eg=1.12eV (300K)<br>导带极值位置：Δ轴，距Γ点约85%<br>价带顶：Γ点（布里渊区中心）<br>导带有效质量：ml*=0.98m₀, mt*=0.19m₀<br>价带有效质量：mh*=0.53m₀, mlh*=0.16m₀</div>
<p><strong>Ge的能带结构</strong>：间接带隙。导带极小值位于&lt;111&gt;方向的L点，共有4个等价能谷（8个半能谷）。价带顶也在Γ点。</p>
<div class="formula-box">Ge基本参数：<br>Eg=0.66eV (300K)<br>导带极值：L点<br>导带有效质量：ml*=1.64m₀, mt*=0.082m₀</div>
<p><strong>GaAs的能带结构</strong>：直接带隙半导体。导带极小值和价带极大值都在Γ点（k=0）。具有双能谷结构：Γ能谷（最低）和L能谷（高0.29eV）。</p>
<div class="formula-box">GaAs基本参数：<br>Eg=1.43eV (300K)<br>导带极值：Γ点（直接带隙）<br>导带有效质量：m*=0.067m₀（极小）<br>Γ-L能谷间距：ΔE≈0.29eV</div>
<table class="cmp"><tr><th>参数</th><th>Si</th><th>Ge</th><th>GaAs</th></tr><tr><td>禁带类型</td><td>间接</td><td>间接</td><td>直接</td></tr><tr><td>Eg(eV,300K)</td><td>1.12</td><td>0.66</td><td>1.43</td></tr><tr><td>导带谷位置</td><td>&lt;100&gt;Δ轴</td><td>L点</td><td>Γ点</td></tr><tr><td>等价能谷数</td><td>6</td><td>4(8个半)</td><td>1</td></tr><tr><td>m*</td><td>ml=0.98,mt=0.19</td><td>ml=1.64,mt=0.082</td><td>0.067</td></tr><tr><td>适合作</td><td>MOS器件</td><td>红外器件</td><td>光电器件/高频</td></tr></table>
<div class="warn"><strong>考研高频</strong>：Si/Ge/GaAs的能带参数对比是必考内容。GaAs直接带隙→高发光效率→LED/激光器；Si间接带隙→低发光效率→不宜做光源但适合MOS器件。</div>`},
{n:"有效质量",s:"★★★★★",exam:1,body:`<p><strong>定义</strong>：有效质量m*反映晶格势场对电子运动的等效影响，由能带曲率决定：</p>
<div class="formula-box">1/m* = (1/ℏ²)·d²E/dk²<br><br>物理含义：<br>• 能带底部（曲率大，凸形）：m*小，电子"轻"<br>• 能带顶部（曲率大，凹形）：m*<0，空穴行为<br>• 能带平坦处：m*很大，电子"重"</div>
<p><strong>有效质量张量</strong>：在三维情况下，有效质量是一个二阶张量：</p>
<div class="formula-box">(1/m*)ᵢⱼ = (1/ℏ²)·∂²E/∂kᵢ∂kⱼ<br><br>主轴化后：1/mₓ*=∂²E/ℏ²∂kx²<br><br>态密度有效质量（多能谷）：<br>md* = (ml·mt²)^(1/3)·Nv^(2/3)<br>Nv：等价能谷数</div>
<p><strong>电导率有效质量</strong>：在考虑多能谷贡献时：<br>m_c* = 3/(1/ml + 2/mt) （对6谷Si）</p>
<p><strong>有效质量的实验测量</strong>：回旋共振实验是最直接的方法。在磁场中电子做螺旋运动，共振频率ω_c=qB/m*，通过测量微波吸收峰确定m*。</p>
<div class="tip"><strong>物理图像</strong>：有效质量不是常数——它随k方向和大小变化。这就是为什么Si的导带有纵向(ml)和横向(mt)两个有效质量。态密度有效质量决定载流子浓度，电导率有效质量决定迁移率。</div>`},
{n:"空穴概念",s:"★★★★★",exam:1,body:`<p><strong>空穴定义</strong>：价带中缺少一个电子的状态等效为一个带正电荷+q、具有正有效质量的准粒子。</p>
<div class="formula-box">空穴的性质：<br>• 电荷：+q（正电荷）<br>• 有效质量：m*_h = -m*_e(价带顶) > 0<br>• 能量：从价带顶向下为正（E_h = -E_e）<br>• 速度：v_h = v_e（与缺失电子速度相同）<br>• 波矢：k_h = -k_e</div>
<p><strong>引入空穴的物理原因</strong>：价带接近满带，追踪N-1个电子的状态极其复杂。引入空穴概念后，只需追踪这一个"空位"的行为，大大简化了问题。</p>
<p><strong>空穴的运动方程</strong>：</p>
<div class="formula-box">ℏdk_h/dt = qE + qv_h×B（与电子形式相同）<br>m*_h·dv_h/dt = qE（忽略磁场）</div>
<p><strong>Si价带结构</strong>：价带顶在Γ点，由三条带组成：重空穴带(mh*=0.53m₀)、轻空穴带(mlh*=0.16m₀)和自旋-轨道分裂带(Δ=0.044eV)。</p>
<div class="warn"><strong>易错</strong>：空穴是准粒子，不是真实粒子。它描述的是价带中大量电子集体行为的等效。空穴的有效质量为正——因为价带顶E(k)是凹的，d²E/dk²<0，而m*_h=-m*_e使其为正。</div>`},
{n:"直接带隙与间接带隙",s:"★★★★★",exam:1,body:`<p><strong>直接跃迁</strong>：电子从价带顶到导带底的跃迁不需要声子参与，k值不变。直接带隙半导体（GaAs、InP、GaN）的光吸收/发光效率高。</p>
<p><strong>间接跃迁</strong>：导带底和价带顶不在k空间同一点，跃迁需要声子提供动量变化。间接带隙半导体（Si、Ge）的光学跃迁是二阶过程，概率远低于直接跃迁。</p>
<div class="formula-box">直接跃迁吸收条件：hν ≥ Eg<br>间接跃迁吸收条件：hν ≥ Eg ± ℏω_phonon<br><br>吸收系数：<br>直接：α ∝ (hν-Eg)^(1/2)<br>间接：α ∝ (hν-Eg±ℏω)²</div>
<p><strong>对器件的影响</strong>：</p>
<table class="cmp"><tr><th>性质</th><th>直接带隙(GaAs)</th><th>间接带隙(Si)</th></tr><tr><td>发光效率</td><td>高（辐射复合为主）</td><td>极低（非辐射为主）</td></tr><tr><td>光吸收</td><td>强，薄层即可</td><td>弱，需要厚吸收层</td></tr><tr><td>LED/激光器</td><td>✓ 首选材料</td><td>✗ 不适用</td></tr><tr><td>太阳能电池</td><td>高效</td><td>需要厚层但成熟</td></tr><tr><td>MOS器件</td><td>可用</td><td>✓ 首选材料</td></tr></table>
<div class="tip"><strong>考研必考</strong>：直接/间接带隙对光电器件的影响，几乎每年都会出题。核心逻辑：直接→无需声子→高跃迁概率→高效发光/吸收。</div>`},
{n:"费米能级的物理意义",s:"★★★★★",exam:1,body:`<p><strong>费米能级E_F</strong>：热平衡时电子系统的化学势，是统计物理中最重要的物理量之一。</p>
<div class="formula-box">三种等价定义：<br>① T=0K时，电子占据的最高能级<br>② 电子和空穴的化学势 μ=∂F/∂N<br>③ 电子占据概率为1/2的能级：f(E_F)=1/2</div>
<p><strong>费米能级的位置</strong>：</p>
<p>• <strong>本征半导体</strong>：E_F在禁带中央附近（精确位置由m*_n和m*_p决定）</p>
<p>• <strong>N型半导体</strong>：E_F偏向导带底（多数载流子为电子）</p>
<p>• <strong>P型半导体</strong>：E_F偏向价带顶（多数载流子为空穴）</p>
<p>• <strong>简并半导体</strong>：E_F进入导带或价带内部</p>
<div class="formula-box">本征费米能级精确位置：<br>Ei = Ec+Ev/2 + (3/4)kT·ln(m*_p/m*_n)<br><br>当m*_p=m*_n时，Ei恰好在禁带正中央</div>
<p><strong>费米能级的核心性质</strong>：</p>
<p>① 热平衡系统中，费米能级处处相等（这是判断平衡的条件）。</p>
<p>② E_F不随位置变化的条件：无外加电场、温度均匀、热平衡。</p>
<p>③ 非平衡时引入准费米能级（E_Fn和E_Fp），分别描述电子和空穴的分布。</p>
<div class="warn"><strong>考研高频</strong>：费米能级在能带图中的位置随掺杂和温度的变化规律，是选择题和简答题的常见考点。记住：N型E_F上移，P型E_F下移，高温回归本征位置。</div>`},
{n:"半导体材料参数对比",s:"★★★★☆",body:`<p>以下是考研常考的半导体材料关键参数对比：</p>
<table class="cmp"><tr><th>参数</th><th>Si</th><th>Ge</th><th>GaAs</th><th>GaN</th><th>SiC(4H)</th></tr><tr><td>Eg(eV,300K)</td><td>1.12</td><td>0.66</td><td>1.43</td><td>3.4</td><td>3.26</td></tr><tr><td>带隙类型</td><td>间接</td><td>间接</td><td>直接</td><td>直接</td><td>间接</td></tr><tr><td>ni(cm⁻³,300K)</td><td>1.5×10¹⁰</td><td>2.4×10¹³</td><td>1.8×10⁶</td><td>1.9×10⁻¹⁰</td><td>5×10⁻⁹</td></tr><tr><td>μn(cm²/Vs)</td><td>1350</td><td>3900</td><td>8500</td><td>1000</td><td>700</td></tr><tr><td>μp(cm²/Vs)</td><td>480</td><td>1900</td><td>400</td><td>350</td><td>115</td></tr><tr><td>εr</td><td>11.8</td><td>16.0</td><td>13.1</td><td>9.0</td><td>9.7</td></tr><tr><td>Ec(kV/cm)</td><td>300</td><td>200</td><td>400</td><td>3000</td><td>2200</td></tr><tr><td>热导率</td><td>1.5</td><td>0.6</td><td>0.46</td><td>1.3</td><td>3.7</td></tr></table>
<div class="tip"><strong>记忆要点</strong>：GaAs电子迁移率最高→高频器件；GaN/SiC击穿场强最大→功率器件；Si工艺最成熟→主流MOS器件；Ge的ni最大→高温漏电大。</div>`},
{n:"能带弯曲与内建电场",s:"★★★★☆",body:`<p><strong>能带弯曲的物理意义</strong>：当半导体中存在电场E时，电子的势能-qV(x)随位置变化，导致能带发生弯曲。</p>
<div class="formula-box">能带弯曲与电场的关系：<br>E(x) = E₀ - qV(x)<br>dE/dx = -qE（电场方向与能带倾斜方向相反）<br><br>能带向上弯 → 电子势能增加 → 电场方向指向x正方向<br>能带向下弯 → 电子势能降低 → 电场方向指向x负方向</div>
<p><strong>平衡态能带特征</strong>：</p>
<p>① 费米能级水平（处处相等），这是热平衡条件。</p>
<p>② 导带底Ec和价带顶Ev平行弯曲（禁带宽度不变）。</p>
<p>③ 能带弯曲的斜率正比于电场强度。</p>
<p><strong>掺杂对能带的影响</strong>：</p>
<p>N型区域：E_F靠近Ec，能带相对"平坦"</p>
<p>P型区域：E_F靠近Ev，能带相对"平坦"</p>
<p>N-P结界面：能带连续弯曲形成势垒</p>
<div class="warn"><strong>易错</strong>：能带图画的是电子能量。电子从低处到高处需要吸收能量，这与势能的概念正好相反（电子带负电）。所以"能带向上弯"意味着电子势能增大、电子倾向于向低处（能带平坦处）运动。</div>`},
{n:"布里渊区的构造方法",s:"★★★★☆",exam:1,body:`<p><strong>第一布里渊区构造</strong>：在倒空间中，从一个倒格点出发，做所有倒格矢的垂直平分面（布拉格面），这些面所围成的最小封闭区域即为第一布里渊区。</p>
<div class="formula-box">构造步骤：<br>1. 确定倒格子基矢b₁,b₂,b₃<br>2. 找出最近邻倒格点（FCC正格子→BCC倒格子）<br>3. 做这些倒格矢的中垂面<br>4. 围成的最小封闭区域=BZ</div>
<p><strong>FCC的BZ</strong>（对应Si/Ge等金刚石结构）：截角八面体（truncated octahedron），由14个面组成（8个六边形+4个正方形）。对称点：Γ(中心)、X(面心)、L(六边形中心)、K(棱中点)。</p>
<p><strong>BCC的BZ</strong>（对应GaAs等闪锌矿结构的倒格子）：正十二面体（regular dodecahedron），12个五边形面。</p>
<div class="tip"><strong>记忆</strong>：BZ的对称性与正格子相同。正格子→倒格子→BZ构造，关键是"垂直平分面取最小封闭区域"。</div>
<div class="warn"><strong>易错</strong>：BZ边界恰好满足布拉格反射条件2k·G=|G|²，因此BZ边界处电子波函数发生强烈衍射，形成能隙（禁带）。</div>`},
{n:"能带的形成机制",s:"★★★★★",body:`<p><strong>从原子能级到能带</strong>：孤立原子的分立能级在晶体中由于原子间相互作用而展宽为能带。</p>
<p><strong>形成过程</strong>：<br>1. N个孤立原子→N个分立能级<br>2. 原子靠近→波函数重叠→能级劈裂<br>3. N个原子→每个能级劈裂为N个紧密排列的能级→能带<br>4. 原子间距继续减小→能带展宽→相邻能带可能重叠</p>
<p><strong>关键参数</strong>：<br>• 重叠积分S：波函数重叠越大，能带越宽<br>• 交换积分J：决定能带宽度，J∝exp(-R/a₀)<br>• W=4|J|：能带宽度，R增大→W指数减小</p>
<p><strong>能隙与能带</strong>：<br>• 带内：准连续的能级，形成允许带<br>• 带间：禁带（能隙），不存在电子态<br>• 禁带宽度取决于原子势场的周期性调制强度</p>
<div class="tip"><strong>物理图像</strong>：外层电子（如3p→导带）波函数展宽大→能带宽；内层电子（如1s→芯能级）波函数局域→几乎不变。所以只有最外层电子参与导电。</div>`},
{n:"Si的能带结构详解",s:"★★★★★",exam:1,body:`<p><strong>Si能带结构关键特征</strong>：</p>
<p>① <strong>间接带隙</strong>：导带底（CBM）在&lt;100&gt;方向（Δ轴），价带顶（VBM）在Γ点，E_g=1.12eV(300K)。</p>
<p>② <strong>6个等价能谷</strong>：导带底沿6个&lt;100&gt;方向分布，距Γ点约0.85×(2π/a)。每个能谷的等能面为旋转椭球体。</p>
<div class="formula-box">能谷参数：<br>纵向有效质量 m*_l = 0.98m₀（沿能谷长轴）<br>横向有效质量 m*_t = 0.19m₀（垂直能谷长轴）<br>态密度有效质量 m*_dn = 1.08m₀<br>= (6)^(2/3) × (m*_l × m*_t²)^(1/3)</div>
<p>③ <strong>价带结构</strong>：Γ点处三个价带简并（重空穴带HH、轻空穴带LH、自旋轨道劈裂带SO）：</p>
<div class="formula-box">重空穴 m*_hh = 0.49m₀<br>轻空穴 m*_lh = 0.16m₀<br>自旋轨道劈裂 Δ_SO = 0.044eV<br>态密度有效质量 m*_dp = 0.81m₀</div>
<p>④ <strong>间接跃迁</strong>：光吸收需要声子参与以满足动量守恒，因此Si的光吸收系数在带边附近较小，不发光。</p>
<div class="warn"><strong>易错</strong>：Si有6个等价能谷≠6个导带底。正确说法是"导带底有6个等价的极小值点"。计算态密度有效质量时必须乘以6（简并度g_v=6）。</div>`},
{n:"GaAs的能带结构详解",s:"★★★★★",exam:1,body:`<p><strong>GaAs能带结构关键特征</strong>：</p>
<p>① <strong>直接带隙</strong>：CBM和VBM都在Γ点，E_g=1.42eV(300K)。光吸收/发光效率极高。</p>
<p>② <strong>Γ能谷</strong>：导带最小值在Γ点（k=0），有效质量极小 m*_Γ = 0.067m₀。</p>
<div class="formula-box">Γ能谷态密度有效质量：m*_d = 0.067m₀<br>（各向同性，非椭球）<br>价带重空穴 m*_hh = 0.51m₀<br>轻空穴 m*_lh = 0.082m₀<br>自旋轨道劈裂 Δ = 0.341eV</div>
<p>③ <strong>多能谷结构</strong>（双能谷模型）：<br>• L能谷：沿&lt;111&gt;方向，能量比Γ高0.29eV<br>• X能谷：沿&lt;100&gt;方向，能量比Γ高0.48eV</p>
<p>④ <strong>Gunn效应</strong>：当电场足够强时，电子从Γ能谷（高迁移率、小m*）转移到L/X能谷（低迁移率、大m*），导致负微分电导→微波振荡。</p>
<div class="formula-box">Γ能谷迁移率：μ_Γ ≈ 8500 cm²/(V·s)<br>L能谷迁移率：μ_L ≈ 920 cm²/(V·s)<br>转移阈值电场：E_th ≈ 3.2 kV/cm</div>
<div class="tip"><strong>对比记忆</strong>：Si=间接带隙+高迁移率电子（但多能谷散射补偿）→适合CMOS；GaAs=直接带隙+极高迁移率→适合高频+光电器件。</div>`},
{n:"Ge的能带结构",s:"★★★★☆",body:`<p><strong>Ge能带结构特征</strong>：</p>
<p>① <strong>间接带隙</strong>：CBM在L点（&lt;111&gt;方向Brillouin区边界），VBM在Γ点，E_g=0.66eV(300K)。</p>
<p>② <strong>4个等价能谷</strong>：L点有4个等价极小值（考虑自旋简并后g_v=8，但因L点在BZ边界，有效简并度需折半→有效g_v=4）。</p>
<div class="formula-box">Ge的能谷参数：<br>L能谷纵向 m*_l = 1.59m₀<br>横向 m*_t = 0.082m₀<br>态密度 m*_dn = 0.56m₀<br><br>价带：<br>重空穴 m*_hh = 0.33m₀<br>轻空穴 m*_lh = 0.043m₀<br>自旋轨道劈裂 Δ = 0.29eV</div>
<p>③ <strong>特殊性</strong>：Ge的自旋轨道劈裂Δ(0.29eV)远大于Si(0.044eV)，导致SO带顶部与HH/LH带分离明显。这影响了Ge的光学性质（SO带的带间跃迁）。</p>
<div class="tip"><strong>Si vs Ge vs GaAs</strong>：带隙1.12 vs 0.66 vs 1.42eV；间接/间接/直接；电子迁移率1400/3900/8500 cm²/(V·s)。Ge的窄带隙→红外探测；GaAs的直接带隙→激光/LED。</div>`},
{n:"有效质量的实验测量",s:"★★★★☆",body:`<p><strong>测量有效质量的方法</strong>：</p>
<p>① <strong>回旋共振</strong>：最直接的方法。将半导体置于强磁场B中，加微波场。当微波频率ω等于回旋频率ω_c时发生共振吸收。</p>
<div class="formula-box">回旋频率：ω_c = qB/m*<br>m* = qB/ω_c = qB/(2πf)<br>条件：ω_cτ >> 1（需低温+高迁移率样品）<br>Si中测得：m*_l=0.98m₀, m*_t=0.19m₀</div>
<p>② <strong>Shubnikov-de Haas振荡</strong>：低温强磁场下，磁阻随1/B周期性振荡，振荡周期与费米面极值截面积成反比。</p>
<div class="formula-box">Δ(1/B) = 2πe/(ℏA_ext)<br>A_ext为费米面在k⊥平面上的极值截面积</div>
<p>③ <strong>Cyclotron Resonance Mass</strong>：回旋共振给出的是回旋有效质量m*_c = (m*_l × m*_t²)^(1/3)（对椭球等能面）。</p>
<p>④ <strong>光学方法</strong>：Faraday旋转、磁光吸收等利用k空间跃迁和选择定则测量有效质量。</p>
<div class="warn"><strong>易错</strong>：回旋共振测量的是回旋质量（几何平均），而非单个方向的有效质量。需要旋转样品多次测量才能提取m*_l和m*_t。</div>`},
{n:"态密度有效质量与电导率有效质量",s:"★★★★★",exam:1,body:`<p><strong>三种有效质量</strong>：</p>
<p>① <strong>态密度有效质量m*_d</strong>：用于计算状态密度函数g(E)，影响载流子浓度。</p>
<div class="formula-box">单能谷（各向同性）：m*_d = m*<br>多能谷（各向异性）：<br>m*_dn = g_v^(2/3) × (m*_l × m*_t²)^(1/3)<br>g_v = 能谷简并度<br><br>Si：m*_dn = 6^(2/3) × (0.98×0.19²)^(1/3) = 1.08m₀<br>GaAs：m*_d = 0.067m₀（单能谷各向同性）</div>
<p>② <strong>电导率有效质量m*_c</strong>：用于计算迁移率和电导率。</p>
<div class="formula-box">各向同性：m*_c = m*<br>多能谷（各向异性）：<br>1/m*_cn = (1/3)(1/m*_l + 2/m*_t)<br><br>Si：1/m*_cn = (1/3)(1/0.98 + 2/0.19)<br>→ m*_cn = 0.26m₀<br><br>GaAs：m*_c = 0.067m₀</div>
<p>③ <strong>回旋有效质量m*_cr</strong>：回旋共振测得。</p>
<div class="formula-box">m*_cr = (m*_l × m*_t²)^(1/3)<br>Si：m*_cr = (0.98×0.19²)^(1/3) = 0.35m₀</div>
<div class="warn"><strong>易错</strong>：Si的态密度质量(1.08m₀)远大于电导率质量(0.26m₀)，原因是多能谷结构——态密度需要所有能谷的贡献（乘以g_v^(2/3)），而电导率只需要加权平均。</div>`},
{n:"费米面与费米速度",s:"★★★★☆",body:`<p><strong>费米面</strong>：k空间中，E(k)=E_F的等能面。是理解金属和简并半导体电子性质的核心概念。</p>
<div class="formula-box">费米波矢（3D自由电子）：<br>k_F = (3π²n)^(1/3)<br><br>费米速度：<br>v_F = ℏk_F/m*<br><br>费米能量：<br>E_F = ℏ²k_F²/(2m*) = (ℏ²/2m*)(3π²n)^(2/3)</div>
<p><strong>金属的费米面</strong>：接近自由电子→球形；但在BZ边界处发生畸变（布拉格反射→费米面与BZ面相交处出现能隙）。</p>
<p><strong>半导体的费米面</strong>：非简并半导体→费米面在禁带中（无实际意义）；简并半导体→费米面进入导带/价带（类似金属行为）。</p>
<p><strong>Si的费米面</strong>：由于6个椭球等能面，费米面由6个独立的椭球面组成（非连通），这是多能谷半导体的典型特征。</p>
<div class="tip"><strong>物理意义</strong>：费米面上的电子是对输运性质贡献最大的电子（只有费米面附近的电子才能被电场激发到空态），因此输运性质主要由费米面的形状和曲率决定。</div>`},
{n:"能谷间散射",s:"★★★☆☆",body:`<p><strong>能谷间散射</strong>：电子从一个能谷散射到另一个等价能谷的过程。在多能谷半导体中是重要的散射机制。</p>
<p><strong>发生条件</strong>：需要吸收或发射一个大动量声子（因为不同能谷在k空间相距较远），所以能谷间散射需要：<br>• 吸收/发射短波声子（q ≈ 能谷间距）<br>• 或经过多个小动量散射的级联过程</p>
<div class="formula-box">能谷间散射率：<br>1/τ_iv ∝ T（高温极限）<br><br>低温时：声子冻结→散射率急剧下降<br>高温时：与声学波散射竞争<br><br>Si中：能谷间距≈0.8×2π/a<br>需要TA或LA声子（大动量）</div>
<p><strong>对迁移率的影响</strong>：能谷间散射在高温下成为限制迁移率的主要因素之一。这也是Si在高温下迁移率下降比低温更快的原因。</p>
<div class="tip"><strong>对比</strong>：能谷内散射（小q声子）→迁移率∝T^(-3/2)（声学波）；能谷间散射（大q声子）→额外的T依赖性，使高温迁移率下降更快。</div>`},
{n:"半导体中的杂质扩散机制",s:"★★★★☆",body:`<p><strong>杂质扩散</strong>：半导体工艺中，杂质原子在高温下通过热运动在晶格中迁移。</p>
<p><strong>扩散机制</strong>：</p>
<p>① <strong>替位扩散</strong>（空位机制）：杂质原子与邻近空位交换位置。需要空位，激活能大。</p>
<div class="formula-box">扩散系数：D = D₀exp(-E_a/kT)<br><br>替位扩散参数（Si中）：<br>P: D₀≈10.5cm²/s, E_a≈3.69eV<br>B: D₀≈10.5cm²/s, E_a≈3.46eV<br>As: D₀≈24cm²/s, E_a≈4.05eV</div>
<p>② <strong>间隙扩散</strong>：杂质原子在晶格间隙中迁移。间隙小→迁移快→D₀小、E_a小。快扩散杂质：Au、Cu、Fe。</p>
<p><strong>扩散分布</strong>：<br>• 恒定源扩散（预沉积）：余误差分布 N(x,t)=N₀·erfc(x/2√Dt)<br>• 有限源扩散（推进）：高斯分布 N(x,t)=Q/√(πDt)·exp(-x²/4Dt)</p>
<div class="warn"><strong>易错</strong>：扩散系数D强烈依赖温度——温度升高100°C，D可增大100-1000倍。所以扩散工艺需要精确控温。</div>`}
],

{title:"第2章 杂质和缺陷能级",subtitle:"施主/受主·深能级·缺陷·补偿 — 控制导电性的关键",
 tags:[{t:"权重90%",c:"tag-weight"},{t:"★★★★★",c:"tag-stars"},{t:"核心基础",c:"tag-core"}],
 kps:[
{n:"施主杂质与受主杂质",s:"★★★★★",exam:1,body:`<p><strong>施主杂质（Donor）</strong>：能提供电子的杂质。在Si中掺入V族元素（P、As、Sb），多余的1个电子被弱束缚在杂质离子周围，电离能很小（~0.045eV），室温下即可电离，向导带释放电子。</p>
<div class="formula-box">施主电离能（类氢模型）：<br>E_d = (m*_n/m₀)·(1/εr²)·13.6eV<br>Si中P：Ed≈0.045eV<br>Si中As：Ed≈0.054eV<br>Si中Sb：Ed≈0.039eV</div>
<p><strong>受主杂质（Acceptor）</strong>：能接受电子（即提供空穴）的杂质。在Si中掺入III族元素（B、Al、Ga），缺少1个电子形成空穴，电离后向价带释放空穴。</p>
<div class="formula-box">受主电离能：<br>Ea(Si中B)≈0.045eV<br>Ea(Si中Al)≈0.067eV<br>Ea(Si中Ga)≈0.072eV</div>
<div class="tip"><strong>记忆方法</strong>：V族多1个电子→施主（给电子）→N型；III族少1个电子→受主（收电子）→P型。电离能很小（~kT=0.026eV量级），室温下杂质全部电离。</div>
<div class="warn"><strong>易错</strong>：施主电离后带正电（失去电子），受主电离后带负电（得到电子）。"施主"施的是电子不是正电荷。</div>`},
{n:"类氢模型与浅能级计算",s:"★★★★★",exam:1,body:`<p><strong>类氢模型</strong>：将杂质原子类比为氢原子，多余电子在库仑势中运动。用有效质量m*替代自由电子质量m₀，用介电常数ε替代真空介电常数ε₀。</p>
<div class="formula-box">氢原子基态能量：E_H = -13.6eV<br>类氢杂质电离能：<br>E_d = (m*_n/m₀)·(1/εr²)·13.6eV<br><br>等效玻尔半径：<br>a*_B = (m₀/m*_n)·εr·a_B<br>a_B = 0.529Å（氢原子玻尔半径）</div>
<p><strong>Si中施主电离能的计算</strong>：用态密度有效质量md*=(ml·mt²)^(1/3)=(0.98×0.19²)^(1/3)=0.33m₀，εr=11.8</p>
<div class="formula-box">E_d = 0.33/(11.8²)×13.6 = 0.032eV<br>实测值~0.045eV（与计算值相近但有差异，因为忽略了 central cell correction）</div>
<p><strong>为什么是浅能级</strong>：m*比m₀小很多（~0.3倍），εr很大（~12倍），所以E_d比氢原子小~1000倍（从13.6eV到~0.01eV量级）。轨道半径很大（~几十Å），波函数扩展到很多个晶格常数范围。</p>
<div class="info"><strong>考研计算</strong>：类氢模型计算浅能级电离能是经典计算题。记住公式E_d=13.6×(m*/m₀)/εr²，代入材料参数即可。</div>`},
{n:"深能级杂质",s:"★★★★★",body:`<p><strong>深能级杂质</strong>：电离能远大于kT的杂质能级，通常位于禁带中央附近。与浅能级不同，深能级杂质的波函数局域在杂质原子附近（几个晶格常数内），不能用类氢模型描述。</p>
<p><strong>重要深能级杂质</strong>：</p>
<table class="cmp"><tr><th>杂质</th><th>材料</th><th>能级位置</th><th>类型</th><th>特点</th></tr><tr><td>Au</td><td>Si</td><td>Ec-0.54eV</td><td>受主</td><td>高效复合中心</td></tr><tr><td>Au</td><td>Si</td><td>Ev+0.35eV</td><td>施主</td><td>双性杂质</td></tr><tr><td>Fe</td><td>Si</td><td>Ec-0.55eV</td><td>深施主</td><td>过渡金属</td></tr><tr><td>Cu</td><td>Si</td><td>Ev+0.24eV</td><td>深受主</td><td>快扩散杂质</td></tr><tr><td>EL2</td><td>GaAs</td><td>Ec-0.82eV</td><td>深施主</td><td>原生缺陷（As反位）</td></tr><tr><td>Cr</td><td>GaAs</td><td>Ev+0.87eV</td><td>补偿</td><td>半绝缘GaAs</td></tr></table>
<p><strong>深能级的作用</strong>：</p>
<p>① <strong>复合中心</strong>：Au在Si中是最有效的复合中心，用于降低少子寿命（开关器件需要快速复合）。</p>
<p>② <strong>补偿掺杂</strong>：深能级杂质可补偿浅能级杂质，提高电阻率。Cr掺入GaAs制备半绝缘衬底。</p>
<p>③ <strong>陷阱</strong>：深能级可捕获载流子并在特定条件下释放，影响器件的瞬态响应。</p>
<div class="warn"><strong>注意</strong>：Au在Si中有两个能级（双性杂质），既能做施主也能做受主。这是考研常考的陷阱题。</div>`},
{n:"杂质补偿效应",s:"★★★★★",exam:1,body:`<p><strong>杂质补偿</strong>：当半导体中同时存在施主和受主杂质时，它们的效应会相互抵消。</p>
<div class="formula-box">补偿后的载流子浓度：<br>若 N_D > N_A（施主多于受主）：<br>n ≈ N_D - N_A（完全电离时）<br>费米能级在Ec附近（N型）<br><br>若 N_A > N_D：<br>p ≈ N_A - N_D<br>费米能级在Ev附近（P型）</div>
<p><strong>补偿的物理图像</strong>：受主先"捕获"施主释放的电子（电子从导带落到受主能级），剩余的施主再电离提供载流子。</p>
<p><strong>电中性条件</strong>：n + N_A⁻ = p + N_D⁺</p>
<p>完全电离时：N_D⁺≈N_D, N_A⁻≈N_A，所以n-p=N_D-N_A。</p>
<div class="formula-box">本征半导体中：n=p=ni<br>补偿半导体中：n·p=ni²（仍然成立！）<br><br>若N_D>N_A>>ni：<br>n≈N_D-N_A, p=ni²/(N_D-N_A)</div>
<div class="tip"><strong>考研高频</strong>：补偿掺杂的计算是必考内容。关键公式：n·p=ni²始终成立（热平衡条件）。补偿后的净掺杂浓度为|N_D-N_A|。</div>
<div class="warn"><strong>易错</strong>：即使N_D和N_A都很大，只要N_D≈N_A（高度补偿），净载流子浓度可以很低。这在工艺中经常遇到（多次掺杂导致补偿）。</div>`},
{n:"替位式杂质与间隙式杂质",s:"★★★★☆",body:`<p><strong>替位式杂质</strong>：占据晶格原子位置的杂质。要求杂质原子大小与基质原子相近（原子半径差<15%）。Si中的III族和V族杂质都是替位式的。</p>
<p><strong>间隙式杂质</strong>：存在于晶格间隙位置的杂质。要求杂质原子较小。Si中的O（氧）和C（碳）是典型的间隙杂质。</p>
<table class="cmp"><tr><th>类型</th><th>特征</th><th>典型杂质</th><th>扩散方式</th></tr><tr><td>替位式</td><td>与基质原子大小相近</td><td>P,B,As,Ga,Al</td><td>空位扩散（慢）</td></tr><tr><td>间隙式</td><td>原子较小</td><td>O,C,Li,Cu,Fe</td><td>间隙扩散（快）</td></tr></table>
<p><strong>扩散系数差异</strong>：间隙杂质的扩散系数远大于替位杂质（可差10⁴~10⁶倍），因为间隙扩散不需要等待空位形成。这就是为什么Cu、Fe等重金属杂质在Si中扩散极快，是工艺中必须严格控制的污染源。</p>
<p><strong>间隙氧在Si中的作用</strong>：</p>
<p>① 氧浓度~10¹⁸cm⁻³（CZ法直拉硅），大部分以间隙形式存在。</p>
<p>② 退火后氧可形成SiO₂沉淀，产生内吸杂效应（gettering），清除金属杂质。</p>
<p>③ 氧也可能形成热施主（~300-500°C退火），产生额外的电子。</p>
<div class="tip"><strong>考研考点</strong>：替位/间隙杂质的区别常出现在选择题中，重点掌握扩散速率的差异及其原因。</div>`},
{n:"点缺陷",s:"★★★★★",body:`<p><strong>晶体缺陷分类</strong>：</p>
<p>① <strong>零维缺陷（点缺陷）</strong>：空位、间隙原子、替位杂质、反位缺陷</p>
<p>② <strong>一维缺陷（线缺陷）</strong>：位错（刃型位错、螺旋位错）</p>
<p>③ <strong>二维缺陷（面缺陷）</strong>：晶界、层错、表面</p>
<div class="formula-box">热平衡空位浓度：<br>n_v = N·exp(-E_v/kT)<br>E_v：空位形成能（Si中~2.6eV）<br>N：格点总数</div>
<p><strong>弗伦克尔缺陷</strong>：一个原子从格点移到间隙位置，同时产生一个空位和一个间隙原子。在化合物半导体中更为常见。</p>
<p><strong>肖特基缺陷</strong>：只产生空位（原子移到表面），在Si中比弗伦克尔缺陷更常见。</p>
<p><strong>Frenkel对和Schottky缺陷对能级的影响</strong>：点缺陷在禁带中引入局域化能级。空位通常产生深能级（可在禁带中央附近），影响载流子寿命和扩散。</p>
<div class="info"><strong>GaAs中的反位缺陷</strong>：As占据Ga位（As_Ga）形成EL2深能级，是GaAs原生缺陷中最重要的一个。EL2能级在Ec以下0.82eV处，是制备半绝缘GaAs衬底的关键。</div>`},
{n:"位错与线缺陷",s:"★★★★☆",body:`<p><strong>刃型位错</strong>：可以理解为在晶体中插入了半个晶面，位错线是多余半原子面的边缘。围绕位错线的原子排列偏离理想位置，产生应力场。</p>
<p><strong>位错的电学效应</strong>：</p>
<p>① 位错核心的悬挂键可在禁带中引入能级（深能级或浅能级），成为复合中心。</p>
<p>② 位错周围的应力场可改变能带结构，引起局部能带弯曲。</p>
<p>③ 位错可加速杂质扩散（沿位错管道的快速扩散通道）。</p>
<div class="formula-box">位错密度：<br>ρ_d = 位错线总长度/体积<br>单位：cm⁻²（截面法：穿/cm²）<br><br>高质量Si单晶：ρ_d < 10³ cm⁻²<br>低位错Si（无位错）：<100 cm⁻²</div>
<p><strong>位错对器件的影响</strong>：</p>
<p>• 增加载流子复合速率（降低少子寿命）</p>
<p>• 引起漏电流（PN结中的位错管道漏电）</p>
<p>• 影响MOS器件的阈值电压稳定性</p>
<p>• 现代IC工艺要求使用无位错硅单晶（CZ法可以做到）</p>
<div class="tip"><strong>考研考点</strong>：位错对半导体器件性能的不利影响是简答题常考内容。核心点：位错=悬挂键=深能级=复合中心=漏电。</div>`},
{n:"陷阱效应",s:"★★★★☆",body:`<p><strong>陷阱（Trap）</strong>：能暂时捕获载流子但最终会释放的能级。与复合中心不同，陷阱的净效果是延迟载流子的响应，而非永久消除载流子。</p>
<div class="formula-box">陷阱与复合中心的区别：<br>复合中心：捕获电子→捕获空穴→复合消失<br>陷阱：捕获载流子→热激发再释放→延迟但不消除</div>
<p><strong>陷阱的判据</strong>：</p>
<p>① 能级位置：靠近导带底或价带顶的深能级更容易成为陷阱（释放能量小）。</p>
<p>② 截面差异：电子捕获截面σ_n和空穴捕获截面σ_p差别越大，越倾向成为陷阱（而非复合中心）。</p>
<p>③ 若σ_n >> σ_p，则该能级是电子陷阱（频繁捕获电子，很少捕获空穴）。</p>
<p><strong>陷阱效应的影响</strong>：</p>
<p>• 光电导的持续光电导效应（persistent photoconductivity）</p>
<p>• MIS结构中C-V曲线的频率色散</p>
<p>• 非晶半导体中载流子的弥散输运</p>
<div class="warn"><strong>易错</strong>：陷阱≠复合中心。所有深能级都可以是陷阱或复合中心，取决于截面比和载流子浓度。高注入时陷阱饱和，转为复合中心行为。</div>`},
{n:"杂质能级的波函数特征",s:"★★★☆☆",body:`<p><strong>浅能级波函数</strong>：类氢模型给出的波函数是类氢1s态，扩展范围很大：</p>
<div class="formula-box">等效玻尔半径：<br>a* = (m₀/m*_n)·εr·a_B ≈ 30-60Å<br>（比晶格常数a=5.43Å大5-10倍）<br><br>波函数覆盖~10³个原胞</div>
<p><strong>深能级波函数</strong>：局域在杂质原子附近几个晶格常数范围内，不能用有效质量近似。</p>
<p><strong>central cell correction</strong>：浅能级的类氢模型在杂质原子核心附近（r<几个Å）不准确，因为核心势能不是简单的库仑势。这导致实际电离能比类氢模型预测值略大。</p>
<p><strong>杂质带</strong>：当杂质浓度很高时（>10¹⁸cm⁻³），相邻杂质的波函数开始重叠，杂质能级展宽为杂质带。当杂质带与导带或价带重叠时，杂质完全电离，即使在极低温下也有载流子。</p>
<div class="formula-box">杂质带形成的条件：<br>N_D^(1/3) · a* > 0.25（Mott转变条件）<br>即杂质间距 < ~4倍玻尔半径</div>`},
{n:"杂质扩散与固溶度",s:"★★★☆☆",body:`<p><strong>杂质扩散</strong>：杂质在高温下通过空位机制或间隙机制在晶格中迁移。</p>
<div class="formula-box">扩散方程（Fick第二定律）：<br>∂C/∂t = D·∂²C/∂x²<br><br>扩散系数温度依赖性：<br>D = D₀·exp(-Ea/kT)<br>D₀：频率因子，Ea：扩散激活能</div>
<p><strong>替位扩散vs间隙扩散</strong>：</p>
<table class="cmp"><tr><th>参数</th><th>替位扩散(P,B,As)</th><th>间隙扩散(O,Cu)</th></tr><tr><td>激活能Ea</td><td>3-5eV</td><td>0.5-2eV</td></tr><tr><td>扩散系数</td><td>小</td><td>大(10³-10⁶倍)</td></tr><tr><td>扩散温度</td><td>900-1200°C</td><td>400-900°C</td></tr></table>
<p><strong>固溶度</strong>：杂质在半导体中的最大溶解浓度，取决于温度和杂质种类。高浓度掺杂需要高温扩散或离子注入。</p>
<div class="tip"><strong>工艺关联</strong>：Si工艺中B和P的扩散温度在1000-1200°C，而Au等重金属杂质在800°C就已快速扩散整个晶片。这就是为什么工艺中要严格控制金属污染。</div>`},
{n:"复合中心与陷阱中心的区别",s:"★★★★★",exam:1,body:`<p><strong>SRH复合理论中的判据</strong>：一个深能级究竟是复合中心还是陷阱，取决于其对电子和空穴的捕获概率对比。</p>
<div class="formula-box">复合中心条件：σ_n ≈ σ_p<br>（电子和空穴捕获概率相近，先后捕获两种载流子完成复合）<br><br>陷阱条件：σ_n >> σ_p 或 σ_p >> σ_n<br>（只频繁捕获一种载流子，另一种极少被捕获，不能有效复合）</div>
<p><strong>典型复合中心</strong>：</p>
<p>• Au在Si中（Ec-0.54eV）：σ_n≈σ_p，是最有效的复合中心</p>
<p>• 高效复合中心降低少子寿命：τ = 1/(σ·v_th·N_t)</p>
<p><strong>典型陷阱</strong>：</p>
<p>• 氧在Si中形成的热施主：主要捕获电子</p>
<p>• 非晶Si中的悬挂键：σ_n/σ_p可能差10²倍以上</p>
<p><strong>实际影响</strong>：</p>
<table class="cmp"><tr><th>效果</th><th>复合中心</th><th>陷阱</th></tr><tr><td>少子寿命</td><td>显著降低</td><td>影响较小</td></tr><tr><td>光电导衰退</td><td>快速衰退</td><td>持续光电导</td></tr><tr><td>C-V特性</td><td>频率不敏感</td><td>频率色散</td></tr><tr><td>器件速度</td><td>加快（有利）</td><td>减慢（有害）</td></tr></table>
<div class="tip"><strong>考研重点</strong>：复合中心vs陷阱的区别是经典简答题。关键区别在于σ_n/σ_p比值。</div>`},
{n:"DX中心与负U效应",s:"★★★☆☆",body:`<p><strong>DX中心</strong>：存在于AlGaAs等混晶半导体中的特殊深能级缺陷。"D"代表donor（施主），"X"代表未知结构。</p>
<div class="formula-box">DX中心特征：<br>① 极大的晶格弛豫：缺陷在不同电荷态下构型差异巨大<br>② 深能级：通常在导带以下0.4-0.6eV<br>③ 负U效应：两个电子同时被捕获比分别被捕获更有利</div>
<p><strong>负U效应</strong>：正常情况下，电子逐个填充能级（先自旋↑再自旋↓），两个电子间的库仑排斥使第二个电子的能级更高（正U）。但DX中心的强晶格弛豫可使第二个电子的总能（电子能+晶格弛豫能）反而更低（负U）。</p>
<p><strong>后果</strong>：</p>
<p>① DX中心表现为双重态而非单电子态。</p>
<p>② 在Al_xGa₁₋_xAs中，x<0.22时DX中心位于导带内不影响导电性，x>0.22时进入禁带产生严重载流子冻结效应。</p>
<p>③ 这是AlGaAs/GaAs HEMT需要限制Al组分x<0.22的原因。</p>
<div class="info"><strong>考研考点</strong>：DX中心是III-V族化合物半导体特有的问题，与HEMT器件设计密切相关。了解其"负U"特性和Al组分依赖性即可。</div>`},
{n:"替位式杂质与间隙式杂质",s:"★★★★☆",exam:1,body:`<p><strong>替位式杂质</strong>：杂质原子取代晶格中原子的位置。要求杂质原子半径与基体原子接近。</p>
<div class="formula-box">替位条件：<br>① 原子半径差 < 15%（Hume-Rothery规则）<br>② 电负性接近<br>③ 价电子数影响溶解度<br><br>Si中替位杂质：<br>V族（P,As,Sb）→ 施主（替位Si原子）<br>III族（B,Al,Ga）→ 受主（替位Si原子）</div>
<p><strong>间隙式杂质</strong>：杂质原子位于晶格原子之间的间隙位置。要求杂质原子半径远小于基体原子。</p>
<div class="formula-box">间隙杂质：<br>① 小半径原子：H, Li, Cu, Fe等<br>② 间隙位置能量不一定高<br>③ 间隙扩散系数通常很大<br><br>间隙杂质的作用：<br>① H：钝化悬挂键（Si太阳能电池工艺）<br>② Cu, Fe：深能级陷阱（降低寿命）<br>③ Li：快速扩散的间隙杂质（早期锂电池材料）</div>
<div class="warn"><strong>易错</strong>：O在Si中是间隙式的（虽然原子较大），它形成SiO₄四面体，不在正常晶格位。C在Si中也是间隙式。这与直觉相反。</div>`},
{n:"杂质扩散与分布",s:"★★★★☆",body:`<p><strong>杂质扩散</strong>：半导体制造中通过高温扩散或离子注入将杂质引入半导体内部的过程。</p>
<div class="formula-box">菲克扩散方程：<br>∂C/∂t = D·∂²C/∂x²<br><br>两种边界条件的解：<br>① 恒定表面浓度（预沉积）：<br>C(x,t) = C_s·erfc(x/(2√(Dt)))<br><br>② 固定总剂量（推入/驱入）：<br>C(x,t) = Q/(√(πDt))·exp(-x²/(4Dt))<br>Q = 总杂质剂量</div>
<p><strong>扩散系数</strong>：</p>
<div class="formula-box">D = D₀·exp(-E_a/kT)<br>D₀：频率因子<br>E_a：扩散激活能<br><br>Si中杂质扩散系数（1100°C）：<br>B: ~10⁻¹³ cm²/s（慢）<br>P: ~10⁻¹² cm²/s（中）<br>Au: ~10⁻⁸ cm²/s（快，间隙式）<br><br>扩散机制：<br>替位式：空位扩散（慢，E_a大）<br>间隙式：直接跳跃（快，E_a小）</div>
<p><strong>氧化增强扩散（OED）</strong>：在Si表面热氧化时，注入的自间隙Si原子加速替位杂质（B、P）的扩散。这是因为氧化过程产生过饱和的Si自间隙原子。</p>
<div class="tip"><strong>工艺要点</strong>：扩散深度 x ∝ √(Dt)。要达到更深的结，需要更高温度或更长时间。但高温也促进横向扩散，降低器件密度。</div>`},
{n:"离子注入与退火",s:"★★★★☆",body:`<p><strong>离子注入</strong>：用高能离子束将杂质原子直接射入半导体内部。比扩散更精确可控。</p>
<div class="formula-box">注入离子的射程：<br>射程 R_p（投影射程）<br>射程偏差 ΔR_p<br><br>离子浓度分布（高斯近似）：<br>C(x) = C_p·exp[-(x-R_p)²/(2ΔR_p²)]<br>C_p = Φ/(√(2π)·ΔR_p)（峰值浓度）<br>Φ = 注入剂量（cm⁻²）<br><br>典型值（B注入Si，100keV）：<br>R_p ≈ 300nm，ΔR_p ≈ 70nm</div>
<p><strong>注入损伤</strong>：</p>
<div class="formula-box">每个入射离子可产生 ~10³-10⁴ 个晶格损伤<br><br>损伤类型：<br>① 单个空位和间隙原子（点缺陷）<br>② 级联碰撞形成的非晶区<br>③ 高剂量时表面完全非晶化<br><br>退火（Annealing）：<br>① 热退火：600-1000°C，修复晶格，激活杂质<br>② 快速热退火（RTA）：>1000°C，几秒<br>③ 激光退火：脉冲激光局部熔融再结晶</div>
<div class="info">离子注入是现代VLSI工艺中掺杂的主要手段。精确控制剂量（10¹²~10¹⁶ cm⁻²）和能量（1keV~1MeV）可以实现极精确的杂质分布控制。</div>`},
{n:"深能级的电学性质",s:"★★★★☆",body:`<p><strong>深能级</strong>：位于禁带中央附近的缺陷/杂质能级，距导带或价带较远。</p>
<div class="formula-box">深能级分类：<br>① 深能级杂质（替代式）：Au、Pt在Si中<br>② 本征缺陷：空位、双空位、E中心<br>③ 过渡金属络合物：Fe-B、Cr-V<br>④ 位错相关能级<br><br>深能级的特殊性质：<br>① 大晶格弛豫：Jahn-Teller效应<br>② 多重荷电态：D⁺, D⁰, D⁻<br>③ 声子辅助跃迁（大的Huang-Rhys因子）<br>④ 深能级的俘获截面与温度相关</div>
<p><strong>深能级对器件的影响</strong>：</p>
<p>① <strong>寿命控制</strong>：Au在Si中的E_t≈E_i，是最有效的复合中心。掺Au可将τ从ms降到ns。</p>
<p>② <strong>载流子陷阱</strong>：影响光电导和存储效应</p>
<p>③ <strong>泄漏电流</strong>：空间电荷区中的深能级产生产生电流</p>
<p>④ <strong>阈值电压漂移</strong>：MOS器件中的深能级影响V_T稳定性</p>
<div class="warn"><strong>深能级vs浅能级</strong>：浅能级（如P、B在Si中）在室温下完全电离→增加载流子浓度。深能级在室温下可能不完全电离→影响复合和产生而非导电。</div>`},
{n:"DLTS（深能级瞬态谱）",s:"★★★★☆",exam:1,body:`<p><strong>DLTS（Deep Level Transient Spectroscopy）</strong>：测量半导体中深能级参数（能级位置、浓度、俘获截面）的实验方法。</p>
<div class="formula-box">基本原理：<br>① 对PN结或肖特基结施加脉冲<br>② 填充深能级（正偏或零偏脉冲）<br>③ 反偏恢复后，深能级逐渐释放载流子<br>④ 电容随时间变化 C(t) = C₀ + ΔC·exp(-t/τ)<br>⑤ 扫描温度，记录电容瞬态<br><br>发射速率：<br>e_n = σ_n·v_th·N_c·exp(-(E_c-E_t)/kT)<br><br>率窗（rate window）：<br>选择特定温度下的最大信号</div>
<p><strong>DLTS能获取的信息</strong>：</p>
<div class="formula-box">① Arrhenius图：ln(e_n/T²) vs 1/T → 斜率求E_t，截距求σ_n<br>② 信号幅度 → 深能级浓度 N_t<br>③ 符号判断：电子发射（正峰）/空穴发射（负峰）<br>④ 俘获截面：变脉冲宽度实验</div>
<p><strong>DLTS的应用</strong>：</p>
<p>① 检测Si、GaAs中残余深能级缺陷</p>
<p>② 评估辐照损伤和退火效果</p>
<p>③ 研究界面态（界面深能级瞬态谱）</p>
<div class="info">DLTS灵敏度可达 N_t < 10¹⁰ cm⁻³（远低于载流子浓度），是研究深能级缺陷的最有力工具。变体：SDLTS、ODLTS、FDLTS。</div>`},
{n:"杂质的固溶度",s:"★★☆☆☆",body:`<p><strong>固溶度</strong>：在给定温度下，杂质在半导体中能够保持固溶状态的最大浓度。</p>
<div class="formula-box">固溶度公式：<br>C_s = C_max·exp(-ΔH_f/kT)<br>ΔH_f：杂质的溶解焓<br><br>Si中杂质的固溶度（1100°C）：<br>P: ~10²¹ cm⁻³（高）<br>B: ~6×10²⁰ cm⁻³（高）<br>Au: ~10¹⁶ cm⁻³（低）<br>Fe: ~10¹⁵ cm⁻³（很低）<br><br>固溶度-扩散系数的关联：<br>固溶度高的杂质扩散也快（杂质-空位相互作用）</div>
<p><strong>固溶度的实际意义</strong>：</p>
<p>① 限制了通过扩散能达到的最大表面浓度</p>
<p>② 决定了杂质在高温工艺步骤中的最大引入量</p>
<p>③ 超过固溶度时析出形成第二相（如Cu在Si中的析出）</p>
<div class="info">过渡金属（Cu、Fe、Au）在Si中的固溶度很低，容易在冷却过程中析出到晶界或位错处，形成深能级缺陷。</div>`}
],

// ===== 第3章 载流子的统计分布 =====
{title:"第3章 载流子的统计分布",subtitle:"费米分布·载流子浓度·费米能级 — 定量分析的基础",
 tags:[{t:"权重95%",c:"tag-weight"},{t:"★★★★★",c:"tag-stars"},{t:"核心基础",c:"tag-core"}],
 kps:[
{n:"费米-狄拉克分布函数",s:"★★★★★",exam:1,body:`<p><strong>费米-狄拉克分布</strong>：描述热平衡状态下能量为E的量子态被电子占据的概率：</p>
<div class="formula-box">f(E) = 1 / [1 + exp((E-E_F)/kT)]<br><br>E_F：费米能级（化学势）<br>kT = 0.026eV (T=300K)</div>
<p><strong>关键特征</strong>：</p>
<p>① f(E_F)=1/2——费米能级处占据概率恰好为1/2。</p>
<p>② T→0K时：f(E)=1(E<E_F), f(E)=0(E>E_F)——阶梯函数。</p>
<p>③ T>0K时：费米面附近~kT范围内的电子被热激发到E_F以上。</p>
<p>④ 当E-E_F>>kT时：f(E)≈exp(-(E-E_F)/kT)——玻尔兹曼近似。</p>
<div class="formula-box">1-f(E) = 1/[1+exp((E_F-E)/kT)]<br>这是空穴占据概率（价带中空态的概率）</div>
<div class="warn"><strong>易错</strong>：f(E)是电子占据概率，不是空穴概率！空穴概率是1-f(E)。在价带中计算空穴时用的是1-f(E)，不是f(E)。</div>`},
{n:"玻尔兹曼近似",s:"★★★★★",exam:1,body:`<p><strong>适用条件</strong>：当(E-E_F)>>kT时（即费米能级远离带边），费米分布可近似为：</p>
<div class="formula-box">电子：f(E) ≈ exp(-(E-E_F)/kT)（E>Ec）<br>空穴：1-f(E) ≈ exp(-(E_F-E)/kT)（E<Ev）<br><br>适用条件：<br>非简并半导体：Ec-E_F > 3kT（≈0.1eV）<br>或 E_F-Ev > 3kT</div>
<p><strong>玻尔兹曼近似的物理意义</strong>：在非简并半导体中，导带中电子数远小于态密度（占据概率很小），电子分布可用经典统计描述。</p>
<p><strong>玻尔兹曼近似失效的情况</strong>：</p>
<p>① 重掺杂半导体（简并半导体）：E_F进入导带或价带</p>
<p>② 高温下（本征激发区）：E_F移向禁带中央，仍可能适用</p>
<p>③ 窄禁带半导体：Eg小，简并化更易发生</p>
<div class="tip"><strong>考研核心</strong>：玻尔兹曼近似是推导载流子浓度公式的基础。几乎所有的载流子浓度公式都是在玻尔兹曼近似下推导的。记住适用条件：E_F在禁带中且远离带边3kT以上。</div>`},
{n:"状态密度函数",s:"★★★★★",exam:1,body:`<p><strong>状态密度g(E)</strong>：单位能量间隔内的量子态数目，单位：cm⁻³eV⁻¹</p>
<div class="formula-box">导带底附近的状态密度（三维）：<br>g_c(E) = 4π(2m*_n)^(3/2)/h³ · √(E-Ec)<br><br>价带顶附近的状态密度：<br>g_v(E) = 4π(2m*_p)^(3/2)/h³ · √(Ev-E)</div>
<p><strong>态密度有效质量</strong>：当存在多个等价能谷时，需要用态密度有效质量：</p>
<div class="formula-box">Si（6个等价谷）：<br>md*_n = 6^(2/3)·(ml·mt²)^(1/3) = 1.08m₀<br><br>GaAs（1个谷）：<br>md*_n = m*_n = 0.067m₀<br><br>Ge（4个等价谷，8个半谷）：<br>md*_n = 4^(2/3)·(ml·mt²)^(1/3) = 0.56m₀</div>
<p><strong>态密度的物理图像</strong>：在k空间中，能量面E(k)=const围成等能面。等能面附近的k空间体积越大，该能量处的态密度越大。对于球形等能面，g(E)∝√E（抛物线色散关系的特征）。</p>
<div class="warn"><strong>易错</strong>：态密度有效质量md*和电导率有效质量mc*不同！md*用于计算载流子浓度（态密度），mc*用于计算迁移率（散射）。Si的md*_n=1.08m₀，而mc*_n=0.26m₀。</div>`},
{n:"导带电子浓度",s:"★★★★★",exam:1,body:`<p>在玻尔兹曼近似下，导带中的平衡电子浓度：</p>
<div class="formula-box">n = ∫(Ec→∞) g_c(E)·f(E) dE<br>  = Nc · exp(-(Ec-E_F)/kT)<br><br>导带有效态密度：<br>Nc = 2(2πm*_n kT/h²)^(3/2)<br>   = 2.5×10¹⁹·(m*_n/m₀)^(3/2)·(T/300)^(3/2) cm⁻³</div>
<p><strong>Nc的物理意义</strong>：如果把所有导带态都压缩到Ec处，每单位体积有Nc个态。实际上电子按玻尔兹曼分布占据这些态。</p>
<div class="formula-box">300K时的Nc值：<br>Si: Nc = 2.8×10¹⁹ cm⁻³<br>GaAs: Nc = 4.7×10¹⁷ cm⁻³<br>Ge: Nc = 1.04×10¹⁹ cm⁻³</div>
<p><strong>价带空穴浓度</strong>（对称推导）：</p>
<div class="formula-box">p = Nv · exp(-(E_F-Ev)/kT)<br>Nv = 2(2πm*_p kT/h²)^(3/2)<br>Si: Nv = 1.04×10¹⁹ cm⁻³</div>
<div class="tip"><strong>考研必背公式</strong>：n=Nc·exp(-(Ec-E_F)/kT)，p=Nv·exp(-(E_F-Ev)/kT)。这两个公式是半导体物理的核心，几乎所有后续章节都要用到。</div>`},
{n:"本征载流子浓度",s:"★★★★★",exam:1,body:`<p><strong>本征半导体</strong>：无杂质无缺陷的理想纯净半导体，n=p=ni。</p>
<div class="formula-box">n·p = ni² = Nc·Nv·exp(-Eg/kT)<br><br>ni = √(Nc·Nv)·exp(-Eg/2kT)<br>   = (Nc·Nv)^(1/2)·exp(-Eg/2kT)</div>
<div class="formula-box">300K时：<br>ni(Si) = 1.5×10¹⁰ cm⁻³<br>ni(Ge) = 2.4×10¹³ cm⁻³<br>ni(GaAs) = 1.8×10⁶ cm⁻³<br><br>ni² = n·p 对所有热平衡半导体均成立</div>
<p><strong>ni的温度依赖性</strong>：ni∝T^(3/2)·exp(-Eg/2kT)，随温度指数增加。</p>
<p><strong>n·p=ni²的重要意义</strong>：</p>
<p>① 热平衡条件下始终成立，无论掺杂与否。</p>
<p>② 知道n即可求p（反之亦然）：p=ni²/n。</p>
<p>③ Eg越大→ni越小→Si比Ge更适合高温器件。</p>
<div class="formula-box">近似公式（T在300K附近）：<br>ni(Si) ≈ 3.88×10¹⁶·T^(3/2)·exp(-7000/T) cm⁻³</div>
<div class="warn"><strong>考研高频</strong>：n·p=ni²是全书最重要的公式之一。但要注意适用条件：热平衡、非简并、玻尔兹曼近似。非平衡时n·p>ni²。</div>`},
{n:"杂质半导体的载流子浓度",s:"★★★★★",exam:1,body:`<p><strong>N型半导体</strong>（施主浓度N_D，受主浓度N_A）：</p>
<div class="formula-box">电中性条件：n + N_A = p + N_D<br>简化（忽略p，假设完全电离）：<br>n ≈ N_D - N_A<br>p = ni²/n = ni²/(N_D-N_A)</div>
<p><strong>P型半导体</strong>：</p>
<div class="formula-box">p ≈ N_A - N_D<br>n = ni²/p = ni²/(N_A-N_D)</div>
<p><strong>载流子浓度的温度依赖性（三个温区）</strong>：</p>
<p>① <strong>杂质电离区</strong>（低温，杂质未完全电离）：n随T指数增加。</p>
<p>② <strong>饱和区</strong>（室温附近，杂质完全电离）：n≈N_D-N_A，基本不随温度变化。</p>
<p>③ <strong>本征激发区</strong>（高温，ni>>N_D）：n≈p≈ni，指数增加。</p>
<div class="formula-box">饱和区到本征激发区的转折温度：<br>当ni(T) = |N_D-N_A| 时<br>Si（N_D=10¹⁵cm⁻³）：转折温度约300°C<br>Si（N_D=10¹⁷cm⁻³）：转折温度约500°C</div>
<div class="tip"><strong>考研高频</strong>：杂质半导体载流子浓度的温度曲线（ln n vs 1/T图）是经典考题。三个温区的特征和转折条件必须掌握。</div>`},
{n:"费米能级位置",s:"★★★★★",exam:1,body:`<p>由n=Nc·exp(-(Ec-E_F)/kT)反解费米能级：</p>
<div class="formula-box">N型半导体：<br>E_F = Ec - kT·ln(Nc/n)<br>    = Ec - kT·ln(Nc/(N_D-N_A))<br><br>P型半导体：<br>E_F = Ev + kT·ln(Nv/p)<br>    = Ev + kT·ln(Nv/(N_A-N_D))</div>
<p><strong>费米能级随温度的变化</strong>：</p>
<p>① 低温：E_F在Ec和施主能级之间（杂质未完全电离）</p>
<p>② 室温：E_F在Ec附近（完全电离区，n≈N_D）</p>
<p>③ 高温：E_F移向禁带中央（本征激发区）</p>
<p><strong>费米能级随掺杂浓度的变化</strong>：</p>
<p>• N_D增大→n增大→E_F向Ec靠近→进入导带（简并化）</p>
<p>• N_A增大→p增大→E_F向Ev靠近→进入价带（简并化）</p>
<div class="formula-box">简并化条件：<br>N_D > Nc（或N_A > Nv）时，E_F进入带内<br>Si: Nc≈2.8×10¹⁹ cm⁻³<br>所以掺杂>10¹⁹cm⁻³时开始简并化</div>
<div class="warn"><strong>考研必考</strong>：画出E_F随T和掺杂的变化趋势图是高频考题。记住三条曲线：N型E_F从Ec附近→禁带中央，P型从Ev附近→禁带中央，本征始终在中央。</div>`},
{n:"简并半导体",s:"★★★★★",body:`<p><strong>简并半导体</strong>：费米能级进入导带或价带内部的半导体，此时玻尔兹曼近似失效，必须使用费米-狄拉克分布。</p>
<div class="formula-box">简并化条件：<br>N型：Ec - E_F < 0（E_F在导带内）<br>P型：E_F - Ev < 0（E_F在价带内）<br><br>近似判断：N_D > Nc 或 N_A > Nv</div>
<p><strong>简并半导体的特性</strong>：</p>
<p>① 载流子浓度不再等于掺杂浓度（未完全电离）。</p>
<p>② 费米能级对温度不太敏感（被"钉扎"在带内）。</p>
<p>③ 禁带宽度收缩（带尾效应）：高浓度杂质造成势能涨落，使带边出现带尾态。</p>
<p>④ Burstein-Moss效应：导带底部被电子填满，光学吸收边蓝移。</p>
<div class="formula-box">简并半导体的载流子浓度：<br>n = Nc · F₁/₂(η)<br>η = (E_F-Ec)/kT（无量纲费米能）<br>F₁/₂(η) = (2/√π)∫₀^∞ x^(1/2)/(1+exp(x-η))dx<br>（费米-狄拉克积分）</div>
<div class="tip"><strong>考研考点</strong>：简并半导体的判据和物理特性是选择题常考内容。重点掌握：简并化条件、禁带收缩、B-M效应。</div>`},
{n:"载流子浓度温度曲线全分析",s:"★★★★★",exam:1,body:`<p><strong>ln(n) vs 1/T图的三个温区</strong>（N型半导体为例）：</p>
<div class="formula-box">I. 杂质电离区（低温）：<br>n ∝ exp(-Ed/2kT)（假设ND>>NA且NA=0）<br>斜率 = -Ed/2k → 可求施主电离能Ed<br><br>II. 饱和区（室温附近）：<br>n ≈ ND - NA ≈ const<br>斜率 ≈ 0 → 平台区<br><br>III. 本征激发区（高温）：<br>n ≈ ni ∝ exp(-Eg/2kT)<br>斜率 = -Eg/2k → 可求禁带宽度Eg</div>
<p><strong>精确分析需要同时考虑</strong>：</p>
<p>① 施主和受主的不完全电离（费米分布）</p>
<p>② 本征激发（ni随T增加）</p>
<p>③ 有效态密度Nc、Nv的T^(3/2)依赖</p>
<div class="info"><strong>考研计算题型</strong>：给出n-T或n-1/T数据，要求：①判断温区；②求Ed或Eg；③画能带图标注E_F位置。这是计算题高频题型。</div>
<div class="warn"><strong>易错</strong>：ln(n)vs 1/T图中，低温区斜率对应Ed/2k（不是Ed/k），高温区斜率对应Eg/2k（不是Eg/k）。因为n∝exp(-E/2kT)中指数是E/2kT。</div>`},
{n:"电中性条件",s:"★★★★☆",body:`<p><strong>电中性条件</strong>：半导体整体电中性，正电荷密度等于负电荷密度：</p>
<div class="formula-box">p + N_D⁺ = n + N_A⁻<br><br>完全电离时简化为：<br>p + N_D = n + N_A（N型简化：n≈N_D-N_A）<br><br>本征半导体：n = p = ni</div>
<p><strong>电中性条件是求解载流子浓度的出发点</strong>：将n和p用E_F表示（通过Nc、Nv公式），再代入电中性条件，即可求解E_F和n、p。</p>
<p><strong>一般情况下的精确解</strong>：</p>
<div class="formula-box">n = Nc·exp(-(Ec-E_F)/kT)<br>p = Nv·exp(-(E_F-Ev)/kT)<br>n·p = ni²<br><br>联立电中性条件和n·p=ni²，得到n的二次方程：<br>n² + (N_A-N_D)·n - ni² = 0<br><br>n = [(N_D-N_A) + √((N_D-N_A)²+4ni²)] / 2</div>
<div class="tip"><strong>万能公式</strong>：上面的二次方程精确解适用于所有情况（N型、P型、补偿、本征）。当|N_D-N_A|>>ni时简化为n≈|N_D-N_A|。</div>`},
{n:"费米-狄拉克积分",s:"★★★☆☆",body:`<p><strong>费米-狄拉克积分</strong>：在简并半导体中计算载流子浓度必须使用费米积分，不能用玻尔兹曼近似。</p>
<div class="formula-box">通用载流子浓度公式：<br>n = Nc · (2/√π) · F₁/₂(η)<br>η = (E_F - Ec)/kT<br><br>F_j(η) = ∫₀^∞ x^j / [1+exp(x-η)] dx<br><br>F₁/₂(η)是半整数费米积分</div>
<p><strong>近似行为</strong>：</p>
<p>① η << -1（非简并）：F₁/₂(η) ≈ exp(η) → 退化为玻尔兹曼公式</p>
<p>② η >> 1（强简并）：F₁/₂(η) ≈ (4/3√π)·η^(3/2) → n ∝ (E_F-Ec)^(3/2)</p>
<p>③ η=0（E_F在带边）：F₁/₂(0) = 0.678</p>
<div class="info"><strong>实用表格</strong>：η=-3→F₁/₂=0.047; η=-2→0.115; η=-1→0.270; η=0→0.678; η=1→1.396; η=2→2.502; η=5→7.80</div>
<div class="tip"><strong>考研考点</strong>：费米积分一般不要求精确计算，但要知道其极限行为：η<<0时退化为exp（经典），η>>0时退化为η^(3/2)（量子）。</div>`},
{n:"重掺杂效应",s:"★★★★☆",body:`<p><strong>重掺杂</strong>（N_D或N_A > 10¹⁸cm⁻³）引入多种效应：</p>
<p><strong>① 禁带收缩（Bandgap Narrowing）</strong>：</p>
<div class="formula-box">ΔEg ≈ 22.5×(N/10¹⁸)^(1/2) meV（N型Si）<br>ΔEg ≈ 6.8×(N/10¹⁸)^(1/3) + 21.3×(N/10¹⁸)^(1/4) meV（P型Si）<br><br>物理原因：杂质原子的随机分布造成势能涨落，导带底和价带顶出现带尾态</div>
<p><strong>② Burstein-Moss效应</strong>：重掺杂N型半导体中，导带底部大量状态被电子占据，光学吸收边向高能方向移动（蓝移）。</p>
<p><strong>③ 杂质带形成</strong>：杂质波函数重叠，孤立的杂质能级展宽为杂质带，可与导带/价带重叠。</p>
<p><strong>④ 多声子发射</strong>：重掺杂引入的局域电场可增强载流子散射。</p>
<p><strong>对器件的影响</strong>：</p>
<p>• 太阳能电池效率下降（禁带收缩增加辐射复合）</p>
<p>• 隧道效应增强（耗尽层变窄）</p>
<p>• 简并掺杂用于欧姆接触和隧道结</p>
<div class="warn"><strong>考研考点</strong>：重掺杂效应在太阳能电池效率分析中经常出现。禁带收缩是实际效率低于理论极限的原因之一。</div>`},
{n:"非平衡载流子统计",s:"★★★★☆",body:`<p><strong>非平衡态</strong>：当有外部激发（光照、注入等）时，载流子浓度偏离热平衡值。</p>
<div class="formula-box">非平衡载流子：<br>Δn = n - n₀, Δp = p - p₀<br>n = n₀ + Δn, p = p₀ + Δp<br><br>n·p = (n₀+Δn)(p₀+Δp) > ni²<br><br>小注入条件：Δn << n₀（N型）<br>大注入条件：Δn ≈ Δp >> n₀</div>
<p><strong>准费米能级</strong>：非平衡时不能用统一的费米能级，需要分别定义电子和空穴的准费米能级：</p>
<div class="formula-box">n = Nc·exp(-(Ec-E_Fn)/kT)<br>p = Nv·exp(-(E_Fp-Ev)/kT)<br><br>E_Fn ≠ E_Fp（非平衡时）<br>E_Fn - E_Fp > 0 表示有注入</div>
<p><strong>准费米能级的分裂</strong>：注入越强，E_Fn和E_Fp的分裂越大。在PN结正向偏压下，E_Fn-E_Fp=qV（V为外加电压）。</p>
<div class="tip"><strong>考研高频</strong>：准费米能级的概念在非平衡载流子（第5章）和PN结（第6章）中都会用到。核心：平衡时E_Fn=E_Fp=E_F；非平衡时分裂。</div>`},
{n:"费米能级在器件中的应用",s:"★★★★☆",body:`<p><strong>费米能级统一原理</strong>：热平衡时，整个系统的费米能级处处相等。这个原理是分析各种器件能带图的基础。</p>
<div class="formula-box">应用步骤：<br>① 分别画出各区域的能带图<br>② 让费米能级对齐（水平线）<br>③ 弯曲区域的Ec、Ev随之弯曲<br>④ 弯曲量 = q·(V_内建 - V_外加)</div>
<p><strong>典型应用</strong>：</p>
<p>① <strong>PN结</strong>：P型和N型的E_F对齐→能带弯曲→内建势垒qV_D=E_cN-E_cP</p>
<p>② <strong>金属-半导体接触</strong>：金属E_F与半导体E_F对齐→形成势垒</p>
<p>③ <strong>异质结</strong>：两种半导体E_F对齐→能带不连续→ΔEc和ΔEv</p>
<p>④ <strong>MOS结构</strong>：金属E_F与半导体E_F对齐→表面能带弯曲</p>
<div class="tip"><strong>核心方法</strong>：无论什么器件结构，分析能带图的第一步都是让费米能级对齐。这是贯穿全书的分析方法。</div>`},
{n:"本征激发区的载流子浓度",s:"★★★★☆",exam:1,body:`<p><strong>本征激发区</strong>：温度足够高时，热激发使本征载流子浓度远大于杂质浓度，ni >> N_D或N_A。</p>
<div class="formula-box">本征载流子浓度：<br>n_i² = N_c·N_v·exp(-E_g/kT)<br>= 4.83×10³¹·(T/300)³·exp(-E_g/kT)  [cm⁻⁶]<br><br>Si(300K): n_i = 1.5×10¹⁰ cm⁻³<br>Ge(300K): n_i = 2.4×10¹³ cm⁻³<br>GaAs(300K): n_i = 2.1×10⁶ cm⁻³</div>
<p><strong>ln(n_i) vs 1/T图</strong>：在高温区呈线性，斜率=-E_g/(2k)。通过此直线可精确测定禁带宽度E_g。</p>
<p><strong>本征区的特征</strong>：<br>• 费米能级趋近禁带中央：E_F ≈ (E_c+E_v)/2<br>• 多子浓度等于少子浓度<br>• 迁移率主要由声学波散射决定<br>• 材料呈本征导电特性</p>
<div class="warn"><strong>易错</strong>：本征区≠室温。Si的本征温度（ni=N_D）约300-500°C（取决于掺杂浓度），室温下Si仍是杂质导电为主。</div>`},
{n:"杂质电离区的载流子浓度",s:"★★★★☆",body:`<p><strong>杂质电离区</strong>（饱和区）：温度足够高使杂质完全电离，但ni << N_D（或N_A），属于杂质导电。</p>
<div class="formula-box">N型（完全电离）：n ≈ N_D<br>P型（完全电离）：p ≈ N_A<br><br>费米能级位置：<br>E_F = E_c - kT·ln(N_c/N_D) （N型）<br>E_F = E_v + kT·ln(N_v/N_A) （P型）</div>
<p><strong>温度依赖性</strong>：<br>• n ≈ N_D（常数，与温度无关）<br>• E_F随温度线性移动（T升高→E_F远离带边）<br>• 迁移率随温度变化（主要散射机制决定）<br>• 电阻率主要由迁移率的温度依赖性决定</p>
<p><strong>ln(n) vs 1/T图</strong>：在该温区呈水平线（n不随T变化），对应完全电离平台。</p>
<div class="tip"><strong>实验意义</strong>：饱和区是大多数半导体器件的工作温区。该区域n≈N_D→杂质浓度的Hall测量值最准确。</div>`},
{n:"过渡区的载流子浓度",s:"★★★★☆",body:`<p><strong>过渡区</strong>：杂质部分电离的温区，介于冻结区和饱和区之间。</p>
<div class="formula-box">载流子浓度（N型，含受主补偿）：<br>n = (N_D-N_A)/[1 + g_d·n/N_c·exp(ΔE_d/kT)]<br><br>简化（无补偿 N_A=0）：<br>n = N_D/[1 + (1/g_d)·exp((E_c-E_d)/kT)]<br>g_d = 2（施主基态简并度）</div>
<p><strong>冻结因子</strong>：f_d = n/N_D = 电离施主比例</p>
<div class="formula-box">冻结因子：<br>f_d = 1/[1 + (N_c/(g_d·N_D))·exp(-ΔE_d/kT)]<br><br>低温极限（冻结）：f_d → 0<br>高温极限（完全电离）：f_d → 1<br>转折温度：T₀ 使 f_d = 0.5</div>
<p><strong>过渡区分析要点</strong>：<br>• ln(n) vs 1/T图在过渡区呈弯曲过渡<br>• 斜率从冻结区的-E_d/(2k)逐渐趋于零<br>• 受主补偿使冻结更严重（N_A消耗了部分施主电子）</p>
<div class="warn"><strong>易错</strong>：冻结区的n随温度指数增长≠本征激发。前者是杂质电离（ΔE_d ~ meV），后者是价带到导带激发（E_g ~ eV）。</div>`},
{n:"简并半导体的载流子浓度",s:"★★★★☆",body:`<p><strong>简并条件</strong>：当掺杂浓度很高（N_D >> N_c）时，费米能级进入导带（或价带），必须使用费米-狄拉克积分。</p>
<div class="formula-box">简并判据：<br>N_D > N_c/4 ≈ 10¹⁹ cm⁻³ (Si, 300K)<br>或 E_c - E_F < -3kT<br><br>载流子浓度（简并）：<br>n = N_c·F_{1/2}(η_F)<br>η_F = (E_F - E_c)/(kT)<br>F_{1/2} = 费米-狄拉克积分</div>
<p><strong>费米积分近似</strong>：</p>
<div class="formula-box">非简并（η_F << 0）：F_{1/2}(η) ≈ exp(η)<br>简并（η_F >> 0）：F_{1/2}(η) ≈ (2/√π)·(2/3)η^(3/2)<br>过渡区：数值查表或Padé近似</div>
<p><strong>简并半导体的特征</strong>：<br>• 玻尔兹曼近似失效<br>• 费米能级进入能带→金属导电性<br>• Burstein-Moss效应：光学带隙增大<br>• 带尾效应：高浓度杂质扰动使带边模糊</p>
<div class="tip"><strong>考研重点</strong>：简并判据的计算——给定N_D，判断是否简并。方法：先假设非简并求出E_F，若E_F > E_c则实际为简并。</div>`},
{n:"补偿半导体的载流子浓度",s:"★★★★☆",exam:1,body:`<p><strong>补偿半导体</strong>：同时含有施主（N_D）和受主（N_A）杂质。</p>
<div class="formula-box">完全电离条件：<br>N型（N_D > N_A）：<br>n = N_D - N_A（净施主浓度）<br>p = n_i²/(N_D - N_A)<br><br>P型（N_A > N_D）：<br>p = N_A - N_D（净受主浓度）<br>n = n_i²/(N_A - N_D)</div>
<p><strong>补偿度</strong>：K = N_A/N_D（对N型）</p>
<div class="formula-box">补偿度影响：<br>K→0：无补偿，n=N_D<br>K→1：完全补偿，n→0（接近本征）<br><br>补偿对迁移率的影响：<br>总散射率 = 施主散射 + 受主散射<br>迁移率随补偿度增大而降低</div>
<p><strong>补偿半导体的特点</strong>：<br>• 有效载流子浓度降低<br>• 散射增强（施主+受主离子都散射）<br>• 实际工艺中不可避免存在补偿<br>• Hall效应测量的是净杂质浓度|N_D-N_A|</p>
<div class="warn"><strong>易错</strong>：Hall效应无法直接区分N_D和N_A，只能测出|N_D-N_A|。要分别确定两者需要变温Hall+低温Hall测量。</div>`},
{n:"费米能级的温度依赖性",s:"★★★★☆",body:`<p><strong>E_F随温度的变化</strong>：是理解半导体从冻结区→饱和区→本征区转变的关键。</p>
<p><strong>N型半导体（N_D > N_A）</strong>：</p>
<div class="formula-box">低温（冻结区）：<br>E_F ≈ (E_c + E_d)/2 + (kT/2)ln(N_D/(2N_c))<br>E_F靠近禁带上半部中央<br><br>中温（饱和区）：<br>E_F = E_c - kT·ln(N_c/N_D)<br>E_F随T线性远离导带<br><br>高温（本征区）：<br>E_F → (E_c + E_v)/2 = E_i<br>E_F趋向禁带中央</div>
<p><strong>图形表示</strong>：E_F vs T曲线是一条"滑梯"——从E_c附近（低温）逐渐滑向E_i（高温）。</p>
<div class="formula-box">转折温度估计：<br>T₁（冻结→饱和）≈ ΔE_d/[k·ln(N_c/g_d·N_D)]<br>T₂（饱和→本征）≈ E_g/[k·ln(N_c·N_v/(N_D·n_i₀²))]  粗略估计</div>
<div class="tip"><strong>核心理解</strong>：费米能级的移动反映了电子从"局域在杂质上"→"自由在导带中"→"与价带等概率"的渐变过程。</div>`},
{n:"载流子浓度的精确数值计算",s:"★★★☆☆",body:`<p><strong>精确求解</strong>需要联立电中性方程和载流子浓度公式：</p>
<div class="formula-box">电中性方程：<br>n + N_A⁻ = p + N_D⁺<br><br>其中：<br>n = N_c·F_{1/2}(η_n), η_n = (E_F-E_c)/(kT)<br>p = N_v·F_{1/2}(η_p), η_p = (E_v-E_F)/(kT)<br>N_D⁺ = N_D·[1 - g_d/(1+g_d·exp((E_d-E_F)/kT))]<br>N_A⁻ = N_A·[1 - g_a/(1+g_a·exp((E_F-E_a)/kT))]</div>
<p><strong>求解方法</strong>：</p>
<p>① <strong>迭代法</strong>：假设E_F初值→计算n,p,N_D⁺,N_A⁻→代入电中性→修正E_F→循环至收敛。</p>
<p>② <strong>牛顿法</strong>：将电中性方程写为f(E_F)=0，用牛顿迭代。</p>
<p>③ <strong>分段近似</strong>：<br>• 本征区：直接用ni<br>• 饱和区：n=N_D-N_A<br>• 冻结区：n = √(N_D·N_c/(2g_d))·exp(-ΔE_d/2kT)</p>
<div class="tip"><strong>考研实用</strong>：大多数考研题目只需分段近似（非简并+完全电离→n=N_D-N_A）。只有重掺杂或极低温才需要精确计算。</div>`},
{n:"带尾效应与高掺杂修正",s:"★★★☆☆",body:`<p><strong>带尾（Band Tail）</strong>：高浓度杂质的库仑势场扰动使能带边缘不再锐利，而是向禁带中延伸出"尾巴"态。</p>
<p><strong>物理起源</strong>：<br>• 施主/受主离子的随机分布→局域势起伏<br>• 离杂质近的区域势能低→能带向下弯曲<br>• 大量随机起伏叠加→带边模糊→出现带尾</p>
<div class="formula-box">带尾宽度（Hauser模型）：<br>ΔE_tail ∝ (N_imp)^(2/3)·a_B*<br>N_imp = 杂质浓度<br>a_B* = 有效玻尔半径<br><br>Si中：N_imp > 10¹⁸ cm⁻³时带尾效应显著</div>
<p><strong>对能带结构的影响</strong>：<br>• 有效带隙减小：E_g_eff = E_g - ΔE_tail<br>• 态密度在带边处不再是抛物线形<br>• 光吸收边变宽（Urbach尾）<br>• 重掺杂LED的发光峰红移</p>
<p><strong>带尾对载流子浓度的影响</strong>：带尾态被电子部分填充→实际的n小于简单抛物线能带的预测值。</p>
<div class="warn"><strong>易错</strong>：带尾效应≠Burstein-Moss效应。Burstein-Moss是费米能级进入能带→光学带隙增大（蓝移）；带尾效应是带边模糊→有效带隙减小（红移）。两者方向相反。</div>`}
],

// ============ Chapter 4: 半导体的导电性 ============
{title:"第4章 半导体的导电性",sub:"迁移率、散射机制、电阻率",tag:"核心章节",kps:[
{n:"漂移电流与迁移率",s:"★★★★★",exam:1,body:`<p><strong>漂移电流</strong>：外加电场E下，载流子获得定向运动速度（漂移速度），形成电流。</p>
<div class="formula-box">漂移速度：v_d = μ·E<br>电子：v_dn = μ_n·E<br>空穴：v_dp = μ_p·E<br><br>电流密度：<br>J = J_n + J_p = q(nμ_n + pμ_p)·E = σ·E<br><br>电导率：σ = q(nμ_n + pμ_p)<br>电阻率：ρ = 1/σ</div>
<p><strong>迁移率的物理意义</strong>：迁移率μ描述载流子在单位电场下的漂移速度，反映载流子在晶格中运动的难易程度。单位：cm²/(V·s)。</p>
<p><strong>典型值</strong>（室温，高纯）：</p>
<table class="cmp"><tr><th>材料</th><th>μ_n (cm²/Vs)</th><th>μ_p (cm²/Vs)</th></tr><tr><td>Si</td><td>1350</td><td>480</td></tr><tr><td>Ge</td><td>3900</td><td>1900</td></tr><tr><td>GaAs</td><td>8500</td><td>400</td></tr></table>
<div class="tip"><strong>记忆</strong>：μ_n > μ_p（电子比空穴快），Si的μ约为Ge的1/3，GaAs的μ_n最高（适合高频器件）。</div>`},
{n:"电导率有效质量",s:"★★★☆☆",body:`<p><strong>电导率有效质量</strong>：在多能谷半导体中，不同能谷的有效质量不同。对于输运性质，需要使用电导率有效质量：</p>
<div class="formula-box">对于单个能谷（椭球等能面）：<br>1/m_c* = (1/3)(1/m_l* + 2/m_t*)<br><br>Si导带（6个等价能谷）：<br>m_l* = 0.98m₀, m_t* = 0.19m₀<br>m_c* = 3/(1/0.98 + 2/0.19) ≈ 0.26m₀<br><br>总电导率要考虑所有能谷的贡献</div>
<p><strong>与态密度有效质量的区别</strong>：态密度有效质量m_d* = (m_l*·m_t*²)^(1/3)，用于计算态密度和载流子浓度。两者不可混用。</p>
<div class="warn"><strong>易错</strong>：计算载流子浓度用态密度有效质量，计算迁移率/电导率用电导率有效质量。两者数值不同！</div>`},
{n:"载流子散射机制",s:"★★★★★",exam:1,body:`<p><strong>散射的本质</strong>：载流子在运动过程中不断与晶格振动（声子）、杂质离子等发生碰撞，改变运动方向和能量。</p>
<div class="formula-box">平均自由时间（弛豫时间）：<br>τ = 1/(散射概率)<br><br>迁移率与弛豫时间的关系：<br>μ = qτ/m*<br><br>多种散射同时存在时：<br>1/τ = 1/τ₁ + 1/τ₂ + ...（马西森定则）<br>μ = q/(m*·(1/τ₁+1/τ₂+...))</div>
<p><strong>主要散射机制</strong>：</p>
<p>① <strong>晶格振动散射</strong>：声学波散射（主要）和光学波散射（极性材料中重要）</p>
<p>② <strong>电离杂质散射</strong>：库仑散射，与杂质浓度成正比</p>
<p>③ <strong>中性杂质散射</strong>：低温下杂质未电离时重要</p>
<p>④ <strong>合金散射</strong>：混晶半导体中，原子排列的随机性引起的散射</p>
<p>⑤ <strong>载流子-载流子散射</strong>：高注入时重要，不影响总动量但改变分布</p>
<div class="tip"><strong>考研重点</strong>：马西森定则将多种散射的弛豫时间倒数相加。实际中主要考虑晶格散射和电离杂质散射两项。</div>`},
{n:"晶格振动散射",s:"★★★★★",exam:1,body:`<p><strong>声学波散射</strong>：晶格热振动导致原子间距发生周期性变化→禁带宽度起伏→对载流子形成周期性势场扰动→散射。</p>
<div class="formula-box">声学波散射的弛豫时间：<br>τ_l ∝ T^(-3/2)<br><br>对应的迁移率：<br>μ_l = qτ_l/m* ∝ T^(-3/2)<br><br>（T升高→振动增强→散射增强→μ下降）</div>
<p><strong>光学波散射</strong>：在极性半导体（如GaAs、GaP）中，光学波引起正负离子的相对位移，产生极化电场，对载流子散射很强。</p>
<div class="formula-box">光学波散射的迁移率：<br>μ_o ∝ [exp(ℏω_op/kT)-1] / T^(1/2)<br><br>高温时 μ_o ∝ T^(-1/2)<br>低温时 μ_o 急剧增大（冻结效应）</div>
<p><strong>Ge、Si中</strong>：以声学波散射为主（非极性）。</p>
<p><strong>GaAs中</strong>：低温以电离杂质散射为主，高温以光学波散射为主。</p>
<div class="warn"><strong>易错</strong>：声学波散射 μ ∝ T^(-3/2)，不要和电离杂质散射 μ ∝ T^(3/2) 搞混！指数符号相反。</div>`},
{n:"电离杂质散射",s:"★★★★★",exam:1,body:`<p><strong>库仑散射</strong>：电离杂质周围存在库仑势场，经过的载流子受到库仑力作用而偏转。</p>
<div class="formula-box">Brooks-Herring公式：<br>μ_I = (128√2·ε²·(kT)^(3/2)) / (√π·q³·m*^(1/2)·N_I·[ln(1+b)-b/(1+b)])<br><br>其中 b = 8m*kT·ε/(ℏ²·q²·n)<br>ε = ε₀·ε_r（介电常数）<br>N_I = 电离杂质浓度<br><br>简化：μ_I ∝ T^(3/2) / N_I</div>
<p><strong>温度依赖性</strong>：μ_I ∝ T^(3/2)。温度升高，载流子热运动速度增大，经过电离杂质时偏转角度减小，等效散射减弱，迁移率增大。</p>
<p><strong>浓度依赖性</strong>：μ_I ∝ 1/N_I。杂质越多，散射越强，迁移率越低。</p>
<p><strong>温度区间分析</strong>：</p>
<p>① <strong>低温</strong>（杂质部分电离）：载流子热运动慢，电离杂质散射主导，μ随T升高而增大</p>
<p>② <strong>中温</strong>（杂质完全电离）：两种散射竞争，出现迁移率峰值</p>
<p>③ <strong>高温</strong>（本征激发）：晶格散射主导，μ随T升高而下降</p>
<div class="tip"><strong>考研常考</strong>：解释μ-T曲线的形状。低温上升段（电离杂质散射主导），高温下降段（晶格散射主导），峰值在杂质完全电离附近。</div>`},
{n:"霍尔效应与霍尔系数",s:"★★★★★",exam:1,body:`<p><strong>霍尔效应</strong>：电流I沿x方向通过样品，加z方向磁场B_z，则在y方向产生横向电场（霍尔电场E_H）。</p>
<div class="formula-box">霍尔电场：<br>E_H = R_H · J_x · B_z<br><br>霍尔系数：<br>N型：R_H = -1/(qn)（负值）<br>P型：R_H = +1/(qp)（正值）<br><br>霍尔电压：<br>V_H = R_H · I · B / d（d为样品厚度）<br><br>霍尔迁移率：<br>μ_H = |R_H| · σ = |R_H|/ρ</div>
<p><strong>霍尔系数的测量意义</strong>：</p>
<p>① 由R_H的符号判断导电类型（N型负，P型正）</p>
<p>② 由|R_H|计算载流子浓度 n = 1/(q|R_H|)</p>
<p>③ 霍尔系数与电导率结合得到霍尔迁移率</p>
<div class="warn"><strong>注意</strong>：严格来说，R_H = r_H/(qn)，其中r_H为霍尔因子（1~2），取决于散射机制。声学波散射时r_H = 3π/8 ≈ 1.18。实际中常忽略r_H，直接用R_H = 1/(qn)。</div>`},
{n:"变温Hall实验",s:"★★★★☆",exam:1,body:`<p><strong>变温Hall实验</strong>：测量不同温度下的霍尔系数R_H和电阻率ρ，是研究半导体掺杂和能带结构的重要实验。</p>
<div class="formula-box">N型半导体的R_H-T曲线（三段式）：<br><br>① 低温杂质电离区：<br>n ∝ exp(-E_D/2kT)，R_H急剧下降<br><br>② 杂质完全电离区（饱和区）：<br>n ≈ N_D - N_A ≈ 常数，R_H ≈ 常数<br><br>③ 高温本征激发区：<br>n ∝ T^(3/2)·exp(-E_g/2kT)，R_H → 0</div>
<p><strong>从实验数据获取信息</strong>：</p>
<p>① 从饱和区R_H值计算掺杂浓度：N_D - N_A = 1/(q|R_H|)</p>
<p>② 从ln(R_H·T^(3/2)) vs 1/T图的斜率求杂质电离能</p>
<p>③ 从ln(1/R_H) vs 1/T图的斜率求禁带宽度E_g</p>
<p>④ 从ρ(T)曲线的峰值位置判断补偿度</p>
<div class="tip"><strong>考研高频计算题</strong>：给出变温Hall数据，要求画R_H-T曲线、计算N_D和N_A、求E_g和E_D。关键：掌握三段式的物理图像。</div>`},
{n:"霍尔效应的多载流子模型",s:"★★★☆☆",body:`<p><strong>双载流子霍尔效应</strong>：当电子和空穴同时参与导电时（如本征半导体或窄禁带半导体），霍尔系数变为：</p>
<div class="formula-box">R_H = (1/q)·(pμ_p² - nμ_n²)/(pμ_p + nμ_n)²<br><br>本征半导体（n=p=n_i）：<br>R_H = (1/qn_i)·(μ_p - μ_n)/(μ_p + μ_n)·(1/(μ_p+μ_n))·(μ_p²-μ_n²)/(μ_p+μ_n)²<br><br>简化：R_H = (1/qn_i)·(μ_p²-μ_n²)/(μ_p+μ_n)²<br><br>因μ_n > μ_p，本征半导体的R_H < 0</div>
<p><strong>物理图像</strong>：电子和空穴在磁场中偏向同一侧，但电子偏转更强（因μ_n更大），所以霍尔系数的符号由电子决定，即使半导体是本征的。</p>
<p><strong>霍尔系数反转</strong>：在某些温度下，p型半导体的R_H可能从正变负——因为少子（电子）的迁移率贡献超过了多子（空穴）。这称为霍尔系数反转。</p>
<div class="warn"><strong>易错</strong>：本征半导体的R_H不是0！因为μ_n ≠ μ_p。只有当nμ_n² = pμ_p²时R_H才为0。</div>`},
{n:"磁阻效应",s:"★★★★☆",exam:1,body:`<p><strong>磁阻效应</strong>：在磁场中，半导体的电阻率增大。原因是载流子在洛伦兹力作用下发生偏转，有效漂移路径变长。</p>
<div class="formula-box">磁阻：<br>Δρ/ρ₀ = (ρ_B - ρ₀)/ρ₀ = ξ·(μH)²<br><br>其中 ξ 为磁阻系数（与样品几何有关）<br>μ 为迁移率，H 为磁场强度<br><br>几何磁阻：<br>长样品(l>>w)：Δρ/ρ₀ ≈ 0<br>短样品(l<<w)：Δρ/ρ₀ ≈ 0.3(μH)²</div>
<p><strong>物理机制</strong>：</p>
<p>① <strong>物理磁阻</strong>：载流子在磁场中做螺旋运动，有效漂移速度降低→电阻增大。与多能谷结构、各向异性散射有关</p>
<p>② <strong>几何磁阻</strong>：载流子偏转导致电流路径改变，样品几何形状影响磁阻大小</p>
<p><strong>磁阻的应用</strong>：磁阻传感器（磁头、磁编码器）、磁成像等。InSb的磁阻效应最强（μ_n ≈ 8 m²/Vs）。</p>
<div class="tip"><strong>规律</strong>：μ越大，磁阻效应越显著。InSb > GaAs > Ge > Si。</div>`},
{n:"半导体电阻率与掺杂",s:"★★★★★",exam:1,body:`<p><strong>电阻率公式</strong>：</p>
<div class="formula-box">ρ = 1/σ = 1/[q(nμ_n + pμ_p)]<br><br>N型（完全电离，忽略少子）：<br>ρ ≈ 1/(qN_Dμ_n)<br><br>P型（完全电离，忽略少子）：<br>ρ ≈ 1/(qN_Aμ_p)<br><br>补偿半导体：<br>ρ ≈ 1/[q(N_D-N_A)μ_n]（N型）<br>ρ ≈ 1/[q(N_A-N_D)μ_p]（P型）</div>
<p><strong>电阻率-掺杂浓度的列线图</strong>：实验上常用的工具图。已知电阻率可查掺杂浓度，反之亦然。</p>
<p><strong>例题</strong>：Si样品，ρ = 1 Ω·cm，由列线图查得 N_D ≈ 5×10¹⁵ cm⁻³。</p>
<p><strong>电阻率的温度依赖性</strong>：</p>
<p>① 低温：杂质部分电离，n较小，ρ较高</p>
<p>② 中温饱和区：杂质全电离，n≈常数，μ随T下降→ρ随T上升</p>
<p>③ 高温本征激发区：n_i急剧增大→ρ急剧下降</p>
<div class="warn"><strong>考试技巧</strong>：ρ-T曲线的转折点可以判断杂质电离能和禁带宽度。ρ的极小值出现在本征激发开始主导的温度。</div>`},
{n:"高场效应与速度饱和",s:"★★★★☆",exam:1,body:`<p><strong>低场欧姆区</strong>：电场较低时，v_d = μE，电流与电压成正比。</p>
<p><strong>高场效应</strong>：当电场增大到一定程度，v_d不再与E成正比，出现非线性。</p>
<div class="formula-box">速度-电场关系（两段近似）：<br><br>低场（E << E_c）：v_d = μE<br><br>高场（E >> E_c）：v_d → v_sat<br><br>经验公式：v_d = μE/[1+(μE/v_sat)^(1/β)]^(1/β)<br><br>Si：v_sat ≈ 1×10⁷ cm/s<br>GaAs：v_sat ≈ 0.7×10⁷ cm/s<br>E_c（Si）≈ 3×10⁴ V/cm</div>
<p><strong>速度饱和的原因</strong>：高能声子散射。载流子从电场获得的能量等于通过声学波和光学波散射损失的能量时，速度达到饱和。</p>
<p><strong>GaAs的负微分电导</strong>：GaAs中导带有主能谷(Γ)和子能谷(L)，当E增大使电子从Γ谷转移到L谷时，由于L谷的有效质量大、迁移率低，出现负微分电导(dJ/dE < 0)。</p>
<div class="info">GaAs的负微分电导是体效应器件（耿氏二极管）的基础，用于微波振荡器。</div>`},
{n:"热载流子效应",s:"★★★☆☆",body:`<p><strong>热载流子</strong>：在强电场下，载流子的平均能量（有效温度T_e）高于晶格温度（T_L）。此时载流子称为"热载流子"。</p>
<div class="formula-box">热载流子特征：<br>T_e = T_L + qEτ·v_d/(3k) ≈ T_L(1 + E²/E_c²)<br><br>热载流子的分布函数偏离平衡的麦克斯韦分布<br>高能尾巴增强→碰撞电离、热发射等效应</div>
<p><strong>热载流子效应的影响</strong>：</p>
<p>① <strong>速度过冲</strong>：在极短时间（<1ps）内，载流子速度可以超过稳态饱和速度。这是弹道输运的基础</p>
<p>② <strong>碰撞电离</strong>：高能载流子（E > E_i ≈ 1.5E_g）可以将价带电子激发到导带，产生电子-空穴对</p>
<p>③ <strong>热发射</strong>：热载流子可以越过势垒注入到栅氧化层中（MOS器件中的可靠性问题）</p>
<p>④ <strong>载流子加热</strong>：小尺寸器件中，沟道电场极强，热载流子效应是器件设计的重要限制因素</p>
<div class="warn"><strong>器件可靠性</strong>：MOSFET中的热载流子注入会导致阈值电压漂移和跨导退化，是VLSI的重要可靠性问题。</div>`},
{n:"声学波散射与光学波散射",s:"★★★★★",exam:1,body:`<p><strong>声学波散射</strong>（变形势散射）：</p>
<p>晶格纵向声学波→原子间距周期性压缩/拉伸→禁带宽度局部变化→形成势场扰动→散射载流子。</p>
<div class="formula-box">声学波散射弛豫时间：<br>τ_ac ∝ T^(-3/2)·E^(-1/2)<br><br>迁移率：<br>μ_ac ∝ T^(-3/2)·m*^(-5/2)<br><br>温度特征：T↑→μ↓（晶格振动增强→散射增强）</div>
<p><strong>光学波散射</strong>：光学声子（LO）能量较大（Si ~60meV，GaAs ~36meV），低温下冻结。只有在T > Θ_D/2时才显著。</p>
<div class="formula-box">极性光学波散射（GaAs中重要）：<br>1/μ_PO ∝ exp(ℏω_LO/kT) - 1<br><br>非极性光学波散射（Si/Ge中）：<br>1/μ_O ∝ T^(1/2)（高温近似）<br><br>GaAs室温：μ_PO是主要限制因素→μ_max ≈ 8500 cm²/(V·s)</div>
<p><strong>两种散射的对比</strong>：</p>
<table class="cmp"><tr><th>特征</th><th>声学波散射</th><th>光学波散射</th></tr><tr><td>声子能量</td><td>小（连续谱）</td><td>大（~30-60meV）</td></tr><tr><td>温度依赖</td><td>μ∝T^(-3/2)</td><td>低温冻结，高温∝T^(-1/2)~T^(-3/2)</td></tr><tr><td>主导材料</td><td>Si, Ge（主要）</td><td>GaAs（极性光学）</td></tr></table>
<div class="warn"><strong>易错</strong>：μ∝T^(-3/2)对应晶格散射主导的温区，不代表所有温区。低温下杂质散射主导→μ∝T^(3/2)。</div>`},
{n:"高场输运：速度过冲与弹道输运",s:"★★★★☆",body:`<p><strong>速度过冲（Velocity Overshoot）</strong>：在极短的时间/距离内，载流子速度超过稳态饱和速度v_sat的现象。</p>
<div class="formula-box">时间尺度：t_ov ~ m*v_sat/(qE) ≈ 0.1-1 ps<br>空间尺度：x_ov ~ v_sat × t_ov ≈ 10-100 nm<br><br>稳态饱和速度：<br>Si: v_sat ≈ 1×10⁷ cm/s<br>GaAs: v_sat ≈ 0.7×10⁷ cm/s</div>
<p><strong>物理解释</strong>：<br>1. 载流子在电场中加速→速度增加<br>2. 需要时间积累足够的光学声子散射才能达到稳态速度<br>3. 在散射尚未充分的短暂时间内，速度可超过v_sat<br>4. 这是弹道输运和快速器件的基础</p>
<p><strong>弹道输运</strong>：当器件尺寸L < 平均自由程λ时，载流子几乎不经历散射，电流由注入速度决定。</p>
<div class="formula-box">弹道判据：L < λ<br>Si室温 λ ~ 30 nm<br>GaAs室温 λ ~ 200 nm<br><br>弹道电流：J = qn·v_inj<br>v_inj ≈ √(2kT/πm*) ≈ v_th（热速度）</div>
<div class="tip"><strong>应用</strong>：亚10nm MOSFET、HEMT等器件已进入准弹道输运区域，经典漂移扩散模型不再适用，需要考虑速度过冲效应。</div>`},
{n:"负微分电导与Gunn效应",s:"★★★★☆",body:`<p><strong>负微分电导（NDC）</strong>：在某些材料中，当电场增大到一定程度后，电流反而减小的现象。dJ/dE < 0。</p>
<p><strong>Ridley-Watkins-Hilsum机制</strong>（转移电子效应）：</p>
<div class="formula-box">条件：<br>① 主能谷（Γ）有效质量小、迁移率高<br>② 副能谷（L/X）有效质量大、迁移率低<br>③ 副能谷能量仅比主能谷高ΔE（~0.2-0.5eV）<br><br>GaAs: ΔE(Γ→L) = 0.29eV<br>InP: ΔE(Γ→L) = 0.59eV<br><br>Gunn效应阈值场：E_th ~ 3-5 kV/cm</div>
<p><strong>物理过程</strong>：<br>1. 低场：电子主要在Γ能谷→高迁移率→大电流<br>2. E > E_th：电子获得足够能量→转移到L/X能谷<br>3. L/X能谷：迁移率低（m*大）→漂移速度下降→电流减小<br>4. dJ/dE < 0 → NDC</p>
<p><strong>Gunn振荡</strong>：NDC导致电畴形成→高场畴在器件中周期性运动→产生微波振荡。频率 f = v_sat/L（L为器件长度）。</p>
<div class="formula-box">Gunn振荡频率：<br>f ~ v_sat/L ≈ 10⁷/L [Hz]<br>L=10μm → f ≈ 10 GHz<br>L=5μm → f ≈ 20 GHz</div>
<div class="tip"><strong>应用</strong>：Gunn二极管是微波/毫米波振荡源的重要器件，广泛用于雷达、通信。</div>`},
{n:"迁移率的温度依赖性全图",s:"★★★★★",exam:1,body:`<p><strong>迁移率随温度变化的完整图像</strong>：在ln(μ) vs ln(T)图上呈现"倒V形"。</p>
<div class="formula-box">总迁移率（Matthiessen规则）：<br>1/μ_total = 1/μ_L + 1/μ_I<br><br>μ_L：晶格散射迁移率 ∝ T^(-3/2)<br>μ_I：电离杂质散射迁移率 ∝ T^(3/2)<br><br>极值温度（峰值迁移率）：<br>T_m：μ_L = μ_I 时的温度</div>
<p><strong>三个温区</strong>：<br>① 低温（T < T_m）：杂质散射主导 → μ随T升高而增大<br>② T = T_m：迁移率达到最大值<br>③ 高温（T > T_m）：晶格散射主导 → μ随T升高而减小</p>
<p><strong>典型值</strong>（Si中电子）：</p>
<table class="cmp"><tr><th>温度</th><th>限制因素</th><th>μ_e (cm²/Vs)</th></tr><tr><td>77K</td><td>杂质散射</td><td>~2000-4000</td></tr><tr><td>200K</td><td>两者相当</td><td>~1500（峰值附近）</td></tr><tr><td>300K</td><td>晶格散射</td><td>1400</td></tr><tr><td>400K</td><td>晶格散射</td><td>~800</td></tr></table>
<div class="warn"><strong>考研必考</strong>：迁移率温度依赖性是最高频考点。记住低温μ∝T^(3/2)、高温μ∝T^(-3/2)，极值处两者相等。</div>`},
{n:"半导体热电效应的微观机制",s:"★★★★☆",body:`<p><strong>塞贝克效应（Seebeck）</strong>的微观解释：</p>
<p>热端的载流子具有更高的平均动能→向冷端扩散→建立内建电场→达到动态平衡→温差电动势。</p>
<div class="formula-box">塞贝克系数（N型）：<br>S_n = -(k/q)[ln(N_c/N_D) + 5/2 + ξ]<br>ξ = (E_F - E_c)/(kT)<br><br>绝对值：|S| ~ 100-200 μV/K（半导体）<br>金属：|S| ~ 1-10 μV/K</div>
<p><strong>帕尔帖效应（Peltier）</strong>：电流通过两种不同导体的结面时，在结面处吸收或放出热量（可逆热效应）。</p>
<div class="formula-box">帕尔帖系数：<br>Π = S·T<br>吸/放热率：Q = Π·I = S·T·I</div>
<p><strong>汤姆逊效应</strong>：电流通过温度梯度中的均匀导体时的吸/放热。</p>
<div class="formula-box">汤姆逊系数：<br>τ_T = T·dS/dT<br>热流：q = τ_T·I·(dT/dx)</div>
<div class="tip"><strong>三种热电效应的关系</strong>：塞贝克=温差→电，帕尔帖=电→温差（热），汤姆逊=电流+温度梯度→热。三者通过Kelvin关系自洽。</div>`}
],

// ============ Chapter 5: 非平衡载流子 ============
{title:"第5章 非平衡载流子",sub:"产生、复合与扩散运动",tag:"核心章节",kps:[
{n:"非平衡载流子的产生",s:"★★★★★",exam:1,body:`<p><strong>非平衡载流子</strong>：偏离热平衡状态时，载流子浓度超过平衡值的多余部分。用Δn和Δp表示。</p>
<div class="formula-box">产生方式：<br>① 光注入：hν > E_g → 光生电子-空穴对<br>② 电注入：PN结正偏、碰撞电离<br>③ 高能粒子辐照<br><br>小注入条件：Δn << n₀（或Δp << p₀）<br>大注入条件：Δn ≈ Δp >> n₀<br><br>产生率 G（单位时间单位体积产生的载流子对数）</div>
<p><strong>小注入的重要性</strong>：大多数半导体器件工作在小注入条件下。此时多数载流子浓度几乎不变（Δn << n₀），少数载流子浓度变化显著，因此非平衡载流子问题本质上是少子问题。</p>
<div class="tip"><strong>核心概念</strong>：产生速率G和复合速率R的平衡决定了Δn和Δp的大小。热平衡时G₀ = R₀；光照时G = G₀ + G_L，额外的Δn = G_L·τ。</div>`},
{n:"非平衡载流子的复合",s:"★★★★★",exam:1,body:`<p><strong>复合机制</strong>：多余的非平衡载流子通过复合过程消失，系统恢复热平衡。</p>
<div class="formula-box">三种基本复合机制：<br><br>① 直接复合（带间复合）：<br>R = r·n·p（r为复合系数）<br>Δn随时间变化：dΔn/dt = G - r[(n₀+p₀)Δn + Δn²]<br>寿命：τ = 1/[r(n₀+p₀)]<br><br>② 间接复合（Shockley-Read-Hall复合）：<br>通过禁带中的深能级缺陷进行<br>是Si、Ge中的主要复合机制<br><br>③ 俄歇复合（Auger）：<br>三个粒子参与，高注入时重要</div>
<p><strong>直接复合</strong>：导带电子直接跃迁到价带与空穴复合，释放光子。在直接带隙半导体（GaAs）中重要。</p>
<p><strong>间接复合（SRH）</strong>：电子先被深能级陷阱俘获，再与价带空穴复合。分四步：①电子俘获②电子发射③空穴俘获④空穴发射。</p>
<div class="warn"><strong>重点</strong>：Si和Ge是间接带隙，带间直接复合概率很低，SRH复合是主要机制。GaAs是直接带隙，辐射复合概率高。</div>`},
{n:"Shockley-Read-Hall复合",s:"★★★★★",exam:1,body:`<p><strong>SRH复合</strong>：通过禁带中的深能级缺陷（复合中心）进行的复合过程，是间接带隙半导体中最重要的复合机制。</p>
<div class="formula-box">SRH复合速率：<br>U = [np - ni²] / [τ_p(n+n₁) + τ_n(p+p₁)]<br><br>其中：<br>n₁ = N_c·exp(-(E_c-E_t)/kT) = ni·exp((E_t-E_i)/kT)<br>p₁ = N_v·exp(-(E_t-E_v)/kT) = ni·exp((E_i-E_t)/kT)<br>τ_n = 1/(σ_n·v_th·N_t) — 电子俘获时间<br>τ_p = 1/(σ_p·v_th·N_t) — 空穴俘获时间<br><br>小注入简化（n₀ >> p₀, Δn << n₀）：<br>U ≈ Δn/τ<br>τ = τ_p + τ_n（近似，当E_t ≈ E_i时）</div>
<p><strong>深能级位置的影响</strong>：</p>
<p>① 当E_t = E_i（禁带中央）时，复合效率最高</p>
<p>② E_t偏离禁带中央越远，复合效率越低，趋向于成为陷阱（只俘获一种载流子再发射回去）</p>
<div class="tip"><strong>考研必考</strong>：SRH理论的U公式推导过程，以及为什么禁带中央的深能级是最有效的复合中心。</div>`},
{n:"少子寿命",s:"★★★★★",exam:1,body:`<p><strong>少子寿命</strong>：非平衡少子从产生到复合消失的平均存活时间，用τ表示。</p>
<div class="formula-box">寿命的物理意义：<br>Δp(t) = Δp(0)·exp(-t/τ)<br><br>复合速率：<br>R = Δp/τ<br><br>产生率=复合率时的稳态：<br>G_L = Δp/τ → Δp = G_L·τ</div>
<p><strong>影响寿命的因素</strong>：</p>
<p>① <strong>掺杂浓度</strong>：杂质可充当复合中心，N_t越大τ越小</p>
<p>② <strong>深能级杂质</strong>：Au在Si中是有效的复合中心，τ∝1/N_Au</p>
<p>③ <strong>温度</strong>：影响n₁和p₁，从而影响复合速率</p>
<p>④ <strong>缺陷密度</strong>：位错、晶界等也是复合中心</p>
<p>⑤ <strong>注入水平</strong>：大注入时俄歇复合变得重要，有效寿命降低</p>
<div class="info">Si的典型寿命：高纯Si约1ms，集成电路级Si约1-10μs，太阳电池级Si约10-100μs。</div>`},
{n:"俄歇复合",s:"★★★☆☆",body:`<p><strong>俄歇复合（Auger Recombination）</strong>：三个载流子参与的非辐射复合过程。复合释放的能量不以光子形式发射，而是传递给第三个载流子（使其跃迁到更高能态），随后通过声子散射释放热量。</p>
<div class="formula-box">俄歇复合速率：<br>R_A = (C_n·n + C_p·p)(np - ni²)<br><br>N型主导：<br>τ_A ≈ 1/(C_n·n₀²)<br><br>P型主导：<br>τ_A ≈ 1/(C_p·p₀²)<br><br>本征：<br>τ_A ≈ 1/(C_n+C_p)ni²<br><br>C_n ≈ 2.8×10⁻³¹ cm⁶/s（Si中的电子）</div>
<p><strong>重要性</strong>：</p>
<p>① 高掺杂（N > 10¹⁸ cm⁻³）时，俄歇复合成为主要复合机制</p>
<p>② 大注入时（Δn >> n₀），τ_A ∝ 1/(Δn²)，有效寿命急剧降低</p>
<p>③ 对太阳电池和LED效率有重要影响（高注入区域的非辐射损失）</p>
<div class="info">俄歇复合是LED效率下降（droop效应）的主要原因之一。</div>`},
{n:"连续性方程",s:"★★★★★",exam:1,body:`<p><strong>连续性方程</strong>：描述非平衡载流子在空间和时间上的变化规律，是半导体器件物理的基本方程。</p>
<div class="formula-box">空穴的连续性方程：<br>∂p/∂t = G - U + (1/q)·∇·J_p<br>= G - Δp/τ - μ_p·E·(∂Δp/∂x) + D_p·(∂²Δp/∂x²)<br><br>电子的连续性方程：<br>∂n/∂t = G - U - (1/q)·∇·J_n<br>= G - Δn/τ + μ_n·E·(∂Δn/∂x) + D_n·(∂²Δn/∂x²)<br><br>各项含义：<br>G — 产生率<br>−U = −Δp/τ — 复合率<br>D·∂²Δp/∂x² — 扩散项<br>μE·∂Δp/∂x — 漂移项</div>
<p><strong>简化情况</strong>：</p>
<p>① <strong>稳态</strong>（∂/∂t = 0）：产生 = 复合 + 净流出</p>
<p>② <strong>纯扩散</strong>（无电场）：D·(d²Δp/dx²) - Δp/τ = 0</p>
<p>③ <strong>纯漂移</strong>（无浓度梯度）：μE·(dΔp/dx) - Δp/τ = 0</p>
<div class="tip"><strong>考研必背</strong>：连续性方程的完整形式。特别注意扩散项和漂移项的符号：空穴的扩散项为正(D·∂²Δp/∂x²)，电子的漂移项前有负号。</div>`},
{n:"扩散方程与少子扩散长度",s:"★★★★★",exam:1,body:`<p><strong>稳态扩散方程</strong>（无电场，均匀产生率）：</p>
<div class="formula-box">D_p·(d²Δp/dx²) - Δp/τ_p = 0<br><br>通解：Δp(x) = A·exp(-x/L_p) + B·exp(x/L_p)<br><br>少子扩散长度：<br>L_p = √(D_p·τ_p)<br>L_n = √(D_n·τ_n)<br><br>爱因斯坦关系：<br>D/μ = kT/q = V_T（热电压，室温≈26mV）</div>
<p><strong>扩散长度的物理意义</strong>：L_p是注入少子在复合前能扩散的平均距离。Δp(x) = Δp₀·exp(-x/L_p)表示经过距离L_p后，浓度降到注入值的1/e。</p>
<p><strong>典型值</strong>：</p>
<table class="cmp"><tr><th>参数</th><th>Si（τ=10μs）</th><th>GaAs（τ=1ns）</th></tr><tr><td>D_n</td><td>~35 cm²/s</td><td>~220 cm²/s</td></tr><tr><td>L_n</td><td>~60 μm</td><td>~0.5 μm</td></tr></table>
<div class="warn"><strong>易错</strong>：D_n ≠ D_p（一般D_n > D_p），因为μ_n > μ_p且D/μ = kT/q（爱因斯坦关系）。</div>`},
{n:"表面复合与表面复合速度",s:"★★★☆☆",body:`<p><strong>表面复合</strong>：半导体表面存在大量悬挂键和表面缺陷，这些缺陷能级在禁带中充当有效的复合中心。表面处的复合速率远高于体内。</p>
<div class="formula-box">表面复合速率：<br>R_s = s·Δp_s<br><br>s = σ_s·v_th·N_st<br>s — 表面复合速度（cm/s）<br>σ_s — 表面缺陷的俘获截面<br>N_st — 表面态密度<br><br>边界条件（半无限大样品x=0处）：<br>D_p·(∂Δp/∂x)|_{x=0} = s·Δp(0)</div>
<p><strong>表面复合对少子扩散的影响</strong>：有效扩散长度减小。</p>
<div class="formula-box">有限厚度样品（厚度W）的有效扩散长度：<br>1/L_eff² = 1/L_p² + (s/D_p)²（近似）<br><br>当s→0：L_eff → L_p（体内限制）<br>当s→∞：L_eff → 0（表面限制）</div>
<p><strong>实际意义</strong>：</p>
<p>① 太阳电池需要低表面复合（钝化）来提高效率</p>
<p>② 表面钝化技术：SiO₂/Si、SiN_x、Al₂O₃等</p>
<p>③ 扩散长度的测量（光电导衰退法、表面光电压法）受表面复合影响</p>
<div class="tip"><strong>考研简答题</strong>：表面复合的物理机制及减少表面复合的方法。</div>`},
{n:"准费米能级与准平衡",s:"★★★★☆",exam:1,body:`<p><strong>准费米能级</strong>：在非平衡状态下，电子和空穴不再共享统一的费米能级。分别定义电子准费米能级E_Fn和空穴准费米能级E_Fp。</p>
<div class="formula-box">n = N_c·exp(-(E_c-E_Fn)/kT)<br>p = N_v·exp(-(E_Fp-E_v)/kT)<br><br>非平衡时：E_Fn ≠ E_Fp<br><br>注入水平：<br>np = ni²·exp((E_Fn-E_Fp)/kT) = ni²·exp(qV/kT)<br><br>V = (E_Fn-E_Fp)/q — 准费米能级的分裂</div>
<p><strong>准费米能级的分布</strong>：</p>
<p>① 在PN结空间电荷区中，E_Fn和E_Fp的变化不同步</p>
<p>② 电子准费米能级E_Fn在N区平坦，在P区变化</p>
<p>③ 空穴准费米能级E_Fp在P区平坦，在N区变化</p>
<p>④ 在正向偏压下，E_Fn - E_Fp = qV（V为外加偏压）</p>
<div class="warn"><strong>重要</strong>：准费米能级在能带图中是水平线（只要该区域载流子处于准平衡）。只有在强复合区（空间电荷区），E_Fn和E_Fp才有显著变化。</div>`},
{n:"扩散电流与爱因斯坦关系",s:"★★★★★",exam:1,body:`<p><strong>扩散电流</strong>：载流子浓度存在梯度时，即使没有电场也会有定向运动，形成扩散电流。</p>
<div class="formula-box">扩散电流密度：<br>J_n_diff = q·D_n·(dn/dx) — 电子扩散<br>J_p_diff = -q·D_p·(dp/dx) — 空穴扩散<br><br>注意空穴扩散电流方向与梯度方向相反<br><br>总电流（电子）：<br>J_n = qnμ_nE + qD_n(dn/dx) — 漂移+扩散<br><br>总电流（空穴）：<br>J_p = qpμ_pE - qD_p(dp/dx)</div>
<p><strong>爱因斯坦关系</strong>：扩散系数D和迁移率μ之间的基本关系：</p>
<div class="formula-box">D/μ = kT/q = V_T ≈ 0.026V（室温）<br><br>D_n = (kT/q)·μ_n<br>D_p = (kT/q)·μ_p<br><br>本质：热平衡时，漂移电流与扩散电流精确平衡</div>
<div class="tip"><strong>推导思路</strong>：在热平衡、无外加电场的n型半导体中，杂质浓度梯度引起少子（空穴）的扩散；平衡要求总空穴电流为0，由此导出D/μ = kT/q。</div>`},
{n:"光电导效应",s:"★★★★☆",exam:1,body:`<p><strong>光电导效应</strong>：光照使半导体中产生非平衡载流子，电导率增大。</p>
<div class="formula-box">光电导：<br>Δσ = q(μ_n·Δn + μ_p·Δp)<br><br>小注入（N型）：<br>Δσ ≈ q·μ_n·Δn<br><br>本征光电导：<br>Δn = Δp = G_L·τ_eff<br><br>τ_eff = 有效寿命（考虑少子陷阱效应后）<br><br>光电导增益：<br>g = τ/τ_tr = τ·μ·V/L²<br>τ_tr = L²/(μV) — 渡越时间</div>
<p><strong>光电导的应用</strong>：</p>
<p>① 光敏电阻（LDR）：CdS、CdSe等</p>
<p>② 红外探测器：InSb、HgCdTe等</p>
<p>③ 光电导衰退法测量少子寿命</p>
<p><strong>陷阱效应</strong>：深能级杂质可能俘获一种载流子而不立即复合，导致该载流子的寿命远大于另一种。有效寿命由两种载流子共同决定。</p>
<div class="warn"><strong>光电导增益</strong>可以远大于1！当τ >> τ_tr时，一个光生载流子在被复合前可以多次通过外电路，产生多个电子的电流贡献。</div>`},
{n:"扩散方程的典型解",s:"★★★★☆",exam:1,body:`<p><strong>典型边界条件与解</strong>：</p>
<p><strong>情况1：表面稳态注入</strong>（x=0处注入，x→∞时Δp→0）</p>
<div class="formula-box">Δp(x) = Δp(0)·exp(-x/L_p)<br>J_p(x) = (qD_p/L_p)·Δp(0)·exp(-x/L_p)<br>总少子电荷：Q = q·A·L_p·Δp(0)<br>总扩散电流：I = qAD_pΔp(0)/L_p = Q/(L_p²/D_p) = Q/τ</div>
<p><strong>情况2：均匀产生、表面复合</strong>（光电导衰退实验）</p>
<div class="formula-box">产生率G_L均匀，x=0处表面复合速度s<br>稳态：Δp(x) = G_L·τ·[1 - exp(-x/L_p)]<br>+ 边界修正项</div>
<p><strong>情况3：有限厚度W的样品</strong></p>
<div class="formula-box">x=0注入，x=W处Δp=0（或s→∞）：<br>Δp(x) = Δp(0)·sinh[(W-x)/L_p]/sinh(W/L_p)<br><br>W << L_p时：Δp ≈ Δp(0)·(1-x/W)<br>（线性分布，扩散限制）</div>
<div class="tip"><strong>考研计算题高频</strong>：给定边界条件求解扩散方程，计算少子分布、扩散电流等。关键在于正确应用边界条件。</div>`},
{n:"辐射复合与辐射效率",s:"★★★★☆",body:`<p><strong>辐射复合</strong>：导带电子与价带空穴复合时释放光子的过程。也称带间辐射复合。</p>
<div class="formula-box">直接复合速率：<br>R_rad = r·n·p（直接带隙半导体）<br><br>r（复合系数）：<br>GaAs: r ≈ 7.2×10⁻¹⁰ cm³/s<br>Si: r ≈ 1.1×10⁻¹⁴ cm³/s（差4个数量级！）<br><br>内量子效率：<br>η_int = R_rad/(R_rad + R_nonrad)<br>= 1/(1 + τ_rad/τ_nr)</div>
<p><strong>辐射效率的决定因素</strong>：</p>
<p>① <strong>直接vs间接带隙</strong>：直接带隙→r大→τ_rad短→η高</p>
<p>② <strong>杂质浓度</strong>：高掺杂引入非辐射复合中心→η降低</p>
<p>③ <strong>注入水平</strong>：低注入时SRH复合占主导，高注入时辐射复合占主导</p>
<p>④ <strong>温度</strong>：高温增强非辐射过程（声子辅助），η降低</p>
<div class="formula-box">GaAs的辐射效率：<br>低掺杂：η > 90%（室温）<br>高掺杂(10¹⁸)：η ~ 30-50%<br>超辐射条件：高注入→η→1</div>
<div class="info">InGaN量子阱（蓝光LED）的内量子效率可达80%+，是目前最高效的固态发光材料。</div>`},
{n:"表面光电压法(SPV)",s:"★★★☆☆",body:`<p><strong>表面光电压（SPV）</strong>：光照在半导体表面产生光生载流子，被表面电场分离→产生表面光电压。</p>
<div class="formula-box">SPV原理：<br>① 光照→电子-空穴对产生<br>② 表面内建电场分离光生载流子<br>③ 表面电荷变化→光电压<br><br>SPV信号与扩散长度的关系：<br>ΔV_SPV ∝ L_p（当L_p < 1/α时）<br>1/α：光吸收深度<br><br>测量方法：<br>变波长SPV → 1/ΔV vs 1/(α·L_p)线性拟合 → 求L_p</div>
<p><strong>SPV法的优势</strong>：</p>
<p>① 非接触测量（不需要制作电极）</p>
<p>② 无损检测（适合生产线质量控制）</p>
<p>③ 可测量整个晶圆的少子寿命分布</p>
<p>④ 精度高（±5%）</p>
<div class="info">SPV法是太阳电池和集成电路用硅片质量评估的重要工具。测量范围：L_p从几μm到几mm。</div>`},
{n:"光电导衰退法测寿命",s:"★★★★☆",exam:1,body:`<p><strong>光电导衰退法</strong>：利用光照停止后光电导的衰减来测量少子寿命。</p>
<div class="formula-box">原理：<br>① 脉冲光照产生非平衡载流子 → 电导增大<br>② 光照停止 → 载流子按指数衰减<br>Δσ(t) = Δσ(0)·exp(-t/τ_eff)<br>③ 测量衰减时间常数 → τ_eff<br><br>ΔR/R ∝ Δn/n₀（小信号近似）<br>R为样品电阻</div>
<p><strong>衰减曲线分析</strong>：</p>
<div class="formula-box">纯指数衰减（单一τ）：<br>表面复合可忽略时的体内寿命<br><br>非指数衰减：<br>多种复合机制共存<br>多指数拟合可分离不同机制<br><br>典型情况：<br>初期快衰减（表面复合）<br>后期慢衰减（体内复合）<br>→ 后期斜率给出τ_body</div>
<p><strong>寿命测量的三种配置</strong>：</p>
<p>① <strong>体寿命测量</strong>：大面积均匀光照+表面钝化</p>
<p>② <strong>有效寿命测量</strong>：不钝化表面（包含表面复合）</p>
<p>③ <strong>微波光电导衰退（μ-PCD）</strong>：微波检测电阻变化，非接触</p>
<div class="tip"><strong>考研实验题</strong>：μ-PCD法是当前工业界测量Si晶圆少子寿命的标准方法。理解其原理和数据处理方法是考研实验题的重点。</div>`},
{n:"大注入下的复合与准费米能级",s:"★★★★☆",body:`<p><strong>大注入条件</strong>：Δn ≈ Δp >> n₀（对于N型半导体）。此时不能再忽略少子对多子分布的影响。</p>
<div class="formula-box">大注入时的SRH复合简化：<br>U = ni/τ_eff<br><br>有效寿命：<br>τ_eff = τ_n + τ_p（与注入水平无关）<br><br>小注入时：<br>U ≈ Δn/τ_p（N型，τ_eff ≈ τ_p）<br><br>大注入时：<br>τ_eff增大到(τ_n+τ_p) → 有效寿命增大</div>
<p><strong>大注入的准费米能级</strong>：</p>
<div class="formula-box">注入点处准费米能级分裂：<br>E_Fn - E_Fp = qV = kT·ln(np/ni²)<br><br>小注入：E_Fn - E_Fp ≈ kT·ln(Δn/n₀)（小）<br>大注入：E_Fn - E_Fp ≈ kT·ln(Δn²/ni²)（大）<br><br>准费米能级斜率给出扩散电流：<br>J_p = qp·μ_p·dE_Fp/dx</div>
<p><strong>大注入下的光电导</strong>：</p>
<div class="formula-box">Δσ = q(μ_n + μ_p)·Δn<br>（因Δn = Δp且两者都很大）<br><br>比小注入（Δσ ≈ qμ_n·Δn）增大(1+μ_p/μ_n)倍</div>
<div class="info">在功率器件（如IGBT）和太阳电池中，器件经常工作在大注入条件下。理解大注入效应对于器件建模非常重要。</div>`},
{n:"少子寿命的工程控制",s:"★★★★☆",body:`<p><strong>工程控制少子寿命的方法</strong>：</p>
<p>① <strong>金（Au）扩散</strong>：</p>
<div class="formula-box">Au在Si中引入两个能级：<br>E_c - 0.54eV（受主型，有效复合中心）<br>E_v + 0.35eV（施主型）<br><br>τ ≈ 1/(σ·v_th·N_Au) ≈ 4.8×10⁻⁷/N_Au（μs·cm³）<br>N_Au单位：cm⁻³<br><br>控制Au浓度→精确控制τ</div>
<p>② <strong>电子辐照</strong>：</p>
<div class="formula-box">高能电子（1-15MeV）轰击Si<br>→ 产生空位-杂质复合体（E中心等）<br>→ 深能级作为复合中心<br><br>辐照损伤的退火：<br>200°C退火：A-center（V-O）恢复<br>350°C退火：E-center（V-P）恢复<br>500°C以上：大部分损伤恢复</div>
<p>③ <strong>质子/氦离子注入</strong>：局部引入损伤→局部控制寿命</p>
<p>④ <strong>外延层质量</strong>：CVD外延生长的Si层缺陷密度低，τ可达1ms以上</p>
<div class="info">太阳电池工艺中需要高τ（少子扩散长度长→高收集效率），而功率器件有时需要低τ（减小反向恢复时间）。因此寿命控制是器件工艺的重要环节。</div>`},
{n:"载流子注入比与注入效率",s:"★★★☆☆",body:`<p><strong>注入比</strong>：在PN结正偏时，电子注入电流与空穴注入电流的比值。</p>
<div class="formula-box">注入比：<br>γ = I_n/(I_n + I_p) = J_n/(J_n + J_p)<br><br>对于突变结：<br>J_n ∝ D_n·n_p0/L_n ∝ D_n·ni²/(L_n·N_A)<br>J_p ∝ D_p·p_n0/L_p ∝ D_p·ni²/(L_p·N_D)<br><br>γ = [D_n·L_p·N_D]/[D_n·L_p·N_D + D_p·L_n·N_A]<br><br>高注入效率条件：<br>N_D >> N_A（N⁺P结构）<br>或 N_A >> N_D（P⁺N结构）<br>→ 重掺杂侧注入效率高</div>
<p><strong>提高注入效率的方法</strong>：</p>
<p>① 提高掺杂浓度比：N⁺/N >> 1</p>
<p>② 使用异质结：ΔE_c限制少子反注入→γ→1</p>
<p>③ 减小表面复合（接触区钝化）</p>
<div class="warn"><strong>高掺杂效应</strong>：当掺杂浓度很高时，带隙变窄（bandgap narrowing）效应使有效ni增大，反而降低注入效率。这是BJT中注入效率随N_E增大先升后降的原因。</div>`}
],
