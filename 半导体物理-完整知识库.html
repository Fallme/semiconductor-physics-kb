// ===== 第11章 半导体的热电性质 =====
{title:"第11章 半导体的热电性质",sub:"塞贝克效应、帕尔帖效应、热导率",tag:"热电效应",kps:[
{n:"热电效应的一般描述",s:"★★★★☆",body:`<p><strong>三种热电效应</strong>：</p>
<div class="formula-box">① 塞贝克效应（Seebeck）：<br>温差→电压（热电偶原理）<br>S = dV/dT<br><br>② 帕尔帖效应（Peltier）：<br>电流→吸热/放热（制冷原理）<br>Π = S·T<br><br>③ 汤姆逊效应（Thomson）：<br>电流+温差梯度→吸热/放热<br>τ = T·dS/dT</div>
<p><strong>开尔文关系</strong>：</p>
<div class="formula-box">Π = S·T（第一开尔文关系）<br>τ = T·dS/dT（第二开尔文关系）<br><br>这三个效应通过S相互关联<br>知道S(T)即可确定所有热电性质</div>
<div class="tip"><strong>通俗理解</strong>：塞贝克是"温差生电"，帕尔帖是"电流制冷"，汤姆逊是前两者的"补充效应"。三者本质都是载流子在温度梯度下的行为。</div>`},
{n:"半导体的温差电动势率（塞贝克系数）",s:"★★★★★",exam:1,body:`<p><strong>塞贝克系数</strong>（热电势）：单位温差产生的电动势。</p>
<div class="formula-box">N型半导体：<br>S = -(k/q)·[(E_c-E_F)/kT + A]<br>A ≈ 2-4（取决于散射机制）<br>S < 0<br><br>P型半导体：<br>S = (k/q)·[(E_F-E_v)/kT + A]<br>S > 0<br><br>高温（本征激发）：<br>S = -(k/q)·[(E_g/2kT) + (3/4)·ln(m_p*/m_n*)]</div>
<p><strong>两种载流子的温差电动势率</strong>：</p>
<div class="formula-box">同时存在电子和空穴时：<br>S = (σ_n·S_n + σ_p·S_p)/(σ_n + σ_p)<br><br>本征半导体：σ_n ≈ σ_p<br>→ S ≈ (k/q)·(3/4)·ln(m_p*/m_n*)<br>→ S很小（正负抵消）</div>
<div class="warn"><strong>易错</strong>：本征半导体的塞贝克系数很小，因为电子和空穴贡献相反。好的热电材料需要掺杂使S_n或S_p占主导。</div><div class="tip"><strong>通俗理解</strong>：塞贝克效应就像“温差发电”——半导体两端温度不同时，载流子从热端向冷端扩散，产生电压。塞贝克系数描述每度温差能产生多少电压，它取决于载流子类型和浓度，是热电材料的核心参数。</div>`},
{n:"帕尔帖效应与热电制冷",s:"★★★★☆",body:`<p><strong>帕尔帖效应</strong>：电流通过两种不同导体的结时，结处产生吸热或放热现象。</p>
<div class="formula-box">帕尔帖系数：<br>Π = S·T<br><br>帕尔帖热功率：<br>Q = Π·I = S·T·I<br><br>制冷效率（COP）：<br>COP = Q_c/W = Q_c/(Q_h - Q_c)<br>Q_c = 冷端吸热量<br>Q_h = 热端放热量</div>
<p><strong>热电制冷器（TEC）</strong>：<br>• 多对P-N热电偶串联<br>• 冷端降温，热端散热<br>• 最大温差：ΔT_max ~ 70K（Bi₂Te₃）</p>
<div class="tip"><strong>应用</strong>：激光器温度稳定（光通信）、CCD散热（天文望远镜）、便携式冰箱、CPU局部冷却。</div>`},
{n:"半导体的热导率",s:"★★★★☆",body:`<p><strong>热导率</strong>：材料传导热量的能力。</p>
<div class="formula-box">κ = κ_e + κ_L<br><br>κ_e = 电子热导率（载流子携带热量）<br>κ_L = 晶格热导率（声子携带热量）<br><br>Wiedemann-Franz定律：<br>κ_e/σ = L·T<br>L = 洛伦兹数 = π²k²/(3q²) ≈ 2.44×10⁻⁸ WΩ/K²</div>
<p><strong>声子对热导率的贡献</strong>：</p>
<div class="formula-box">κ_L = (1/3)·C_v·v·l_ph<br>C_v = 声子比热<br>v = 声子平均速度<br>l_ph = 声子平均自由程<br><br>声子散射机制：<br>① 边界散射（低温主导）<br>② 杂质散射<br>③ 声子-声子散射（U过程，高温主导）</div>
<div class="info">κ_L与温度关系：低温随T³增长（边界散射），高温随1/T减小（U过程散射增强）。</div>`},
{n:"半导体的汤姆逊效应",s:"★★★☆☆",body:`<p><strong>汤姆逊效应</strong>：当电流通过有温度梯度的导体时，导体除了产生焦耳热外，还额外吸热或放热。</p>
<div class="formula-box">汤姆逊系数：<br>τ = T·dS/dT<br><br>汤姆逊热功率密度：<br>q_T = -τ·J·(dT/dx)<br>J = 电流密度<br>dT/dx = 温度梯度<br><br>物理意义：<br>τ > 0：电流沿温度梯度方向→吸热<br>τ < 0：电流沿温度梯度方向→放热</div>
<div class="tip"><strong>实际意义</strong>：汤姆逊效应通常比塞贝克效应和帕尔帖效应小得多，在工程应用中常被忽略。但在精密热电测量中需要考虑。</div>`},
{n:"声子和杂质对热导率的贡献",s:"★★★☆☆",body:`<p><strong>声子散射机制</strong>对热导率的影响：</p>
<div class="formula-box">Matthiessen定则：<br>1/l_ph = 1/l_B + 1/l_imp + 1/l_U<br><br>l_B = 边界散射自由程（与样品尺寸相关）<br>l_imp = 杂质散射自由程<br>l_U = Umklapp散射自由程<br><br>高温极限：<br>κ_L ∝ M·θ_D³/(γ²·N^{2/3}·T)<br>M = 平均原子质量<br>θ_D = 德拜温度<br>γ = 格林艾森参数<br>N = 原子密度</div>
<p><strong>降低热导率的策略</strong>（热电材料设计）：<br>① 合金散射：原子质量差异散射声子<br>② 纳米结构：界面散射声子<br>③ 笼状化合物："rattler"原子散射声子</p>
<div class="info">理想的热电材料需要"电子晶体-声子玻璃"——像晶体一样导电（高σ），像玻璃一样隔热（低κ_L）。</div>`},
{n:"半导体热电效应的应用",s:"★★★☆☆",body:`<p><strong>热电材料的性能指标</strong>：</p>
<div class="formula-box">热电优值：<br>ZT = S²σT/κ<br><br>ZT > 1：较好的热电材料<br>ZT > 3：实用化的门槛<br><br>S²σ称为功率因子<br>需要同时优化S和σ（但两者相互制约）</div>
<p><strong>高性能热电材料</strong>：</p>
<table class="cmp"><tr><th>材料</th><th>ZT</th><th>温度范围</th></tr><tr><td>Bi₂Te₃</td><td>~1</td><td>室温附近</td></tr><tr><td>PbTe</td><td>~2</td><td>500-900K</td></tr><tr><td>SiGe</td><td>~1</td><td>900-1300K</td></tr><tr><td>SnSe</td><td>~2.6</td><td>~900K</td></tr></table>
<p><strong>应用领域</strong>：<br>① <strong>废热回收</strong>：汽车尾气、工业余热发电<br>② <strong>热电制冷</strong>：精密温控、激光器稳定<br>③ <strong>航天电源</strong>：放射性同位素热电发生器（RTG）</p>
<div class="tip"><strong>考研简答题</strong>：解释为什么半导体的热电势远大于金属（S半导体~mV/K，S金属~μV/K）。</div>`}
,
{n:"帕尔帖效应与热电制冷应用",s:"★★★★☆",exam:1,body:`<p><strong>帕尔帖制冷器</strong>的优化设计：</p>
<div class="formula-box">制冷量：Q_c = Π·I - ½I²R - K·ΔT<br>Π = S_p-S_n（温差电动势率差）<br>R = 总电阻<br>K = 总热导<br><br>最大制冷温差：<br>ΔT_max = (ZT+1)/2 · T_c<br>ZT = S²σT/κ<br><br>最大制冷效率：<br>COP_max = (T_c/ΔT)·(√(1+ZT)-T_h/T_c)/(√(1+ZT)+1)</div>
<p><strong>热电制冷器设计原则</strong>：<br>• 冷端温度T_c越低→效率越低→需要多级级联<br>• 高ZT材料→高COP<br>• 低热导率→减少热泄漏<br>• 优化几何形状→L/A比最优</p>
<div class="info">商业TEC（热电制冷器）通常使用Bi₂Te₃材料，单级最大温差约70K，多级可达150K以上。</div><div class="tip"><strong>通俗理解</strong>：帕尔帖效应是塞贝克效应的“反面”——给两种不同半导体的接头通电，一侧吸热（变冷）另一侧放热（变热）。就像冰箱的压缩机，但没有运动部件。通过控制电流大小就能精确控温，广泛用于激光器和芯片散热。</div>`},
{n:"塞贝克系数的散射机制依赖性",s:"★★★☆☆",body:`<p><strong>散射机制对塞贝克系数的影响</strong>：</p>
<div class="formula-box">散射因子A的取值：<br>声学波散射（非简并）：A = 2<br>电离杂质散射：A = 4<br>光学波散射：A ≈ 0-2<br><br>总塞贝克系数：<br>S = -(k/q)[(E_c-E_F)/kT + A]</div>
<p><strong>简并半导体的塞贝克系数</strong>：</p>
<div class="formula-box">Mott公式（简并）：<br>S = -(π²k²T)/(3q)·[d(lnσ(E))/dE]_{E=E_F}<br><br>S ∝ T（线性关系，与非简并不同）</div>
<div class="tip"><strong>关键区别</strong>：非简并半导体S ∝ 1/T（高温减小），简并半导体S ∝ T（高温增大）。</div>`},
{n:"热电材料的优化策略",s:"★★★★☆",body:`<p><strong>功率因子优化</strong>：</p>
<div class="formula-box">S²σ优化：<br>掺杂优化：E_F接近迁移率边<br>最优载流子浓度 ~ 10¹⁹-10²⁰ cm⁻³<br><br>能带工程：<br>• 能量过滤：势垒过滤低能载流子→增大S<br>• 多能谷输运：增加态密度有效质量→增大S</div>
<p><strong>热导率降低策略</strong>：</p>
<div class="formula-box">全尺度声子散射：<br>• 点缺陷散射短波声子<br>• 纳米结构散射中波声子<br>• 晶界散射长波声子</div>
<div class="info">SnSe单晶在923K时ZT达到2.6，是目前已知最高的热电优值。</div>`},
{n:"热电效应的微观理论",s:"★★★☆☆",body:`<p><strong>半导体热电效应的统计力学描述</strong>：</p>
<div class="formula-box">绝对温差电动势率：<br>S = -(k/q)·[F_{r+1}(η)/F_r(η) - η]<br>F_r(η) = 费米-狄拉克积分<br>η = (E_F-E_c)/kT<br><br>非简并极限：S = -(k/q)·[(5/2+r) - η]<br>强简并极限：S = -(π²k)/(3q)·(r+3/2)/η</div>
<p><strong>两种载流子的情况</strong>：</p>
<div class="formula-box">混合导电的塞贝克系数：<br>S_total = (σ_n·S_n + σ_p·S_p)/(σ_n + σ_p)<br><br>当n = p（本征）且μ_n = μ_p时：<br>S_n = -S_p → S_total = 0<br>→ 必须单极化掺杂才能获得大的S</div>
<div class="warn"><strong>易错</strong>：好的热电材料需要单极化导电（n型或p型），本征半导体因为正负载流子贡献相消，塞贝克系数接近零。</div>`},
{n:"热电偶与温度测量",s:"★★★☆☆",body:`<p><strong>热电偶</strong>是最基本的温度传感器，基于塞贝克效应。</p>
<div class="formula-box">热电偶电动势：<br>V = ∫_{T_ref}^{T} (S_A(T) - S_B(T)) dT<br><br>常用热电偶类型：<br>K型：Chromel/Alumel（-200~1200°C）<br>J型：Iron/Constantan（-40~750°C）<br>T型：Copper/Constantan（-200~350°C）<br>S型：Pt-Rh/Pt（0~1600°C）<br><br>Seebeck系数：S ~ 10-50 μV/K（金属）<br>半导体热电偶：S ~ 100-500 μV/K</div>
<div class="info">半导体热电偶的灵敏度比金属高10-50倍，但线性度和稳定性不如金属热电偶。</div>`},
{n:"热电发电机的原理与设计",s:"★★★☆☆",body:`<p><strong>热电发电机</strong>（TEG）：利用温差直接发电。</p>
<div class="formula-box">转换效率：<br>η = (T_h-T_c)/T_h · (√(1+ZT)-1)/(√(1+ZT)+T_c/T_h)<br><br>Carnot效率极限：η_C = (T_h-T_c)/T_h<br>TEG效率 = η_C × η_热电</div>
<p><strong>应用领域</strong>：<br>① 汽车尾气余热回收（~300-500°C）<br>② 工业余热发电（>500°C）<br>③ 航天RTG电源<br>④ 可穿戴设备体温发电</p>
<div class="info">汽车尾气余热TEG可回收1-3%的燃油能量。NASA的RTG使用SiGe热电材料，功率约200W。</div>`},
{n:"低维热电材料",s:"★★★☆☆",body:`<p><strong>低维结构的热电增强</strong>：</p>
<div class="formula-box">二维超晶格：Bi₂Te₃/Sb₂Te₃超晶格ZT~2.4<br>一维纳米线：Si纳米线(d~50nm) ZT~1.0<br>零维量子点：PbSe/PbS ZT~1.5</div>
<p><strong>PGEC概念</strong>（声子玻璃-电子晶体）：</p>
<div class="formula-box">理想热电材料：<br>• 电学：像晶体（高σ，高μ）<br>• 热学：像玻璃（低κ_L）<br><br>实现途径：笼状化合物（Skutterudites）<br>重元素"rattler"原子散射声子</div>
<div class="info">PGEC概念是热电材料设计的指导原则。</div>`}
],

// ===== 第12章 半导体磁和压阻效应 =====
{title:"第12章 半导体磁和压阻效应",sub:"霍尔效应、磁阻、量子霍尔、压阻",tag:"磁场与应力效应",kps:[
{n:"霍尔效应的详细计算与应用",s:"★★★★★",exam:1,body:`<p><strong>霍尔效应完整推导</strong>：</p>
<div class="formula-box">设N型半导体，电场E_x，磁场B_z<br><br>平衡条件（洛伦兹力=电场力）：<br>qE_y = qv_dB_z<br><br>霍尔系数：R_H = E_y/(J_x·B_z)<br>= 1/(qn)（N型）<br>= -1/(qp)（P型）<br><br>霍尔角：tan(θ_H) = μ·B_z<br><br>霍尔迁移率：μ_H = |R_H|·σ = |R_H|/ρ</div>
<p><strong>例题</strong>：Si样品，N_D=10¹⁶cm⁻³，μ_n=1400cm²/(V·s)，B=1kG=0.1T</p>
<div class="formula-box">R_H = 1/(qn) = 1/(1.6×10⁻¹⁹×10¹⁶)<br>= 625 cm³/C<br><br>ρ = 1/(qnμ) = 0.446 Ω·cm<br><br>μ_H = 625/0.446 = 1400 cm²/(V·s)</div>
<div class="warn"><strong>易错</strong>：霍尔系数的符号决定导电类型（R_H>0→P型，R_H<0→N型）。霍尔迁移率与漂移迁移率不总相等（多载流子时有霍尔因子r_H）。</div><div class="tip"><strong>通俗理解</strong>：霍尔效应的定量计算需要考虑载流子类型和散射机制——霍尔系数R_H=-1/(nq)或+1/(pq)取决于导电类型，实际测量中还需乘以霍尔因子（约1.18，与散射机制有关）。应用包括：判断导电类型、测载流子浓度、判断材料纯度。</div>`},
{n:"霍尔系数的温度依赖性",s:"★★★★★",exam:1,body:`<p><strong>N型半导体R_H(T)的三段变化</strong>：</p>
<div class="formula-box">低温（冻结区）：<br>n ↑ → |R_H| ↓<br><br>饱和区：<br>n ≈ N_D → R_H ≈ -r_H/(qN_D) = 常数<br><br>本征区：<br>n ≈ p ≈ n_i → R_H趋于0<br>且R_H符号反转（N型→R_H变正）</div>
<p><strong>霍尔因子r_H</strong>：</p>
<div class="formula-box">r_H = <τ²>/<τ>²<br><br>声学波散射：r_H = 3π/8 ≈ 1.18<br>电离杂质散射：r_H = 315π/512 ≈ 1.93<br>混合散射：1.18 < r_H < 1.93<br><br>通常取 r_H ≈ 1（简化计算）</div>
<div class="tip"><strong>考研重点</strong>：变温Hall实验是确定杂质浓度N_D、电离能ΔE_d和迁移率的最重要实验方法。需要会分析ln|R_H| vs 1/T图。</div>`},
{n:"磁阻效应",s:"★★★★☆",body:`<p><strong>物理磁阻效应</strong>：磁场改变半导体的电阻率。</p>
<div class="formula-box">磁阻定义：<br>MR = [ρ(B) - ρ(0)]/ρ(0)<br><br>物理磁阻（长条样品）：<br>MR ∝ (μB)²（弱场）<br><br>几何磁阻（Corbino盘）：<br>MR ∝ (μB)²/(1 + (μB)²)（强场）<br><br>影响因素：<br>• 迁移率越高→磁阻越大<br>• 载流子类型：单载流子无磁阻，双载流子有磁阻</div>
<p><strong>磁阻效应的应用</strong>：<br>① 磁场传感器（汽车ABS系统）<br>② 磁阻随机存储器（MRAM）<br>③ 霍尔效应传感器的补偿</p>
<div class="info">InSb因其超高迁移率（~78000 cm²/Vs）是磁阻传感器的首选材料。</div>`},
{n:"磁光效应",s:"★★★☆☆",body:`<p><strong>轨道磁能级</strong>：磁场中电子轨道运动量子化形成朗道能级。</p>
<div class="formula-box">朗道能级：<br>E_n = (n+1/2)ℏω_c<br>ω_c = eB/m*（回旋频率）<br><br>朗道能级简并度：<br>D = eB/h [cm⁻²]<br><br>磁光吸收：<br>能量守恒：hν = E_c_n - E_v_m + E_g<br>角动量守恒：Δn = ±1</div>
<p><strong>带间磁光吸收</strong>：<br>• 法拉第效应：偏振面旋转角度 ∝ B<br>• 磁致圆二色性：左/右旋光的吸收差异<br>• 用于测量有效质量和g因子</p>
<div class="info">磁光效应是研究半导体能带结构的重要实验手段，特别是确定有效质量和能带参数。</div>`},
{n:"量子化霍尔效应",s:"★★★☆☆",body:`<p><strong>整数量子霍尔效应（IQHE）</strong>：1980年von Klitzing发现。</p>
<div class="formula-box">霍尔电阻量子化：<br>R_H = h/(νe²) = R_K/ν<br>ν = 1, 2, 3...（填充因子）<br>R_K = h/e² = 25812.807 Ω（冯·克利青常数）</div>
<p><strong>分数量子霍尔效应（FQHE）</strong>：</p>
<div class="formula-box">ν = 1/3, 2/5, 3/7...<br>物理起源：电子-电子库仑相互作用<br>→ Laughlin波函数<br>→ 分数电荷准粒子（e/3, e/5）</div>
<div class="tip"><strong>意义</strong>：IQHE被用于电阻基准（R_K的精确值定义了电阻单位）。FQHE揭示了凝聚态物理中全新的拓扑序。</div>`},
{n:"热磁效应",s:"★★★☆☆",body:`<p><strong>四种磁热电效应</strong>：</p>
<div class="formula-box">① 爱廷豪森效应（Ettingshausen）：<br>电流+磁场→横向温差<br><br>② 能斯特效应（Nernst）：<br>温度梯度+磁场→横向电动势<br>E_y = N·B·(dT/dx)<br>N = 能斯特系数<br><br>③ 里纪-勒杜克效应（Righi-Leduc）：<br>温度梯度+磁场→横向热流<br><br>④ 霍尔效应：<br>电流+磁场→横向电动势（参照）</div>
<p><strong>物理关系</strong>：这四种效应是同一物理现象（磁场中载流子运动）在不同边界条件下的表现。</p>
<div class="info">能斯特效应可用于测量热导率的电子分量κ_e，因为κ_e与能斯特系数有直接关系。</div>`},
{n:"光磁电效应",s:"★★★☆☆",body:`<p><strong>光扩散电势差</strong>：非平衡载流子从光照区向暗区扩散产生的电势差。</p>
<div class="formula-box">光扩散电压：<br>V_d = (kT/q)·ln(1 + Gτ/L²·d²)<br>G = 光产生率<br>τ = 载流子寿命<br>d = 样品厚度</div>
<p><strong>光磁电效应</strong>：光照区产生的非平衡载流子在磁场中偏转→产生横向电压。</p>
<div class="formula-box">光磁电电流：<br>J_PM = σ·(E_d + v_d×B)<br>E_d = 扩散电场<br>v_d = 扩散速度</div>
<div class="info">光磁电效应可以用来测量少子寿命和扩散长度，是一种非接触式的半导体材料表征方法。</div>`},
{n:"压阻效应与压阻系数",s:"★★★★☆",body:`<p><strong>压阻效应</strong>：应力改变半导体的能带结构，从而改变电阻率。</p>
<div class="formula-box">压阻系数定义：<br>Δρ/ρ₀ = π_l·σ_l + π_t·σ_t<br><br>π_l：纵向压阻系数<br>π_t：横向压阻系数<br><br>Si的压阻系数（室温）：<br>p型Si[111]：π_l ≈ 93×10⁻¹¹ Pa⁻¹<br>n型Si[100]：π_l ≈ -102×10⁻¹¹ Pa⁻¹</div>
<p><strong>物理机制</strong>：<br>① 应力改变导带/价带结构（能谷分裂）<br>② 载流子在不同能谷间重新分布<br>③ 不同能谷的有效质量不同→电阻率改变</p>
<div class="info">Si的压阻系数比金属大50-100倍，这是MEMS压力传感器灵敏度高的物理基础。</div>`},
{n:"压阻效应的应用",s:"★★★☆☆",body:`<p><strong>液体静压强作用下的效应</strong>：</p>
<div class="formula-box">各向同性压力p：<br>Δρ/ρ₀ = π_s·p<br>π_s = 静压压阻系数<br>π_s = π_l + 2π_t<br><br>Si[100]：π_s ≈ -20×10⁻¹¹ Pa⁻¹<br>灵敏度较低</div>
<p><strong>单轴拉伸或压缩下的效应</strong>：</p>
<div class="formula-box">纵向拉伸应力σ_l：<br>ΔR/R₀ = π_l·σ_l<br><br>例：Si应变片<br>π_l ≈ 100×10⁻¹¹ Pa⁻¹<br>σ_l = 10 MPa<br>ΔR/R₀ ≈ 0.1%<br><br>远大于金属应变片（~0.002%）</div>
<p><strong>应用</strong>：<br>① 压力传感器（MEMS麦克风、汽车胎压监测）<br>② 加速度计（汽车气囊传感器）<br>③ 应变片（结构健康监测）</p>
<div class="warn"><strong>易错</strong>：压阻效应与压电效应不同。压阻是改变电阻率，压电是产生电荷。Si有强压阻效应但压电效应弱；GaN有强压电效应。</div>`}
,
{n:"磁阻效应的物理机制",s:"★★★★☆",exam:1,body:`<p><strong>物理磁阻效应</strong>的本质：磁场使载流子轨迹弯曲→增加散射概率→电阻增大。</p>
<div class="formula-box">弱场磁阻（μB << 1）：<br>Δρ/ρ₀ = ξ·(μB)²<br>ξ = 磁阻系数（取决于散射机制和能带结构）<br><br>n型Ge（双能谷）：磁阻很大<br>GaAs（单能谷）：磁阻很小</div>
<p><strong>几何磁阻效应</strong>：</p>
<div class="formula-box">Corbino盘（无霍尔电流通路）：<br>MR = (μB)²（饱和前）<br><br>长条样品（有霍尔电流通路）：<br>霍尔电场部分抵消洛伦兹力→MR较小<br><br>MR_Corbino >> MR_long_bar</div>
<div class="tip"><strong>实验意义</strong>：Corbino盘测量的磁阻消除了霍尔效应的影响，是测量迁移率的独立方法。</div>`},
{n:"几何磁阻效应与器件设计",s:"★★★☆☆",body:`<p><strong>几何形状对磁阻的影响</strong>：</p>
<div class="formula-box">长条形（W/L << 1）：霍尔电场充分建立，MR小<br>方形（W/L ≈ 1）：MR中等<br>Corbino盘：霍尔电场无法建立，MR最大</div>
<p><strong>磁阻传感器设计</strong>：<br>• InSb薄膜传感器：高迁移率→高灵敏度<br>• 磁阻传感器更适合弱磁场检测<br>• 灵敏度可达~100%/T</p>
<div class="info">InSb磁阻传感器广泛用于汽车ABS系统中的轮速传感器。</div>`},
{n:"磁光效应的物理基础",s:"★★★☆☆",body:`<p><strong>法拉第效应</strong>：线偏振光通过磁化介质时偏振面旋转。</p>
<div class="formula-box">θ_F = V·B·d<br>V = Verdet常数<br><br>半导体中：V ∝ ω_p²/(ω_g² - ω²)</div>
<p><strong>磁致圆二色性</strong>：左旋和右旋圆偏振光的吸收系数不同。</p>
<div class="formula-box">物理原因：磁场→朗道能级劈裂<br>左旋光：Δn = +1跃迁<br>右旋光：Δn = -1跃迁<br>→ 吸收边蓝移/红移不同</div>
<div class="info">磁光效应是测量半导体有效质量、g因子和能带参数的重要实验手段。</div>`},
{n:"热磁效应的定量描述",s:"★★★☆☆",body:`<p><strong>爱廷豪森效应</strong>：通电导体在磁场中产生横向温度梯度。</p>
<div class="formula-box">P = ΔT_y/(J_x·B_z) = S_H/σ<br>S_H = 霍尔塞贝克系数</div>
<p><strong>能斯特效应</strong>：温度梯度+磁场→横向电动势。</p>
<div class="formula-box">N ≈ (μ_p - μ_n)·S_p/(μ_p + μ_n)·1/σ</div>
<p><strong>里纪-勒杜克效应</strong>：温度梯度+磁场→横向热流偏转。</p>
<div class="formula-box">R ≈ μ_H²（与霍尔迁移率平方成正比）</div>
<div class="info">四种磁热电效应是同一物理本质的不同表现。</div>`},
{n:"光磁电效应的原理",s:"★★★☆☆",body:`<p><strong>光磁电效应</strong>：光照产生的非平衡载流子在磁场中偏转→产生横向电压。</p>
<div class="formula-box">V_PM ∝ G·τ·μ²·B（弱场）<br>从V_PM(B)可提取τ和μ</div>
<div class="tip"><strong>优势</strong>：光磁电法是非接触测量，不需要制作电极接触。</div>`},
{n:"压阻效应的晶体取向依赖性",s:"★★★★☆",exam:1,body:`<p><strong>压阻系数的各向异性</strong>：</p>
<div class="formula-box">Si的压阻系数（10⁻¹¹Pa⁻¹）：<br>p-Si [111]：π_l = +93.5（最灵敏）<br>n-Si [100]：π_l = -102.2<br>p-Si [100]：π_l = +6.6<br>n-Si [111]：π_l = -47.8</div>
<p><strong>设计选择</strong>：<br>• p型Si[111]：最大纵向压阻→最灵敏传感器<br>• 力传感器芯片通常沿[110]方向制作电阻条</p>
<div class="warn"><strong>易错</strong>：不同参考文献的压阻系数符号约定可能不同。</div><div class="tip"><strong>通俗理解</strong>：压阻效应就是“用力按半导体，电阻会变”。但变化幅度取决于力的方向与晶体方向的相对关系——就像掰一根木头，顺着纹理和横着纹理效果完全不同。Si的[110]方向压阻系数最大，所以MOS管通常沿这个方向设计。</div>`},
{n:"压阻传感器的工作原理",s:"★★★★☆",body:`<p><strong>惠斯通电桥压阻传感器</strong>：</p>
<div class="formula-box">V_out/V_in = ΔR/R = π_l·σ/4<br><br>灵敏度：S = V_out/(V_in·σ) = π_l/4</div>
<p><strong>MEMS压力传感器</strong>：<br>• 量程：1kPa ~ 100MPa<br>• 精度：0.1-0.5% FS</p>
<div class="info">全球MEMS压力传感器市场规模超过150亿美元。</div>`}
],

// ===== 第13章 非晶态半导体 =====
{title:"第13章 非晶态半导体",sub:"无序体系的电子态、输运与光学性质",tag:"非晶态物理",kps:[
{n:"非晶态半导体的结构",s:"★★★★☆",body:`<p><strong>非晶态半导体</strong>：原子排列没有长程有序（无周期性），但短程有序（配位数与晶体相同）。</p>
<div class="formula-box">结构特征：<br>• 短程有序：键长、键角与晶体接近<br>• 长程无序：无平移对称性<br>• 配位数守恒：a-Si仍为4配位（sp³杂化）<br><br>径向分布函数（RDF）：<br>第一峰位置 ≈ 晶体最近邻距离<br>第二峰展宽 → 次近邻位置不确定<br>远距离趋于常数 → 无长程有序</div>
<p><strong>连续无序网络模型（CRN）</strong>：<br>• 满足短程有序约束<br>• 无悬挂键（理想情况）<br>• 存在键角和键长的分布</p>
<div class="tip"><strong>通俗理解</strong>：非晶态就像"冻结的液体"——原子局部排列有序（像液体的短程有序），但整体无周期性（像液体的长程无序）。</div>`},
{n:"非晶态半导体中的电子状态",s:"★★★★★",exam:1,body:`<p><strong>无序体系中电子态的定域化</strong>：Anderson定域化——无序势场中电子波函数被限制在有限空间范围。</p>
<div class="formula-box">扩展态 vs 局域态：<br>• 扩展态：波函数遍布整个晶体（类Bloch波）<br>• 局域态：波函数指数衰减→电子被"困住"<br><br>迁移率边（mobility edge）：<br>E_c和E_v定义了扩展态和局域态的边界<br>E_c以上：扩展态（可导电）<br>E_v以下：扩展态<br>E_v到E_c之间：局域态（跳跃导电）</div>
<p><strong>非晶半导体的能带模型</strong>（CFO模型）：</p>
<div class="formula-box">能态分布：<br>• 带边不再是锐利的，而是向禁带中延伸出带尾态<br>• 禁带中央有高密度的缺陷态（悬挂键等）<br>• 带尾宽度 ~ 0.1-0.2 eV<br>• 缺陷态密度 ~ 10¹⁶-10¹⁸ cm⁻³eV⁻¹</div>
<div class="warn"><strong>易错</strong>：非晶Si的迁移率远低于晶态Si（10²倍以上），因为缺乏长程有序→布洛赫定理不适用→能带概念需修正为"扩展态/局域态"。</div><div class="tip"><strong>通俗理解</strong>：非晶态半导体就像“打碎重组的玻璃”——原子排列失去了长程周期性，只有短程有序。电子状态不再是清晰的能带，而是出现了“带尾态”——禁带中长出了“毛刺”，载流子在这些局域态之间跳跃传导。</div>`},
{n:"非晶半导体的化学键与缺陷",s:"★★★★☆",body:`<p><strong>非晶半导体的化学键</strong>：短程有序由化学键决定，长程无序来自键角和二面角的分布。</p>
<div class="formula-box">a-Si的键结构：<br>• sp³杂化 → 四面体配位<br>• 键角分布：~109.5° ± 10°<br>• 键长：~2.35 Å（接近晶体值）<br><br>悬挂键（Dangling Bond）：<br>• 未配对电子 → 产生缺陷态<br>• 密度：未钝化 ~10¹⁹ cm⁻³<br>• 掺氢后：~10¹⁵-10¹⁶ cm⁻³</div>
<p><strong>掺杂效应</strong>：</p>
<div class="formula-box">a-Si的掺杂效率远低于晶体Si：<br>• 掺B（p型）：效率 ~10%<br>• 掺P（n型）：效率 ~30%<br>• 原因：悬挂键缺陷态的补偿效应<br>• 需先掺H钝化悬挂键→提高掺杂效率</div>
<div class="info">a-Si:H中的H含量约10-15 at%，主要以Si-H键形式存在，饱和悬挂键→降低缺陷态密度→使掺杂成为可能。</div>`},
{n:"非晶态半导体中的缺陷与光电导",s:"★★★★☆",body:`<p><strong>主要缺陷类型</strong>：</p>
<div class="formula-box">• 悬挂键（D⁰, D⁺, D⁻）：未配对电子<br>• 弱键（Weak Bond）：拉长的Si-Si键<br>• void（空洞）：微观空洞<br>• 杂质：O, N, C等</div>
<p><strong>光电导机制</strong>：</p>
<div class="formula-box">定态光电导：<br>σ_ph = q·(μ_n + μ_p)·Δn<br><br>与光强的关系：<br>σ_ph ∝ G^γ<br>γ = 0.5（双分子复合）<br>γ = 1.0（单分子复合）<br>非晶半导体：γ ≈ 0.5-1.0（取决于缺陷密度）</div>
<p><strong>Staebler-Wronski效应</strong>：</p>
<div class="formula-box">光照引起的缺陷产生：<br>ΔN_d ∝ G·t^(1/3)<br>退火恢复：T > 150°C<br><br>物理机制：<br>① 链断裂模型：光生载流子复合→打断Si-Si弱键<br>② 氢迁移模型：光激发使H迁移→留下悬挂键</div>
<div class="warn"><strong>影响</strong>：S-W效应是a-Si:H太阳能电池效率随时间降低的主要原因。初始效率~10%→稳态效率~7%。</div>`},
{n:"非晶态半导体中的输运过程",s:"★★★★☆",body:`<p><strong>直流电导</strong>：非晶半导体有三种导电机制，随温度变化。</p>
<div class="formula-box">① 扩展态导电（高温）：<br>σ = σ₀·exp(-(E_c-E_F)/kT)<br>σ₀ ~ 100-300 Ω⁻¹cm⁻¹<br><br>② 带尾跳跃导电（中温）：<br>σ = σ₁·exp(-(E_A-E_F)/kT + T₁/T)<br>T₁ = 派尔斯温度<br><br>③ 变程跳跃导电VRH（低温）：<br>σ = σ₂·exp(-(T₀/T)^(1/4))<br>Mott VRH</div>
<p><strong>漂移迁移率</strong>：</p>
<div class="formula-box">μ_d = L²/(V·τ_transit)<br>τ_transit = 渡越时间<br><br>非晶Si：<br>μ_n ~ 0.5-1 cm²/(V·s)（扩展态）<br>μ_p ~ 0.01 cm²/(V·s)（空穴迁移率极低）<br><br>与晶体Si差距：10³-10⁴倍</div>
<div class="tip"><strong>考研重点</strong>：lnσ vs 1/T图可以区分三种导电机制。VRH区的1/4次方关系是Mott变程跳跃的标志。</div>`},
{n:"非晶态半导体中的光学性质",s:"★★★★☆",body:`<p><strong>光学带隙</strong>：非晶半导体的光学吸收边与晶体不同。</p>
<div class="formula-box">Tauc带隙（a-Si:H）：<br>(αhν)^(1/2) = B·(hν - E_g_opt)<br>E_g_opt ≈ 1.7-1.8 eV<br>（比晶体Si的1.12eV大得多）<br><br>Cody带隙：<br>(α/E)^(1/2) = C·(hν - E_g_Cody)<br>更准确（排除Urbach尾的影响）</div>
<p><strong>Urbach尾</strong>：吸收边下方的指数吸收区：</p>
<div class="formula-box">α(hν) = α₀·exp(hν/E_U)<br>E_U = Urbach能量 ~ 50-100 meV<br><br>E_U反映了带尾态的宽度<br>结构越无序→E_U越大→吸收边越弥散</div>
<p><strong>电致发光</strong>：<br>• 较晶体效率低（缺陷复合主导）<br>• 峰值能量 < E_g_opt（带尾态间跃迁）<br>• a-Si:H的电致发光已用于简单显示</p>
<div class="info">非晶半导体的光学带隙比晶体大是因为无序效应扩展了价带和导带→有效带隙增大。</div>`},
{n:"a-Si:H的pn结与金属-半导体接触",s:"★★★☆☆",body:`<p><strong>a-Si:H的pn结</strong>：</p>
<div class="formula-box">结构：p⁺(a-SiC:H)/i(a-Si:H)/n⁺(a-Si:H)<br><br>特点：<br>• 耗尽区宽度大（本征层厚~300-500nm）<br>• 大部分光吸收在i层中<br>• 内建电场驱动载流子分离<br><br>太阳能电池效率：<br>单结：~10%（稳定后~7%）<br>三结叠层：~14%（稳定后~10%）</div>
<p><strong>金属-半导体接触</strong>：</p>
<div class="formula-box">Schottky势垒：<br>φ_B = φ_m - χ（n型，理想）<br><br>实际：费米能级被界面态部分钉扎<br>φ_B ≈ (1-S)·(φ_m-χ) + S·φ_0<br>S = 钉扎参数<br><br>a-Si:H的Schottky势垒：<br>由于高缺陷态密度→强钉扎→φ_B对金属选择不敏感</div>
<div class="tip"><strong>应用</strong>：a-Si:H太阳能电池是最早商业化的薄膜太阳能电池技术。虽然效率不及晶硅，但可在柔性基底上大面积沉积，成本低。</div>`}
,
{n:"连续无序网络模型(CRN)",s:"★★★☆☆",body:`<p><strong>CRN模型</strong>描述非晶态半导体原子排列。</p>
<div class="formula-box">约束条件：<br>• 配位数固定（a-Si：4配位）<br>• 键长接近晶体值（偏差 < 5%）<br>• 键角分布中心在晶体值（偏差~10°）<br>• 无悬挂键（理想CRN）</div>
<p><strong>径向分布函数（RDF）</strong>：第一峰=最近邻距离，第二峰展宽，远距离趋于常数。</p>
<div class="info">分子动力学模拟和RMC方法可生成更精确的非晶态结构模型。</div>`},
{n:"Anderson定域化与迁移率边",s:"★★★★★",exam:1,body:`<p><strong>Anderson定域化</strong>：无序势场中电子波函数被完全定域化。</p>
<div class="formula-box">Anderson模型：H = Σᵢ εᵢ| i><i| + Σ V_{ij}| i><j|<br>εᵢ随机分布，宽度W<br><br>定域化条件：<br>3D：W/V > ~16<br>2D：所有态都定域化<br>1D：所有态都定域化</div>
<p><strong>迁移率边</strong>：E_c和E_v分隔扩展态和局域态。</p>
<div class="formula-box">E > E_c：扩展态（可导电）<br>E_v < E < E_c：局域态（跳跃导电）<br>迁移率在E_c和E_v处突变</div>
<div class="warn"><strong>易错</strong>：迁移率边处态密度不为零，但迁移率从有限值突变为零。</div><div class="tip"><strong>通俗理解</strong>：Anderson定域化说的是：当无序度足够强时，电子波函数不再能传播到整个晶体，而是被“困”在某个区域内，就像声音在嘈杂的房间里传不远。迁移能级（迁移率边）就是局域态和扩展态的分界线。</div>`},
{n:"变程跳跃电导(VRH)",s:"★★★★☆",body:`<p><strong>Mott VRH</strong>：非晶半导体低温下的导电机制。</p>
<div class="formula-box">σ = σ₀·exp(-(T₀/T)^(1/4))<br>T₀ = 18α³/(k·g(E_F))<br><br>ES VRH（低温库仑间隙）：<br>σ = σ₀·exp(-(T₀'/T)^(1/2))</div>
<div class="tip"><strong>实验区分</strong>：lnσ vs T^{-1/4}（Mott）或T^{-1/2}（ES）的线性关系。</div>`},
{n:"非晶半导体的态密度分布",s:"★★★★☆",body:`<p><strong>态密度的实验测量方法</strong>：</p>
<div class="formula-box">① 场效应法（FEFET）<br>② 稳态光电流谱<br>③ 深能级瞬态谱（DLTS）<br>④ 光电子发射谱（PES）</div>
<p><strong>a-Si:H的典型态密度</strong>：带尾宽度~0.1-0.15 eV，缺陷态密度~10¹⁶ cm⁻³eV⁻¹。</p>
<div class="info">态密度分布呈"U"形：带边高DOS，禁带中央低DOS。</div>`},
{n:"非晶半导体的光学吸收边",s:"★★★★☆",body:`<p><strong>Tauc图</strong>：确定光学带隙的标准方法。</p>
<div class="formula-box">(αhν)^(1/2) = B·(hν - E_g_opt)<br>a-Si:H：E_g_opt ≈ 1.7-1.8 eV</div>
<p><strong>Urbach尾</strong>：</p>
<div class="formula-box">α(hν) = α₀·exp(hν/E_U)<br>a-Si:H：E_U ~ 50-100 meV<br>晶体Si：E_U ~ 10 meV</div>
<div class="info">E_U越小，结构越有序，器件性能越好。</div>`},
{n:"非晶半导体的漂移迁移率测量",s:"★★★☆☆",body:`<p><strong>时间渡越法（TOF）</strong>：</p>
<div class="formula-box">μ_d = L²/(V·t_transit)<br><br>a-Si:H：μ_n ~ 0.5-1.0 cm²/(V·s)<br>μ_p ~ 0.01-0.03 cm²/(V·s)</div>
<div class="tip"><strong>设计启示</strong>：空穴迁移率极低是a-Si:H太阳能电池效率受限的原因之一。</div>`},
{n:"非晶半导体合金的带隙调节",s:"★★★☆☆",body:`<p><strong>三元合金化</strong>：通过加入C、N、O等元素调节带隙。</p>
<div class="formula-box">a-Si₁₋ₓCₓ:H：E_g随x增大→蓝移<br>a-Si₁₋ₓNₓ:H：E_g可调1.8-5.0 eV<br>a-Si₁₋ₓOₓ:H：E_g可调1.8-3.0 eV</div>
<p><strong>三结叠层太阳能电池</strong>：a-Si:H + a-SiGe:H + μc-Si:H，总效率~14%。</p>

{n:"非晶半导体薄膜晶体管(TFT)",s:"★★★☆☆",body:`<p><strong>a-Si:H TFT</strong>：大面积显示驱动的核心器件。</p>

var examQuestions=[
{ch:1,q:"试述金刚石结构和闪锌矿结构的异同点。Si和GaAs分别属于哪种结构？",a:"金刚石结构：同种原子，两个面心立方套构，纯共价键（如Si、Ge）。\n闪锌矿结构：两种不同原子，类似金刚石但有极性（如GaAs、InP）。\n相同点：配位数4，四面体键角109.5°，均为fcc布里渊区。\n不同点：金刚石有反演对称中心，闪锌矿无；闪锌矿沿[111]方向有极性，有压电效应。"},
{ch:1,q:"简述能带形成的基本原理。",a:"①孤立原子的电子分立能级\n②N个原子靠近时，由于泡利不相容原理，简并能级分裂为准连续的能带\n③不同壳层的能级分裂程度不同\n④能带之间可能存在禁带\n⑤导带底和价带顶的位置和间距决定了材料的导电性质"},
{ch:1,q:"什么是有效质量？它有什么物理意义？",a:"有效质量m* = ℏ²/(d²E/dk²)，将晶体中电子的准经典运动等效为自由粒子运动。\n物理意义：①反映能带曲率②考虑了晶格周期势场的影响③运动方程形式简单：F = m*·a④能带底m*>0，能带顶m*<0"},
{ch:1,q:"解释Si、Ge、GaAs的能带结构特点及对器件应用的影响。",a:"Si：间接带隙(1.12eV)，6个等价能谷，不能高效发光，适合集成电路。\nGe：间接带隙(0.66eV)，迁移率高，早期晶体管材料。\nGaAs：直接带隙(1.43eV)，μ_n极高(8500)，适合LED、激光器、高频器件。"},
{ch:1,q:"简述布里渊区的构造方法，并说明FCC和BCC的BZ形状。",a:"构造方法：从倒格点出发，做所有倒格矢的垂直平分面（布拉格面），围成的最小封闭区域即为BZ。\nFCC的BZ（Si/Ge）：截角八面体（14面体），由8个六边形+4个正方形组成。对称点：Γ、X、L、K。\nBCC的BZ（GaAs）：正十二面体（12个五边形面）。\nBZ边界满足布拉格反射条件→能隙形成。"},
{ch:2,q:"解释施主杂质和受主杂质的含义，并说明杂质电离能的计算方法。",a:"施主杂质：替位于Si中掺入V族元素，多余一个电子弱束缚，电离时释放电子到导带。受主杂质：掺入III族元素，缺少一个电子，电离时从价带俘获电子。\n电离能：E_D = 13.6·m*/(m₀·ε_r²) (eV)，Si中约0.045eV。"},
{ch:2,q:"解释复合中心和陷阱中心的区别，并用SRH理论说明。",a:"复合中心：同时有效俘获电子和空穴，净效果是使电子-空穴对复合消失。要求σ_n≈σ_p。\n陷阱中心：对电子和空穴的俘获截面差异大，先俘获一种载流子，然后大多将其释放回原来的能带，净效果是延迟响应而非永久消除。\nSRH判据：如果σ_n·v_th·n >> σ_p·v_th·p（或反之），则为陷阱；σ_n≈σ_p时为复合中心。"},
{ch:2,q:"什么是DLTS？简述其测量原理和能获得的信息。",a:"DLTS（深能级瞬态谱）：测量深能级参数的实验方法。\n原理：①正偏→填充深能级→突然反偏→热发射→监测电容瞬态→扫描温度\n②在特定温度窗口，电容变化率最大→DLTS信号出现峰值\n③峰温→能级位置E_T；峰高→浓度N_T；峰宽→俘获截面σ\n\n获得信息：能级位置、浓度、俘获截面、发射率。"},
{ch:3,q:"解释费米能级的物理意义及其随温度和掺杂的变化规律。",a:"E_F：①热平衡时统一②E_F处量子态被占据概率为1/2③确定载流子浓度分布\n温度：N型→T升高→E_F从E_D下方下移→趋向禁带中央\n掺杂：N_D增大→E_F向E_c移动；N_A增大→E_F向E_v移动。"},
{ch:3,q:"推导ni = √(NcNv)·exp(-Eg/2kT)。",a:"①n = Nc·exp(-(Ec-EF)/kT)\n②p = Nv·exp(-(EF-Ev)/kT)\n③np = NcNv·exp(-Eg/kT)\n④本征时n=p=ni，ni² = NcNv·exp(-Eg/kT)\n⑤ni = √(NcNv)·exp(-Eg/2kT)\nni仅取决于材料和温度，与掺杂无关。"},
{ch:3,q:"画出N型半导体ln(n) vs 1/T图，标出各温区并解释物理机制。",a:"三段式：\n①低温（冻结区）：n指数增长，斜率=-ΔE_d/(2k)，杂质逐步电离\n②中温（饱和区）：n≈N_D（水平线），杂质完全电离但本征激发可忽略\n③高温（本征区）：n指数增长，斜率=-E_g/(2k)，本征激发主导\n转折温度T₁≈ΔE_d/[k·ln(Nc/N_D)]（冻结→饱和），T₂由ni=N_D确定（饱和→本征）"},
{ch:3,q:"什么是简并半导体？其载流子浓度如何计算？",a:"简并半导体：费米能级进入导带或价带内部，玻尔兹曼近似失效。\n判据：N_D > N_c/4 或 E_F进入能带。\n载流子浓度：n = Nc·F_{1/2}(η_F)，F_{1/2}为费米-狄拉克积分。\n简化：高温极限F_{1/2}→exp(η)（恢复非简并）；低温极限F_{1/2}∝η^(3/2)（类似金属）。"},
{ch:4,q:"简述载流子的主要散射机制及其温度依赖性。",a:"①晶格振动散射：μ_l ∝ T^(-3/2)，高温主导\n②电离杂质散射：μ_I ∝ T^(3/2)/N_I，低温主导\n③马西森定则：1/μ = 1/μ_l + 1/μ_I\nμ-T曲线先升后降，峰值在杂质完全电离附近。"},
{ch:4,q:"简述霍尔效应的原理及其在半导体中的应用。",a:"原理：电流I_x通过样品，z方向加磁场B_z，载流子受洛伦兹力在y方向积累→产生霍尔电场E_H。\n应用：①由R_H符号判断导电类型②由|R_H|=1/(qn)计算载流子浓度③结合σ得到霍尔迁移率④变温Hall可求杂质电离能、禁带宽度"},
{ch:4,q:"计算题：Si样品N_D=10¹⁶cm⁻³，μ_n=1400cm²/(V·s)，B=0.1T。求R_H、ρ和θ_H。",a:"R_H = 1/(qn) = 1/(1.6×10⁻¹⁹×10¹⁶) = 625 cm³/C\nρ = 1/(qnμ) = 1/(1.6×10⁻¹⁹×10¹⁶×1400) = 0.446 Ω·cm\nσ = 1/ρ = 2.24 S/cm\nθ_H = arctan(μB) = arctan(1400×0.1×10⁻⁴) = arctan(0.014) ≈ 0.8°"},
{ch:5,q:"写出连续性方程并解释各项的物理含义。",a:"∂p/∂t = G - Δp/τ + D_p·∂²Δp/∂x² - μ_p·E·∂Δp/∂x\n①G—产生率\n②−Δp/τ—复合项\n③D_p·∂²Δp/∂x²—扩散项\n④−μ_p·E·∂Δp/∂x—漂移项"},
{ch:5,q:"解释少子寿命的物理意义及其影响因素。",a:"物理意义：非平衡少子从产生到复合消失的平均存活时间τ。\n影响因素：①复合中心浓度②深能级位置③温度④缺陷密度⑤大注入时俄歇复合⑥表面复合"},
{ch:5,q:"推导少子扩散方程并求解一维稳态解。",a:"连续性方程简化（无电场、稳态、无产生）：\nD_p·d²Δp/dx² - Δp/τ_p = 0\n令L_p = √(D_p·τ_p)，得：d²Δp/dx² - Δp/L_p² = 0\n通解：Δp(x) = A·exp(-x/L_p) + B·exp(+x/L_p)\n边界条件Δp(0)=Δp₀, Δp(∞)=0 →\nΔp(x) = Δp₀·exp(-x/L_p)"},
{ch:6,q:"推导PN结内建电势V_D的表达式。",a:"①平衡时扩散电流=漂移电流\n②E = -(kT/q)·(1/n)·dn/dx\n③V_D = (kT/q)·ln(N_A·N_D/ni²)"},
{ch:6,q:"试述PN结雪崩击穿和齐纳击穿的区别。",a:"雪崩击穿：轻掺杂、碰撞电离级联倍增、V_BR>6V、正温度系数。\n齐纳击穿：重掺杂(N>10¹⁸)、带间隧穿、V_BR<4V、负温度系数。"},
{ch:6,q:"计算N型Si突变结N_D=10¹⁶cm⁻³的击穿电压V_BR。",a:"V_BR ≈ 60(E_g/1.12)^1.5(N_B/10¹⁶)^(-3/4) [V]\n= 60×1×1 = 60V\n验证：耗尽层W = 2ε_s·V_BR/(qN_D)\n= 2×11.7×8.85×10⁻¹⁴×60/(1.6×10⁻¹⁹×10¹⁶)\n≈ 7.7 μm"},
{ch:6,q:"什么是PN结反向恢复？其时间常数由什么决定？",a:"反向恢复：正偏→反偏瞬间，由于扩散区存储了少子（存储电荷Q_s），反向电流先出现大的尖峰再衰减。\nt_rr ≈ τ·ln(1+I_F/I_R)，由少子寿命τ决定。\nτ越大→存储电荷越多→反向恢复越慢→开关损耗越大。\n改善：快恢复二极管（τ小）、肖特基二极管（无少子存储，t_rr≈0）。"},
{ch:7,q:"简述肖特基二极管和PN结二极管的区别。",a:"①载流子：肖特基多子热发射，PN结少子扩散②少子存储：肖特基无，PN结有③开关速度：肖特基ns级，PN结μs级④正向压降：肖特基0.3-0.5V，PN结0.6-0.7V⑤反向漏电：肖特基较大"},
{ch:7,q:"解释镜像力降低效应对肖特基势垒的影响。",a:"镜像力：电子在金属中感应出等量正电荷（镜像电荷），产生吸引力→降低势垒。\nΔΦ = √[qE_max/(4πε_s)]\n影响：①有效势垒降低→反向电流增大②势垒降低量随反偏增大→I-V偏离理想③I-V曲线的理查逊图（ln(I/T²)vs1/T）出现弯曲"},
{ch:7,q:"什么是费米能级钉扎？其对肖特基势垒有什么影响？",a:"费米能级钉扎：界面态密度D_it很高时，费米能级被钉在界面态中某个位置，势垒高度与金属功函数几乎无关。\nΦ_Bn ≈ (1-S)·(W_m-χ) + S·(E_g/q-φ_0)\nS（界面态参数）= ε_i/(ε_i+qD_it·δ)\nD_it大→S→0→Φ_Bn≈常数≈E_g/3\n实验上大多数金属-Si接触的Φ_Bn≈0.6-0.7E_g。"},
{ch:8,q:"推导MOSFET的阈值电压表达式。",a:"①强反型：φ_s=2φ_F\n②Q_dep = √[4qε_sN_Aφ_F]\n③V_FB = Φ_ms - Q_ox/C_ox\n④V_T = V_FB + 2φ_F + √[4qε_sN_Aφ_F]/C_ox"},
{ch:8,q:"解释高频和低频C-V曲线在反型区的差异。",a:"低频：少子跟得上信号→C_s→∞→C≈C_ox。\n高频：少子跟不上→只有耗尽层响应→C=C_min<C_ox。\n深耗尽：快速扫描→C低于C_min。"},
{ch:8,q:"计算题：Si MOSFET，N_A=10¹⁷cm⁻³，t_ox=10nm，Φ_ms=-0.9V。求V_T。",a:"φ_F = (kT/q)ln(N_A/n_i) = 0.026·ln(10¹⁷/1.5×10¹⁰) ≈ 0.41V\nC_ox = ε_ox/t_ox = 3.9×8.85×10⁻¹⁴/10⁻⁶ ≈ 3.45×10⁻⁷ F/cm²\nQ_dep = √(4×1.6×10⁻¹⁹×11.7×8.85×10⁻¹⁴×10¹⁷×0.41)\n≈ 1.69×10⁻⁷ C/cm²\nV_T = -0.9 + 2×0.41 + 1.69×10⁻⁷/3.45×10⁻⁷\n= -0.9 + 0.82 + 0.49 = 0.41V"},
{ch:8,q:"什么是短沟道效应？列举主要的表现和物理机制。",a:"短沟道效应（SCE）：沟道长度缩小到亚微米以下出现的非理想效应。\n主要表现：①阈值电压随L减小而降低（V_T roll-off）②漏致势垒降低（DIBL）③亚阈值摆幅增大④迁移率退化（表面散射增强）⑤速度饱和→I_D不再∝(V_GS-V_T)²\n物理机制：源-漏耗尽层侵入沟道→有效沟道长度缩短→栅控能力减弱。"},
{ch:9,q:"说明直接带隙和间接带隙半导体在光吸收和发光性质上的差异。",a:"直接带隙：α~10⁴cm⁻¹，辐射复合效率高，适合LED和激光器。\n间接带隙：需声子参与，α~10²-10³cm⁻¹，辐射复合效率低。"},
{ch:9,q:"解释半导体激光器的工作原理及实现条件。",a:"①粒子数反转（E_Fn-E_Fp>hν）②双异质结限制载流子和光③谐振腔④增益>阈值⑤直接带隙材料"},
{ch:9,q:"简述塞贝克效应的物理机制。",a:"温差使载流子从热端向冷端扩散→冷端积累电荷→建立温差电动势。半导体S~mV/K远大于金属S~μV/K，因为半导体载流子浓度低，温差引起相对浓度梯度更大。"},
{ch:9,q:"计算GaAs/AlGaAs量子阱（阱宽10nm）的前两个子能级间距。",a:"m*(GaAs) = 0.067m₀\nE_n = n²π²ℏ²/(2m*d²)\nE₁ = π²×(1.055×10⁻³⁴)²/(2×0.067×9.1×10⁻³¹×(10⁻⁸)²)\n≈ 56 meV\nE₂ = 4×E₁ ≈ 224 meV\nE₂-E₁ = 3×E₁ ≈ 168 meV\n子能级间距远大于kT(26meV)→量子限制效应显著。"},
{ch:9,q:"什么是HEMT？解释其高迁移率的物理原因。",a:"HEMT（高电子迁移率晶体管）：利用调制掺杂在异质结界面形成2DEG的场效应管。\n高迁移率原因：①电子在窄隙本征层（GaAs）中运动②电离杂质在宽隙掺杂层（AlGaAs）中③电子远离杂质→库仑散射极弱\n低温下μ可超10⁶cm²/(V·s)（比体材料高100倍以上）。"},
{ch:9,q:"解释增益引导激光器和折射率引导激光器的区别。",a:"增益引导：电流注入区域产生增益→光场被增益分布约束。\n缺点：模式不稳定，阈值高。\n折射率引导：利用折射率差（如DH结构）约束光场。\n优点：模式稳定，阈值低，光束质量好。\n现代激光器几乎都采用折射率引导（脊型波导、掩埋异质结等）。"},
{ch:9,q:"什么是Staebler-Wronski效应？对a-Si:H太阳能电池有什么影响？",a:"S-W效应：非晶硅在光照下光电导率和暗电导率持续降低的现象。\n物理机制：光生载流子复合→打断Si-Si弱键→产生悬挂键缺陷→载流子俘获增加→光电导降低。\n影响：a-Si:H太阳能电池初始效率~10%，稳态降至~7%。\n对策：减少单层厚度、使用多结结构、优化氢含量。"}
];

var currentKP = null;
var examOnly = false;

// ========== 术语词典 ==========
var glossary=[
// --- 晶体结构 ---
{t:"基元",cat:"晶体结构",d:"晶体中最小的重复单元。基元可以是一个原子，也可以是一组原子。将基元放置在每个格点上，就构成了整个晶体。<br><br>例：Si的基元包含2个原子（分别在(0,0,0)和(¼,¼,¼)位置），金刚石结构每晶胞有8个原子（4个格点×2个基元原子）。"},
{t:"晶胞",cat:"晶体结构",d:"能通过平移操作填满整个空间的最小平行六面体。晶胞由三个基矢a₁,a₂,a₃定义。<br><br>晶胞的选择不是唯一的，通常选取能反映晶体对称性的最小体积晶胞。原胞（primitive cell）体积最小，只含1个格点；常规晶胞（conventional cell）可能包含多个格点。"},
{t:"布拉伐格子",cat:"晶体结构",d:"由数学上的格点构成的无限周期点阵。所有晶体结构可以归结为14种布拉伐格子（3大晶系7大晶族）。<br><br>常见半导体：<br>• Si/Ge: 面心立方(FCC)布拉伐格子<br>• GaAs: FCC布拉伐格子（但含两种原子）<br>• GaN(纤锌矿): 六方密排布拉伐格子"},
{t:"配位数",cat:"晶体结构",d:"一个原子的最近邻原子数目。反映原子排列的紧密程度。<br><br>• 金刚石结构：配位数=4（每个原子与4个最近邻形成共价键）<br>• FCC结构：配位数=12<br>• BCC结构：配位数=8<br><br>配位数决定了化学键类型和晶体稳定性。"},
{t:"共价键",cat:"晶体结构",d:"两个原子共享一对电子形成的化学键。Si和Ge主要靠共价键结合。<br><br>特点：<br>• 方向性强：沿四面体方向(键角109.5°)<br>• 饱和性：每个原子最多形成4个共价键<br>• 键能：Si-Si约2.3eV<br><br>III-V族化合物中，共价键含有部分离子键成分（电负性差导致）。"},
{t:"密勒指数",cat:"晶体结构",d:"标记晶面和晶向的数字标记法。<br><br>晶面指数(hkl)：<br>①取晶面在三个基矢上的截距（以晶胞常数为单位）<br>②取截距的倒数<br>③化为最小整数比<br><br>例：Si的(100)面、(110)面、(111)面是最重要的晶面。<br>等价晶面用花括号{hkl}表示，如{100}包含(100),(010),(001)等6个面。"},
{t:"倒格子",cat:"晶体结构",d:"从实空间正格子通过傅里叶变换定义的倒空间中的格子。<br><br>倒格基矢：<br>b₁=2π(a₂×a₃)/Ω<br>b₂=2π(a₃×a₁)/Ω<br>b₃=2π(a₁×a₂)/Ω<br><br>倒格子的核心意义：<br>• 布洛赫波矢k定义在倒空间<br>• 布里渊区就是倒空间中的Wigner-Seitz原胞<br>• 衍射条件：入射波矢变化量=倒格矢"},
// --- 能带理论 ---
{t:"布里渊区",cat:"能带理论",d:"倒空间中以原点为中心的最小封闭区域（Wigner-Seitz原胞）。是描述电子能态的基本框架。<br><br>• 第一布里渊区(BZ)：所有布拉格面围成的最小区域<br>• BZ边界满足2k·G=|G|²（布拉格反射条件）<br>• BZ内部的电子态是扩展的（布洛赫波）<br><br>FCC的BZ是截角八面体（14面体），对称点：Γ(中心)、X(面心)、L(六边形中心)。"},
{t:"布洛赫定理",cat:"能带理论",d:"周期势场V(r)=V(r+R)中薛定谔方程的解具有如下形式：<br><br>ψ_k(r) = e^(ikr) · u_k(r)<br><br>其中u_k(r)具有与晶格相同的周期性：u_k(r+R)=u_k(r)。<br><br>物理含义：电子波函数是平面波e^(ikr)被周期函数u_k(r)调制的结果。k是好量子数，每个k对应一个能量本征值E(k)，形成能带。"},
{t:"能带",cat:"能带理论",d:"晶体中电子允许存在的能量范围（允许带），以及不允许存在的能量范围（禁带）的总称。<br><br>能带的形成：N个原子靠近→每个能级分裂为N个→准连续的能带。<br><br>关键参数：<br>• 带宽W∝重叠积分J<br>• 禁带宽度E_g取决于周期势场的强度<br>• 导带(最低未占据带)和价带(最高占据带)决定了导电性"},
{t:"禁带",cat:"能带理论",d:"也称带隙(band gap)。能带之间电子不允许存在的能量区域。<br><br>• Si: E_g=1.12eV (间接带隙)<br>• Ge: E_g=0.66eV (间接带隙)<br>• GaAs: E_g=1.42eV (直接带隙)<br><br>E_g决定了：<br>• 半导体 vs 绝缘体 (E_g大→绝缘体)<br>• 光吸收边波长 λ_c=1.24/E_g (μm)<br>• 载流子热激发浓度"},
{t:"导带",cat:"能带理论",d:"半导体中最低的未被电子占据的能带。导带中的电子可以自由运动，参与导电。<br><br>• 导带底(CBM)：导带的最低点，电子填充从这里开始<br>• Si的CBM在<100>方向（6个等价能谷）<br>• GaAs的CBM在Γ点(k=0)<br>• 电子在CBM附近的有效质量决定了迁移率"},
{t:"价带",cat:"能带理论",d:"半导体中最高的被电子占据的能带。在0K时价带完全被填满。<br><br>• 价带顶(VBM)：价带的最高点<br>• Si/Ge/GaAs的VBM都在Γ点(k=0)<br>• 价带由3个子带组成：重空穴带(HH)、轻空穴带(LH)、自旋轨道劈裂带(SO)<br>• 价带中的空穴参与导电"},
{t:"有效质量",cat:"能带理论",d:"将晶格势场的影响等效为质量变化的参数。<br><br>公式：1/m*=(1/ℏ²)·d²E/dk²<br><br>• 能带底(曲率大)：m*小→电子容易加速→高迁移率<br>• 能带顶(曲率小)：m*大→迁移率低<br>• 有效质量可以是负的(能带顶)<br><br>Si电子m*=0.26m₀（电导率质量），GaAs电子m*=0.067m₀。"},
{t:"空穴",cat:"能带理论",d:"价带中缺少一个电子的状态等效为一个带正电荷+q、具有正有效质量的准粒子。<br><br>空穴的性质：<br>• 电荷：+q（与电子相反）<br>• 有效质量：正值（与能带顶电子的负有效质量相反）<br>• 能量向上增加（与电子相反）<br>• 运动方向与电场方向相同<br><br>空穴概念大大简化了价带中大量电子的复杂运动描述。"},
{t:"直接带隙",cat:"能带理论",d:"导带底和价带顶在k空间同一位置的半导体。跃迁不需要声子参与。<br><br>直接带隙半导体：GaAs(1.42eV)、InP(1.35eV)、GaN(3.4eV)、CdTe(1.5eV)<br><br>特点：<br>• 光吸收系数高(α~10⁴cm⁻¹)<br>• 辐射复合效率高（发光效率高）<br>• 适合做LED、激光器、光电探测器"},
{t:"间接带隙",cat:"能带理论",d:"导带底和价带顶在k空间不同位置的半导体。跃迁需要声子参与以满足动量守恒。<br><br>间接带隙半导体：Si(1.12eV)、Ge(0.66eV)<br><br>特点：<br>• 光吸收需要声子→吸收系数低(α~10²cm⁻¹)<br>• 辐射复合效率极低（不能高效发光）<br>• 适合集成电路，不适合发光器件"},
{t:"费米能级",cat:"能带理论",d:"热平衡时电子系统的化学势，是统计物理中最重要的物理量之一。<br><br>核心性质：<br>• E_F处的量子态被占据概率恰好=1/2<br>• 热平衡时整个系统的E_F处处相等（分析能带图的基础）<br>• E_F在禁带中→非简并半导体<br>• E_F进入能带→简并半导体（类似金属）<br><br>位置：<br>N型：E_F靠近E_c<br>P型：E_F靠近E_v<br>本征：E_F≈禁带中央"},
{t:"费米-狄拉克分布",cat:"能带理论",d:"描述热平衡状态下能量为E的量子态被电子占据的概率：<br><br>f(E) = 1/[exp((E-E_F)/kT) + 1]<br><br>性质：<br>• f(E_F) = 1/2<br>• E >> E_F: f≈exp(-(E-E_F)/kT)（玻尔兹曼近似）<br>• E << E_F: f≈1<br>• T→0K: f为阶跃函数（E_F以下全满，以上全空）<br><br>当E_F靠近或进入能带时，必须使用完整公式，不能用玻尔兹曼近似。"},
{t:"态密度",cat:"能带理论",d:"单位能量间隔内允许的量子态数目g(E)，单位：cm⁻³·eV⁻¹。<br><br>3D态密度（抛物线型能带）：<br>g(E) = 4π(2m*)^(3/2)/(2πℏ³) · √(E-E_c)<br><br>2D态密度（量子阱）：<br>g₂D = m*/(πℏ²) = 常数（台阶状）<br><br>态密度决定了给定能量范围内可容纳的电子数，直接影响载流子浓度的计算。"},
{t:"布洛赫波",cat:"能带理论",d:"周期势场中薛定谔方程的本征函数：ψ_k(r)=e^(ikr)·u_k(r)。<br><br>• e^(ikr)：自由电子的平面波部分<br>• u_k(r)：周期性调制函数，反映晶格势场<br>• k：波矢（好量子数，限制在第一布里渊区内）<br><br>布洛赫波的特点：模|ψ|²具有晶格周期性（电子在每个原胞内出现的概率相同），说明电子在整个晶体中是离域的（不被束缚在某个原子上）。"},
// --- 杂质与缺陷 ---
{t:"施主",cat:"杂质缺陷",d:"能提供电子的杂质原子。在Si中掺入V族元素（P、As、Sb）就是施主杂质。<br><br>• 多余的1个电子被弱束缚在施主离子周围<br>• 电离能很小(Si中约0.045eV)<br>• 室温下几乎全部电离→向导带释放电子<br>• 形成N型半导体<br><br>类氢模型计算：E_D=13.6·(m*/m₀)·(1/ε_r²) eV"},
{t:"受主",cat:"杂质缺陷",d:"能接受电子（提供空穴）的杂质原子。在Si中掺入III族元素（B、Al、Ga）就是受主杂质。<br><br>• 缺少1个电子→形成空穴<br>• 电离能也很小(Si中B约0.045eV)<br>• 电离后从价带俘获电子→向价带释放空穴<br>• 形成P型半导体"},
{t:"电离能",cat:"杂质缺陷",d:"杂质原子的电子（或空穴）从束缚态跃迁到自由态（导带或价带）所需的能量。<br><br>浅能级电离能很小(~meV量级)，室温下(kT≈26meV)即可完全电离。<br><br>Si中典型值：<br>• 施主：P(0.045eV)、As(0.054eV)、Sb(0.039eV)<br>• 受主：B(0.045eV)、Al(0.067eV)、Ga(0.072eV)<br><br>电离能随介电常数增大而减小：E_D∝1/ε_r²"},
{t:"深能级",cat:"杂质缺陷",d:"电离能远大于kT的杂质或缺陷能级，通常位于禁带中央附近。<br><br>与浅能级的区别：<br>• 波函数局域在杂质附近（不扩展）<br>• 不能用类氢模型描述<br>• 既是复合中心也可能是陷阱<br>• 对载流子寿命影响大<br><br>典型深能级：Au在Si中（深施主0.54eV，深受主0.35eV）"},
{t:"浅能级",cat:"杂质缺陷",d:"电离能很小（约meV量级）的杂质能级，位于带边附近。<br><br>• 可用类氢模型描述<br>• 波函数扩展范围大（a_B* ~ 几nm到几十nm）<br>• 室温下完全电离<br>• 电离能 E_D ∝ (m*/m₀)/ε_r²<br><br>浅能级杂质是控制半导体导电类型和浓度的主要手段。"},
{t:"补偿",cat:"杂质缺陷",d:"同时存在施主(N_D)和受主(N_A)杂质时，两者的效应部分抵消。<br><br>完全电离时：<br>N型(N_D>N_A): n = N_D - N_A（净施主浓度）<br>P型(N_A>N_D): p = N_A - N_D（净受主浓度）<br><br>补偿度 K=N_A/N_D：K→1表示完全补偿（载流子浓度→0）。<br><br>补偿使迁移率降低（施主+受主都散射载流子）。Hall效应只能测出|N_D-N_A|。"},
{t:"简并",cat:"杂质缺陷",d:"掺杂浓度极高（N_D > N_c/4 ≈ 10¹⁹cm⁻³）时，费米能级进入导带（或价带）内部。<br><br>简并半导体的特征：<br>• 玻尔兹曼近似失效→必须用费米积分<br>• 金属导电行为<br>• 带尾效应（带边模糊）<br>• Burstein-Moss效应（光学带隙增大）<br><br>简并半导体常见于重掺杂区域和隧道二极管中。"},
{t:"缺陷",cat:"杂质缺陷",d:"晶体中原子排列偏离理想周期性的各种不完美性。<br><br>分类：<br>① 点缺陷：空位（缺少原子）、间隙原子（多余原子）、替位杂质<br>② 线缺陷：位错（刃型和螺旋型）<br>③ 面缺陷：晶界、堆垛层错<br>④ 体缺陷：空洞、沉淀<br><br>缺陷对器件性能的影响：引入深能级→增加复合→降低载流子寿命→降低器件效率。"},
{t:"空位",cat:"杂质缺陷",d:"晶格中缺少一个原子而形成的点缺陷。<br><br>• 单空位：一个原子缺失<br>• 双空位(VV)：两个相邻空位<br>• 空位可以俘获/释放载流子→形成能级<br>• 空位在高温下浓度高，低温下冻结<br>• 空位是杂质扩散的媒介（空位机制）"},
{t:"位错",cat:"杂质缺陷",d:"晶体中一维的线缺陷。<br><br>• 刃型位错：可以理解为晶体中插入了半个原子面<br>• 螺旋位错：原子面沿位错线做螺旋形排列<br><br>位错对电学性质的影响：<br>• 位错线附近有应力场→能带弯曲<br>• 位错悬挂键→深能级<br>• 增加漏电流、降低击穿电压<br>• 降低少子寿命"},
// --- 载流子统计 ---
{t:"本征载流子浓度",cat:"载流子统计",d:"纯净半导体中由热激发产生的电子和空穴浓度（n=p=n_i）。<br><br>n_i² = N_c·N_v·exp(-E_g/kT)<br><br>室温值(300K)：<br>• Si: n_i = 1.5×10¹⁰ cm⁻³<br>• Ge: n_i = 2.4×10¹³ cm⁻³<br>• GaAs: n_i = 2.1×10⁶ cm⁻³<br><br>n_i强烈依赖温度和材料（E_g越大→n_i越小）。本征载流子浓度是理解半导体导电性的基准。"},
{t:"多子",cat:"载流子统计",d:"多数载流子的简称。N型半导体中多子是电子，P型半导体中多子是空穴。<br><br>多子浓度近似等于有效掺杂浓度：<br>N型: n ≈ N_D（杂质完全电离时）<br>P型: p ≈ N_A<br><br>多子的浓度和迁移率决定了半导体的电导率。"},
{t:"少子",cat:"载流子统计",d:"少数载流子的简称。N型半导体中少子是空穴，P型中少子是电子。<br><br>少子浓度：<br>N型: p₀ = n_i²/N_D<br>P型: n₀ = n_i²/N_A<br><br>少子虽然浓度低，但对器件性能极其关键：<br>• PN结电流由少子注入/抽取决定<br>• 少子寿命决定了器件的开关速度和效率<br>• 光电器件中光生载流子通常是少子"},
{t:"有效态密度",cat:"载流子统计",d:"将导带/价带中所有量子态的统计效果归结为带边处的等效态密度。<br><br>N_c = 2(2πm_n*kT/h²)^(3/2)<br>N_v = 2(2πm_p*kT/h²)^(3/2)<br><br>300K时：<br>Si: N_c=2.8×10¹⁹, N_v=1.04×10¹⁹ cm⁻³<br>GaAs: N_c=4.7×10¹⁷ cm⁻³<br><br>有效态密度使载流子浓度计算大大简化：n=N_c·exp(-(E_c-E_F)/kT)"},
{t:"玻尔兹曼近似",cat:"载流子统计",d:"当费米能级远离带边((E-E_F)>>kT)时，费米-狄拉克分布简化为：<br><br>f(E) ≈ exp(-(E-E_F)/kT)<br><br>适用条件：非简并半导体（N_D < N_c/4）。<br><br>简化后：<br>n = N_c·exp(-(E_c-E_F)/kT)<br>p = N_v·exp(-(E_F-E_v)/kT)<br><br>大多数室温半导体都满足此近似，是半导体物理最常用的简化。"},
// --- 输运性质 ---
{t:"迁移率",cat:"输运性质",d:"单位电场下载流子获得的平均漂移速度。<br><br>μ = v_d/E = qτ/m*<br><br>单位：cm²/(V·s)<br><br>典型值(300K, Si)：<br>• 电子: 1400 cm²/(V·s)<br>• 空穴: 450 cm²/(V·s)<br><br>GaAs电子: 8500 cm²/(V·s)（极高）<br><br>迁移率取决于：有效质量m*(能带结构)和散射时间τ(散射机制)。"},
{t:"散射",cat:"输运性质",d:"载流子在运动过程中与各种散射中心发生碰撞，改变运动方向和能量的过程。<br><br>主要散射机制：<br>① 声学波散射：μ∝T^(-3/2)，高温主导<br>② 光学波散射：GaAs中重要<br>③ 电离杂质散射：μ∝T^(3/2)/N_I，低温主导<br>④ 能谷间散射：多能谷半导体中<br><br>总迁移率由马西森定则确定：1/μ = 1/μ_声学 + 1/μ_杂质 + ..."},
{t:"声子",cat:"输运性质",d:"晶格振动能量的量子化单元。声子是准粒子（不是真实粒子），描述晶格振动的集体激发。<br><br>两种类型：<br>① 声学声子：相邻原子同相振动，低能量，温度T时大量存在<br>② 光学声子：相邻原子反相振动，高能量(~30-60meV)<br><br>声子参与：<br>• 散射载流子（限制迁移率）<br>• 间接跃迁中传递动量<br>• 热传导"},
{t:"爱因斯坦关系",cat:"输运性质",d:"联系扩散系数D和迁移率μ的关系：<br><br>D/μ = kT/q = V_T<br><br>室温V_T≈26mV。<br><br>物理含义：载流子的扩散和漂移通过热运动联系在一起。扩散快的载流子迁移率也高。<br><br>D_n = (kT/q)·μ_n<br>D_p = (kT/q)·μ_p"},
{t:"漂移电流",cat:"输运性质",d:"在外加电场作用下，载流子获得定向运动（漂移速度v_d=μE）形成的电流。<br><br>J_drift = q(nμ_n+pμ_p)·E = σE（欧姆定律）<br><br>低场区：v_d = μE（线性关系）<br>高场区：v_d趋于饱和速度v_sat（非线性）<br><br>Si中v_sat ≈ 1×10⁷ cm/s，这是MOSFET电流的基本限制。"},
{t:"扩散电流",cat:"输运性质",d:"载流子浓度存在空间梯度时，即使没有电场也会有定向运动。<br><br>J_diff = qD_n(dn/dx)（电子）<br>J_diff = -qD_p(dp/dx)（空穴）<br><br>扩散电流由费克定律描述：粒子流∝浓度梯度。<br><br>扩散电流是PN结电流的主要组成部分（正向注入的少子扩散）。"},
{t:"霍尔效应",cat:"输运性质",d:"电流通过样品并加垂直磁场时，产生横向电场（霍尔电场）的现象。<br><br>霍尔系数 R_H = E_y/(J_x·B_z)<br>N型：R_H = -1/(qn)（负）<br>P型：R_H = +1/(qp)（正）<br><br>应用：<br>• 判断导电类型（R_H符号）<br>• 测量载流子浓度（|R_H|=1/qn）<br>• 结合电阻率求霍尔迁移率<br>• 变温Hall求杂质电离能"},
{t:"饱和速度",cat:"输运性质",d:"高电场下载流子漂移速度趋于的极限值。<br><br>Si: v_sat ≈ 1×10⁷ cm/s<br>GaAs: v_sat ≈ 0.7×10⁷ cm/s<br><br>物理原因：强电场下载流子能量很高→光学声子散射增强→能量损失率=获取率→速度饱和。<br><br>饱和速度限制了MOSFET和HBT的最大电流和截止频率。"},
// --- 非平衡载流子 ---
{t:"非平衡载流子",cat:"非平衡载流子",d:"外部激发（光照、注入等）使载流子浓度偏离热平衡值的多余部分。<br><br>Δn = n - n₀（电子）<br>Δp = p - p₀（空穴）<br><br>小注入：Δn << n₀（多子浓度几乎不变）<br>大注入：Δn ≈ Δp >> n₀<br><br>非平衡载流子通过复合过程逐渐消失，寿命τ决定消失速率。"},
{t:"复合",cat:"非平衡载流子",d:"导带电子回到价带与空穴结合，使电子-空穴对消失的过程。<br><br>三种基本机制：<br>① 辐射复合：释放光子（直接带隙材料中重要）<br>② SRH复合：通过深能级缺陷（间接带隙中主要）<br>③ 俄歇复合：能量传给第三载流子（大注入时重要）<br><br>复合速率 U = Δp/τ（小注入时），τ为少子寿命。"},
{t:"SRH复合",cat:"非平衡载流子",d:"Shockley-Read-Hall复合：通过禁带中深能级缺陷（复合中心）进行的两步复合。<br><br>步骤：<br>① 电子被缺陷能级俘获：e_captured = σ_n·v_th·n·(1-f_T)<br>② 空穴被同一缺陷俘获：h_captured = σ_p·v_th·p·f_T<br><br>复合速率：<br>U = (np-n_i²)/[τ_p(n+n₁)+τ_n(p+p₁)]<br><br>是间接带隙半导体(Si,Ge)中最重要的复合机制。"},
{t:"少子寿命",cat:"非平衡载流子",d:"非平衡少子从产生到复合消失的平均存活时间τ。<br><br>Δp(t) = Δp(0)·exp(-t/τ)<br><br>影响因素：<br>• 复合中心浓度（越高→τ越短）<br>• 缺陷密度<br>• 温度<br>• 注入水平（大注入时俄歇复合使有效τ减小）<br><br>典型值：Si中τ ~ 1μs~1ms（取决于纯度和工艺）。<br><br>τ对器件影响：PN结开关速度∝τ；太阳能电池效率∝τ。"},
{t:"扩散长度",cat:"非平衡载流子",d:"少子在复合之前扩散的平均距离。<br><br>L_p = √(D_p·τ_p)（空穴扩散长度）<br>L_n = √(D_n·τ_n)（电子扩散长度）<br><br>典型值：Si中L_p ~ 10-100μm<br><br>物理意义：<br>• L >> 器件尺寸：少子可穿越器件→高效传输<br>• L << 器件尺寸：少子在途中就复合了→传输效率低<br><br>扩散长度是太阳能电池设计的关键参数。"},
{t:"准费米能级",cat:"非平衡载流子",d:"非平衡状态下，分别描述电子和空穴分布的等效费米能级。<br><br>n = N_c·exp(-(E_c-E_Fn)/kT)（电子准费米能级E_Fn）<br>p = N_v·exp(-(E_Fp-E_v)/kT)（空穴准费米能级E_Fp）<br><br>E_Fn和E_Fp的分离程度反映了偏离平衡的程度：<br>• 热平衡：E_Fn = E_Fp = E_F<br>• 非平衡：|E_Fn - E_Fp| > 0<br>• E_Fn - E_Fp > hν → 粒子数反转（激光条件）"},
{t:"连续性方程",cat:"非平衡载流子",d:"描述载流子浓度随时间和空间变化的基本方程：<br><br>∂p/∂t = G - U + (1/q)·∇·J_p<br>= G - Δp/τ + D_p·∂²Δp/∂x² - μ_p·E·∂Δp/∂x<br><br>各项含义：<br>G = 产生率（光照等）<br>U = 复合率<br>D_p·∂²Δp/∂x² = 扩散项<br>-μ_p·E·∂Δp/∂x = 漂移项<br><br>是分析所有半导体器件的出发点。"},
{t:"表面复合",cat:"非平衡载流子",d:"半导体表面的悬挂键和缺陷充当复合中心，使少子在表面处复合消失。<br><br>R_s = s·Δp_s<br>s = 表面复合速度（cm/s）<br><br>• s ~ 10²-10⁴ cm/s（取决于表面处理）<br>• 表面钝化可大幅降低s（如Si/SiO₂界面s<10 cm/s）<br><br>表面复合是影响太阳能电池效率的重要因素。表面钝化技术（SiN_x、Al₂O₃）是高效电池的关键。"},
// --- PN结 ---
{t:"PN结",cat:"PN结",d:"P型和N型半导体接触形成的界面区域。是几乎所有半导体器件的基本结构。<br><br>形成过程：<br>① 接触瞬间：多子扩散→交界处形成空间电荷区<br>② 空间电荷产生内建电场→阻止扩散<br>③ 达到平衡：扩散电流=漂移电流<br><br>关键参数：<br>• 内建电势 V_D=(kT/q)ln(N_A·N_D/n_i²)<br>• 耗尽层宽度 W∝√(V_D-V)"},
{t:"内建电场",cat:"PN结",d:"PN结空间电荷区中由电离杂质产生的电场。<br><br>P侧：电离受主(-qN_A) →负空间电荷<br>N侧：电离施主(+qN_D) →正空间电荷<br>电场方向：从N指向P<br><br>平衡时内建电场E阻止多子扩散，使扩散电流=漂移电流。<br><br>E_max = qN_B·W/(2ε_s)（突变结）。"},
{t:"耗尽层",cat:"PN结",d:"PN结空间电荷区（也叫空间电荷层、势垒区）。该区域内载流子浓度极低（被耗尽），只剩下固定的电离杂质电荷。<br><br>耗尽层近似：<br>• 假设耗尽区内n≈p≈0<br>• 只有电离杂质的空间电荷<br>• 耗尽区外保持中性<br><br>耗尽层宽度 W = √[2ε_s(V_D-V)(1/N_A+1/N_D)/q]"},
{t:"势垒",cat:"PN结",d:"PN结空间电荷区中电子（或空穴）需要克服的能量障碍。<br><br>零偏：势垒=qV_D（阻止多子扩散）<br>正偏：势垒=q(V_D-V)（降低→多子注入增大）<br>反偏：势垒=q(V_D+V_R)（增大→多子注入减小）<br><br>势垒的高低决定了PN结的电流大小。正向偏置降低势垒→电流指数增长。"},
{t:"雪崩击穿",cat:"PN结",d:"反向偏压足够大时，空间电荷区中电场极强→载流子获得足够能量→碰撞电离→产生新的电子-空穴对→级联倍增→电流急剧增大。<br><br>条件：<br>• V_BR > 5V（轻掺杂）<br>• 正温度系数（T↑→V_BR↑）<br>• 击穿时有噪声<br><br>应用：齐纳二极管稳压、APD内增益。"},
{t:"齐纳击穿",cat:"PN结",d:"重掺杂PN结中，耗尽层极窄→量子隧穿效应→价带电子直接隧穿到导带→电流急剧增大。<br><br>条件：<br>• V_BR < 5V（重掺杂 N > 10¹⁸cm⁻³）<br>• 负温度系数（T↑→V_BR↓，E_g↓隧穿更容易）<br><br>5V附近雪崩和齐纳两种机制共存，温度系数接近零。"},
{t:"势垒电容",cat:"PN结",d:"耗尽层两侧存储的空间电荷随电压变化形成的电容。<br><br>C_T = ε_s·A/W<br>W∝(V_D-V)^(1/2)（突变结）<br><br>所以 C_T ∝ (V_D-V)^(-1/2)<br><br>实际测量常用1/C² vs V关系来求N_B和V_D：<br>1/C² = 2(V_D-V)/(qε_s·N_B·A²)"},
{t:"扩散电容",cat:"PN结",d:"正向偏置时，扩散区中存储的少子电荷随电压变化形成的电容。<br><br>C_D = τ·I/(kT/q)（正偏时）<br><br>特点：<br>• 只在正偏时显著（反偏时可忽略）<br>• 正比于电流I<br>• 与少子寿命τ成正比<br><br>扩散电容是限制PN结频率响应的主要因素之一。"},
// --- 金属-半导体接触 ---
{t:"功函数",cat:"金属半导体接触",d:"将一个电子从费米能级移到真空能级所需的最小能量。<br><br>W = E_vacuum - E_F<br><br>典型值：<br>• Al: 4.2 eV<br>• Au: 5.1 eV<br>• Si(n型): 4.6 eV<br>• GaAs(n型): 4.07 eV<br><br>功函数差决定了金属-半导体接触的势垒高度。"},
{t:"电子亲和能",cat:"金属半导体接触",d:"将一个电子从导带底移到真空能级所需的能量。<br><br>χ = E_vacuum - E_c<br><br>Si: χ = 4.05 eV<br>GaAs: χ = 4.07 eV<br>Al_xGa_{1-x}As: χ随x变化<br><br>Anderson规则：ΔE_c = χ₁ - χ₂（异质结导带偏移）。"},
{t:"肖特基势垒",cat:"金属半导体接触",d:"金属与半导体接触时，在半导体侧形成的整流势垒。<br><br>N型半导体：Φ_Bn = W_m - χ<br>P型半导体：Φ_Bp = E_g/q - (W_m - χ)<br><br>势垒高度取决于金属功函数和半导体电子亲和能。但界面态会导致费米能级钉扎，使实际势垒与理论预测有偏差。"},
{t:"热电子发射",cat:"金属半导体接触",d:"肖特基二极管中电流的主要输运机制。半导体中的高能电子越过势垒发射到金属中。<br><br>J = A*T²·exp(-Φ_B/kT)·[exp(qV/kT) - 1]<br><br>• 比PN结的扩散电流大得多（I_s大10³-10⁶倍）<br>• 正向压降小（0.3-0.5V vs PN结0.6-0.7V）<br>• 开关速度极快（无少子存储）"},
{t:"镜像力",cat:"金属半导体接触",d:"金属-半导体界面处，电子在金属中感应出等量异性电荷（镜像电荷），对电子产生吸引力→降低势垒高度。<br><br>ΔΦ = √[qE_max/(4πε_s)]<br><br>影响：<br>• 有效势垒降低→反向电流增大<br>• 降低量随反偏增大→I-V偏离理想<br>• 是肖特基二极管反向电流随电压增大而增大的原因之一"},
{t:"费米能级钉扎",cat:"金属半导体接触",d:"金属-半导体界面处高密度的界面态将费米能级钉在某个固定位置，使势垒高度与金属功函数几乎无关。<br><br>界面态密度 D_it > 10¹³ cm⁻²·eV⁻¹时发生强钉扎。<br><br>实验上Si的肖特基势垒≈0.6-0.7E_g（与金属无关）<br>GaAs的肖特基势垒≈0.8-0.9E_g（强钉扎）<br><br>费米钉扎使得通过选择金属来调控势垒高度非常困难。"},
{t:"欧姆接触",cat:"金属半导体接触",d:"金属与半导体之间的非整流接触，接触电阻极小，电流可双向自由通过。<br><br>实现方法：<br>① 重掺杂+隧穿：在半导体表面重掺杂(N>10¹⁹)→势垒极薄→电子隧穿→低接触电阻<br>② 选择低功函数金属：对N型，选W_m<χ的金属（如Al）<br>③ 金属硅化物：NiSi₂、TiSi₂等与Si形成低阻接触<br><br>欧姆接触是所有半导体器件必须具备的端子连接。"},
// --- MIS与MOSFET ---
{t:"MIS结构",cat:"MIS结构",d:"Metal-Insulator-Semiconductor三明治结构，是MOS器件的基础。<br><br>三层：金属(栅极) - 绝缘层(氧化物) - 半导体(衬底)<br><br>施加栅压V_G可调控半导体表面的能带弯曲：<br>• 积累：表面多数载流子浓度增大<br>• 耗尽：表面载流子被排斥<br>• 反型：表面导电类型反转"},
{t:"MOSFET",cat:"MIS结构",d:"Metal-Oxide-Semiconductor Field Effect Transistor。利用MIS结构反型层作为导电沟道的场效应晶体管。<br><br>四端器件：栅极(G)、源极(S)、漏极(D)、衬底(B)<br><br>工作原理：<br>V_GS > V_T → 反型层形成→沟道导通<br>V_DS → 驱动电流从S到D<br><br>CMOS = NMOS + PMOS，是数字集成电路的基本单元。"},
{t:"阈值电压",cat:"MIS结构",d:"MOSFET中使反型层（沟道）刚开始形成所需的最小栅源电压。<br><br>V_T = Φ_ms + 2φ_F + Q_dep/C_ox<br><br>影响因素：<br>• 氧化层厚度 t_ox（↑→V_T↑）<br>• 衬底掺杂 N_A（↑→V_T↑）<br>• 界面电荷 Q_ox（↑→V_T变化）<br>• 衬底偏压 V_SB（体效应→V_T↑）<br><br>先进CMOS通过多种技术调控V_T（功函数工程、halo注入等）。"},
{t:"反型层",cat:"MIS结构",d:"MIS结构中半导体表面导电类型发生反转的薄层。<br><br>以P型衬底为例：<br>• V_G > 0：表面电子浓度增加<br>• V_G > V_T：表面电子浓度 > 体内空穴浓度<br>• 表面从P型变为N型→形成N型反型层<br><br>反型层厚度仅~5-10nm（三角势阱中的量子化电子气）<br><br>反型层是MOSFET的导电沟道。"},
{t:"耗尽层",cat:"MIS结构",d:"MIS结构中半导体表面的载流子被栅压排斥后留下的无自由载流子区域。<br><br>• 积累区：无耗尽层<br>• 耗尽区：耗尽层宽度W随V_G增大<br>• 反型区：W达到最大值W_max<br><br>W_max = √[4ε_s·φ_F/(qN_A)]<br><br>耗尽层电容 C_s = ε_s/W 与氧化层电容 C_ox 串联构成MIS总电容。"},
{t:"累积层",cat:"MIS结构",d:"MIS结构中半导体表面的多数载流子浓度高于体内的层。<br><br>以P型衬底为例：V_G < 0（负偏压）→空穴被吸引到表面→表面空穴浓度 > 体内浓度→累积层。<br><br>累积层中载流子浓度极高→C-V曲线上电容趋近C_ox。<br><br>累积区的C-V响应很快（多子运动快），高频和低频C-V曲线重合。"},
{t:"表面态",cat:"MIS结构",d:"半导体表面因晶格周期性中断而产生的电子态。<br><br>来源：<br>① 悬挂键：表面原子缺少配对原子<br>② 界面缺陷：氧化层/半导体界面的不完美<br>③ 可动离子：Na⁺等碱金属离子<br><br>表面态密度D_it：<br>• 未钝化Si: ~10¹³ cm⁻²·eV⁻¹<br>• 热氧化Si/SiO₂: < 10¹⁰ cm⁻²·eV⁻¹<br><br>高D_it→C-V曲线畸变→V_T漂移→器件性能退化。"},
{t:"亚阈值摆幅",cat:"MIS结构",d:"MOSFET从关断到刚好开启，漏电流每变化一个数量级所需的栅压变化。<br><br>SS = dV_GS/d(log₁₀ I_D) [mV/dec]<br><br>理论极限(室温)：SS = 60 mV/dec<br>实际值：70-100 mV/dec（受界面态等影响）<br><br>SS越小→开关特性越陡→功耗越低→更适合低功耗应用。<br><br>TFET(隧穿FET)可以突破60 mV/dec极限。"},
// --- 异质结与光电器件 ---
{t:"异质结",cat:"异质结光学",d:"两种不同禁带宽度的半导体形成的结。<br><br>分类：<br>• 反型异质结：n-p或p-n（如n-AlGaAs/p-GaAs）<br>• 同型异质结：n-n或p-p（如n-AlGaAs/n-GaAs）<br><br>关键特征：能带在界面处不连续→ΔE_c和ΔE_v<br><br>应用：DH激光器、HEMT、HBT、太阳能电池等。"},
{t:"二维电子气",cat:"异质结光学",d:"在异质结界面的三角势阱中，电子在垂直方向被量子化限制，只能在平面内自由运动。<br><br>2DEG特点：<br>• 面浓度 n_s ~ 10¹² cm⁻³<br>• 远离电离杂质→散射极弱→迁移率极高<br>• 低温μ可超10⁶ cm²/(V·s)<br><br>2DEG是HEMT的核心，也是量子霍尔效应的实验平台。"},
{t:"量子阱",cat:"异质结光学",d:"两种宽禁带材料夹一层窄带隙材料（厚度5-50nm），形成一维受限的势阱。<br><br>子能级：E_n = n²π²ℏ²/(2m*d²)<br><br>量子阱应用：<br>• QW激光器：低阈值、窄线宽<br>• QW红外探测器<br>• 量子级联激光器(QCL)<br>• 高效LED"},
{t:"激子",cat:"异质结光学",d:"光激发产生的电子-空穴对通过库仑引力束缚在一起的类氢束缚态。<br><br>结合能：<br>Si: ~15meV<br>GaAs: ~4meV<br>CdSe: ~15meV<br><br>激子吸收光谱：在带边以下出现一系列尖锐吸收峰。<br><br>量子阱/量子点中激子结合能增大（受限增强库仑作用）。低温下才能观察到激子效应。"},
{t:"受激辐射",cat:"异质结光学",d:"一个光子诱导处于高能级的电子跃迁到低能级，释放一个与入射光子完全相同（同频率、同方向、同相位）的光子。<br><br>这是激光器发光的基本物理过程。<br><br>实现条件（Bernard-Duraffourg条件）：<br>E_Fn - E_Fp > hν<br>即电子和空穴的准费米能级之差大于光子能量→粒子数反转。"},
{t:"粒子数反转",cat:"异质结光学",d:"高能级的电子数多于低能级的电子数，即f_c(E₂) > f_v(E₁)。<br><br>正常热平衡：低能级占据概率>高能级→吸收>受激辐射<br>粒子数反转：高能级占据概率>低能级→受激辐射>吸收→光放大<br><br>实现方法：电流注入（电泵浦）或光泵浦<br>必要条件：E_Fn - E_Fp > hν（直接带隙材料更容易实现）"},
{t:"光增益",cat:"异质结光学",d:"受激辐射产生的光子数大于吸收消耗的光子数→光被放大。<br><br>增益系数 g(hν) 取决于：<br>• 粒子数反转程度（f_c - f_v）<br>• 跃迁矩阵元|M|²<br>• 联合态密度ρ_r<br><br>阈值条件：Γ·g_th = α_i + α_m<br>Γ = 光场限制因子<br>α_i = 内部损耗<br>α_m = 镜面损耗 = (1/2L)ln(1/R₁R₂)"},
// --- 特殊效应 ---
{t:"塞贝克效应",cat:"特殊效应",d:"两种不同导体/半导体构成的回路中，两个接头温度不同时产生电动势（温差电效应）。<br><br>塞贝克系数 S = ΔV/ΔT<br>• 金属：S ~ 1-10 μV/K<br>• 半导体：S ~ 100-200 μV/K<br><br>半导体S远大于金属，因为载流子浓度低→温度引起的相对浓度梯度大。<br><br>应用：热电偶、热电发电机、热电制冷器。"},
{t:"帕尔帖效应",cat:"特殊效应",d:"电流通过两种不同导体的结面时，在结面处吸收或放出热量（可逆热效应，与焦耳热不同）。<br><br>帕尔帖系数 Π = S·T<br>热流 Q = Π·I<br><br>应用：半导体制冷器（TEC）。Peltier制冷器无运动部件、无噪声、体积小，用于激光器温控、CPU散热等。"},
{t:"压阻效应",cat:"特殊效应",d:"对半导体施加应力时，能带结构发生变化→电阻率随之改变的现象。<br><br>ΔR/R = π_l·σ_l + π_t·σ_t<br>π_l, π_t = 纵向和横向压阻系数<br>σ_l, σ_t = 纵向和横向应力<br><br>Si的压阻系数很大(π ~ 100×10⁻¹¹ Pa⁻¹)，所以Si压力传感器灵敏度高。<br><br>MEMS压力传感器就是利用压阻效应。"},
{t:"磁阻效应",cat:"特殊效应",d:"在磁场中，半导体的电阻率增大的现象。<br><br>物理原因：洛伦兹力使载流子偏转→有效漂移路径变长→电阻增大。<br><br>几何磁阻：与样品形状有关<br>物理磁阻：与能带结构有关（多能谷效应）<br><br>应用：磁传感器、位置检测、电流传感器。"},
{t:"光电导效应",cat:"特殊效应",d:"光照使半导体中产生非平衡载流子→电导率增大的现象。<br><br>Δσ = q(Δn·μ_n + Δp·μ_p)<br><br>光电导探测器原理：光照→光电导变化→转化为电信号。<br><br>增益 = τ/τ_tr（寿命/渡越时间），τ越大增益越高。<br><br>材料：PbS、PbSe（红外）、InSb（远红外）。"},
{t:"量子霍尔效应",cat:"特殊效应",d:"二维电子气在强磁场+低温下，霍尔电阻精确量子化的现象。<br><br>整数QHE：R_H = h/(νe²)（ν=1,2,3...）<br>ν = 朗道能级填充因子<br><br>物理图像：费米能级落在朗道能级之间→纵向电阻=0→霍尔电阻平台<br><br>FQHE：ν=1/3,2/5...分数→电子-电子相互作用→分数电荷准粒子。<br><br>R_K = h/e² = 25812.807Ω 是电阻基准。"},
{t:"热载流子",cat:"特殊效应",d:"在强电场下，载流子从电场获得的能量来不及通过散射传递给晶格→载流子有效温度T_e > 晶格温度T_L。<br><br>T_e = T_L(1 + E²/E_c²)<br><br>热载流子效应：<br>• 速度过冲（短暂超过饱和速度）<br>• 碰撞电离（高能载流子产生新载流子）<br>• 热载流子注入氧化层（MOS器件可靠性问题）<br>• 阈值电压漂移"},
{t:"超晶格",cat:"特殊效应",d:"两种不同半导体材料交替生长形成的周期性多层结构，周期(a+b)通常为几~几十nm。<br><br>能带结构：形成微带(miniband)和微隙(minigap)。<br><br>微带宽度 ΔE ∝ exp(-κd)，d=势垒宽度。<br><br>应用：<br>• 量子级联激光器(QCL)：子能级间跃迁→中红外/THz激光<br>• 超晶格红外探测器<br>• 共振隧穿二极管(RTD)"},
{t:"非晶态",cat:"特殊效应",d:"原子排列没有长程有序（无周期性），但短程有序（配位数与晶体相同）的物质状态。<br><br>非晶Si(a-Si:H)特点：<br>• 光学带隙~1.7-1.8eV（大于晶态1.12eV）<br>• 迁移率极低(~1 cm²/Vs vs 晶态1400)<br>• 带尾态密度高<br>• 可在玻璃衬底上低温沉积<br><br>应用：薄膜太阳能电池、薄膜晶体管(TFT)、平板显示器。"},
{t:"能带弯曲",cat:"特殊效应",d:"半导体中因电场或空间电荷导致电子势能随位置变化，表现为能带位置的空间变化。<br><br>• 电子能量向上=势能增大（电子不喜欢）<br>• 电子能量向下=势能减小（电子喜欢）<br><br>能带弯曲出现在：<br>• PN结空间电荷区<br>• 肖特基势垒区<br>• MIS结构表面<br>• 异质结界面<br><br>内建电场 E = (1/q)·dE_c/dx"},
{t:"势函数",cat:"特殊效应",d:"描述电子在晶格中所受的周期性势场V(r)。是薛定谔方程中的核心量。<br><br>周期势场的性质：V(r) = V(r+R)，其中R是任意格矢。<br><br>正是周期性势场的存在→布洛赫定理→能带形成→半导体的全部电学和光学性质。<br><br>近自由电子模型中将周期势作为微扰→在BZ边界产生能隙。"},
];

// ========== 术语弹窗功能 ==========
var glossaryIdx = -1;
function initGlossary(){
  var bodies = document.querySelectorAll(".kp-body");
  bodies.forEach(function(body){
    processGlossaryNode(body);
  });
}

function processGlossaryNode(el){
  var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
  var textNodes = [];
  while(walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(function(node){
    var text = node.textContent;
    if(!text || text.length < 2) return;
    var parent = node.parentNode;
    if(parent && parent.tagName && (parent.tagName==="SCRIPT"||parent.tagName==="STYLE"||parent.classList&&parent.classList.contains("kw-term"))) return;
    // Build regex from all glossary terms (sorted by length desc to match longer first)
    var sorted = glossary.slice().sort(function(a,b){return b.t.length - a.t.length});
    var pattern = sorted.map(function(g){return g.t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|");
    if(!pattern) return;
    var regex = new RegExp("("+pattern+")","g");
    if(!regex.test(text)) return;
    var frag = document.createDocumentFragment();
    var lastIdx = 0;
    var m;
    regex.lastIndex = 0;
    while((m = regex.exec(text)) !== null){
      if(m.index > lastIdx) frag.appendChild(document.createTextNode(text.substring(lastIdx, m.index)));
      var span = document.createElement("span");
      span.className = "kw-term";
      span.textContent = m[1];
      span.setAttribute("data-term", m[1]);
      span.onclick = function(){showTerm(this.getAttribute("data-term"))};
      frag.appendChild(span);
      lastIdx = regex.lastIndex;
    }
    if(lastIdx < text.length) frag.appendChild(document.createTextNode(text.substring(lastIdx)));
    parent.replaceChild(frag, node);
  });
}

function showTerm(term){
  var g = null;
  for(var i=0;i<glossary.length;i++){
    if(glossary[i].t === term){g=glossary[i];glossaryIdx=i;break;}
  }
  if(!g) return;
  document.getElementById("kwTitle").textContent = g.t;
  document.getElementById("kwBody").innerHTML = "<p>"+g.d+"</p>";
  document.getElementById("kwTag").textContent = g.cat;
  document.getElementById("kwOverlay").classList.add("show");
}

function closeTerm(){
  document.getElementById("kwOverlay").classList.remove("show");
}

function navTerm(dir){
  glossaryIdx += dir;
  if(glossaryIdx < 0) glossaryIdx = glossary.length - 1;
  if(glossaryIdx >= glossary.length) glossaryIdx = 0;
  var g = glossary[glossaryIdx];
  document.getElementById("kwTitle").textContent = g.t;
  document.getElementById("kwBody").innerHTML = "<p>"+g.d+"</p>";
  document.getElementById("kwTag").textContent = g.cat;
}

function init(){
  renderSidebar();
  renderChapter(0);
  renderFormulas();
  renderExam();
  setupSearch();
  setupKeyboard();
  initGlossary();
}

function renderSidebar(){
  var sb = document.getElementById("sidebar");
  var html = '<div class="sidebar-header"><h1>半导体物理 知识库</h1><p>刘恩科《半导体物理学》第7版</p></div>';
  html += '<div class="nav-section"><div class="nav-label">快速导航</div>';
  html += '<div class="nav-item" onclick="showFormulas()"><div class="ch-num" style="background:rgba(102,126,234,0.2);color:#667eea">∑</div><div class="ch-title">公式手册</div><div class="ch-badge">'+formulasCount()+'个</div></div>';
  html += '<div class="nav-item" onclick="showExam()"><div class="ch-num" style="background:rgba(251,191,36,0.2);color:#fbbf24">考</div><div class="ch-title">考研真题</div><div class="ch-badge">'+examQuestions.length+'道</div></div>';
  html += '</div>';
  html += '<div class="nav-section"><div class="nav-label">章节目录</div>';
  chapters.forEach(function(ch,i){
    var examCount = ch.kps.filter(function(k){return k.exam}).length;
    html += '<div class="nav-item'+(i===0?" active":"")+'" onclick="showCh('+i+')">';
    html += '<div class="ch-num" style="background:rgba(102,126,234,0.15);color:#667eea">'+(i+1)+'</div>';
    html += '<div class="ch-title">'+ch.title.replace(/第\d+章\s*/,"")+'</div>';
    html += '<div class="ch-badge">'+ch.kps.length+"个"+(examCount?" · 📝"+examCount:"")+'</div>';
    html += '</div>';
  });
  html += '</div>';
  sb.innerHTML = html;
}

function formulasCount(){
  var c=0; formulaGroups.forEach(function(g){c+=g.formulas.length}); return c;
}

function renderChapter(idx){
  var main = document.getElementById("main");
  var ch = chapters[idx];
  var html = '<div class="chapter active" id="ch-'+idx+'">';
  html += '<div class="chapter-header">';
  html += '<span class="chapter-tag">'+(ch.tag||'')+'</span>';
  html += '<h2>'+ch.title+'</h2>';
  html += '<div class="chapter-sub">'+(ch.sub||ch.subtitle||'')+'</div>';
  html += '<div class="meta">';
  html += '<span class="meta-item">📝 '+ch.kps.length+' 个知识点</span>';
  var examN = ch.kps.filter(function(k){return k.exam}).length;
  if(examN) html += '<span class="meta-item">🎯 '+examN+' 个考研高频</span>';
  html += '</div></div>';

  ch.kps.forEach(function(kp,j){
    var isExam = kp.exam ? " exam" : "";
    html += '<div class="kp'+isExam+'" id="kp-'+idx+"-"+j+'">';
    html += '<div class="kp-head" onclick="toggleKP('+idx+","+j+')">';
    html += '<span class="kp-title">'+kp.n+'</span>';
    if(kp.exam) html += '<span class="badge badge-exam">考研高频</span>';
    html += '<span class="kp-stars">'+kp.s+'</span>';
    html += '</div>';
    html += '<div class="kp-body" id="kb-'+idx+"-"+j+'">'+kp.body+'</div>';
    html += '</div>';
  });

  if(ch.kg){
    html += '<div class="kg-section"><h3 style="font-size:1em;margin-bottom:12px;color:var(--accent)">🔗 知识图谱 — '+ch.title.replace(/第\d+章\s*/,"")+'</h3>';
    html += '<canvas class="kg-canvas" id="kg-'+idx+'" width="600" height="300"></canvas></div>';
  }
  html += '</div>';
  main.innerHTML = html;

  if(ch.kg) drawKG(idx);
  initGlossary();

  document.querySelectorAll(".nav-item").forEach(function(el){el.classList.remove("active")});
  var navItems = document.querySelectorAll(".nav-section:last-child .nav-item");
  if(navItems[idx]) navItems[idx].classList.add("active");
}

function showCh(idx){
  window.scrollTo(0,0);
  renderChapter(idx);
}

function showFormulas(){
  document.getElementById("sec-formulas").style.display="block";
  document.getElementById("sec-exam").style.display="none";
  document.querySelectorAll(".chapter").forEach(function(el){el.style.display="none"});
  document.querySelectorAll(".nav-item").forEach(function(el){el.classList.remove("active")});
  document.querySelectorAll(".nav-section:first-child .nav-item")[0].classList.add("active");
  window.scrollTo(0,0);
}

function showExam(){
  document.getElementById("sec-formulas").style.display="none";
  document.getElementById("sec-exam").style.display="block";
  document.querySelectorAll(".chapter").forEach(function(el){el.style.display="none"});
  document.querySelectorAll(".nav-item").forEach(function(el){el.classList.remove("active")});
  document.querySelectorAll(".nav-section:first-child .nav-item")[1].classList.add("active");
  window.scrollTo(0,0);
}

function renderFormulas(){
  var main = document.getElementById("main");
  var sec = document.createElement("div");
  sec.id = "sec-formulas";
  sec.className = "chapter";
  var html = '<div class="chapter-header"><h2>∑ 公式速查手册</h2><div class="chapter-sub">覆盖全书核心公式，按章节分类</div></div>';

function renderExam(){

  sec.id = "sec-exam";

function toggleKP(ch,i){
  var el = document.getElementById("kp-"+ch+"-"+i);
  el.classList.toggle("closed");
}

function toggleExam(i){
  var el = document.getElementById("eq-"+i);
  el.classList.toggle("open");
}

function drawKG(idx){
  var canvas = document.getElementById("kg-"+idx);
  if(!canvas) return;
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  var kg = chapters[idx].kg;
  ctx.clearRect(0,0,W,H);

  kg.edges.forEach(function(e){
    var a=kg.nodes[e.a], b=kg.nodes[e.b];
    ctx.beginPath();
    ctx.moveTo(a.x/100*W, a.y/100*H);
    ctx.lineTo(b.x/100*W, b.y/100*H);
    ctx.strokeStyle="rgba(255,255,255,0.15)";
    ctx.lineWidth=1.5;
    ctx.stroke();
    if(e.l){
      var mx=(a.x+b.x)/2/100*W, my=(a.y+b.y)/2/100*H;
      ctx.font="10px sans-serif";
      ctx.fillStyle="rgba(255,255,255,0.4)";
      ctx.textAlign="center";
      ctx.fillText(e.l, mx, my-4);
    }
  });

  kg.nodes.forEach(function(n){
    var cx=n.x/100*W, cy=n.y/100*H;
    ctx.beginPath();
    ctx.arc(cx,cy,n.r,0,Math.PI*2);
    ctx.fillStyle=n.c+"33";
    ctx.fill();
    ctx.strokeStyle=n.c;
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.font="bold 11px sans-serif";
    ctx.fillStyle=n.c;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(n.l, cx, cy);
  });
}

function setupSearch(){
  var input = document.getElementById("searchInput");
  if(!input) return;
  input.addEventListener("input", function(){ doSearch(this.value) });
}

function doSearch(query){
  query = query.trim().toLowerCase();
  var results = document.getElementById("searchResults");
  if(!query){
    results.innerHTML = "";
    results.style.display = "none";
    return;
  }
  results.style.display = "block";

  var keywords = query.split(/\s+/);
  var matches = [];

  chapters.forEach(function(ch,i){
    ch.kps.forEach(function(kp,j){
      if(examOnly && !kp.exam) return;
      var text = (kp.n+" "+kp.body).toLowerCase();
      var match = keywords.every(function(kw){ return text.indexOf(kw) !== -1 });
      if(match) matches.push({ch:i, kp:j, name:kp.n, stars:kp.s, exam:kp.exam});
    });
  });

  var html = '<div class="search-count">找到 '+matches.length+' 个结果</div>';
  var grouped = {};
  matches.forEach(function(m){
    if(!grouped[m.ch]) grouped[m.ch] = [];
    grouped[m.ch].push(m);
  });

  Object.keys(grouped).forEach(function(ci){
    var ch = chapters[ci];
    html += '<div class="search-group"><div class="search-group-title">'+ch.title+'</div>';
    grouped[ci].forEach(function(m){
      html += '<div class="kp" style="margin-bottom:6px"><div class="kp-head" onclick="goResult('+m.ch+","+m.kp+')">';
      html += '<span class="kp-title">'+highlightText(m.name, keywords)+'</span>';
      if(m.exam) html += '<span class="badge badge-exam">考研高频</span>';
      html += '<span class="kp-stars">'+m.stars+'</span></div></div>';
    });
    html += '</div>';
  });

  results.innerHTML = html;
}

function highlightText(text, keywords){
  var result = text;
  keywords.forEach(function(kw){
    if(kw.length < 1) return;
    var regex = new RegExp("("+kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    result = result.replace(regex, '<span class="search-highlight">$1</span>');
  });
  return result;
}

function goResult(chIdx, kpIdx){
  showCh(chIdx);
  setTimeout(function(){
    var el = document.getElementById("kp-"+chIdx+"-"+kpIdx);
    if(el){
      el.scrollIntoView({behavior:"smooth",block:"center"});
      el.classList.add("highlight");
      setTimeout(function(){el.classList.remove("highlight")},2000);
    }
  },100);
}

function toggleExamOnly(){
  examOnly = !examOnly;
  var btn = document.getElementById("examBtn");
  if(btn) btn.classList.toggle("active", examOnly);
  var input = document.getElementById("searchInput");
  if(input && input.value) doSearch(input.value);
}

function setupKeyboard(){
  document.addEventListener("keydown", function(e){
    if(e.target.tagName==="INPUT") return;
    if(e.key==="ArrowRight" || e.key==="ArrowDown"){
      e.preventDefault();
      var active = document.querySelector(".nav-section:last-child .nav-item.active");
      if(active){
        var items = Array.from(document.querySelectorAll(".nav-section:last-child .nav-item"));
        var idx = items.indexOf(active);
        if(idx < items.length-1) items[idx+1].click();
      }
    }
    if(e.key==="ArrowLeft" || e.key==="ArrowUp"){
      e.preventDefault();
      var active = document.querySelector(".nav-section:last-child .nav-item.active");
      if(active){
        var items = Array.from(document.querySelectorAll(".nav-section:last-child .nav-item"));
        var idx = items.indexOf(active);
        if(idx > 0) items[idx-1].click();
      }
    }
  });
}

window.addEventListener("DOMContentLoaded", init);
</script>
